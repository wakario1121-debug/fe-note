let pastTab=(()=>{ try{ return localStorage.getItem("fe-past-tab")||"app"; }catch(e){ return "app"; } })();
function renderPast(){
  const All=pastList(), isApp=p=>p.src==="app";
  const tab=S.prun?"app":pastTab, Lst=All.filter(p=>tab==="app"?isApp(p):!isApp(p));
  const nA=All.filter(isApp).length, nD=All.length-nA;
  const tabBtn=(k,t,n)=>`<button class="chip" data-ptab="${k}" style="${tab===k?"background:var(--accent);color:var(--accent-ink);border-color:var(--accent)":""}">${t}${n?`（${n}回）`:""}</button>`;
  $("#v-past").innerHTML=`
  <div><div class="eyebrow">科目A・科目B ／ 過去問</div><h2 style="font-size:26px;margin-top:4px">過去問</h2>
  <p class="lead">${tab==="app"?"アプリの中で過去問を解くと、点数・苦手な分野・間違えた問題がそのまま記録されます。":"過去問道場のサイトで解いた結果は、成績CSVを取り込んでこちらに記録します。アプリで解いた結果とは分けて集計します。"}</p></div>
  <div class="chips" style="margin:-4px 0 2px">${tabBtn("app","アプリで解く",nA)}${tabBtn("dojo","過去問道場のCSV",nD)}</div>
  ${tab==="app"?(S.prun?pastRunHTML():pastStartHTML()):`<div class="panel"><div class="eyebrow">過去問道場の成績を取り込む</div>
    <p class="small-muted" style="margin:4px 0 0">過去問道場のサイトで解いたら、成績画面から CSV ファイル（report〜.csv）をダウンロードして、ここで取り込みます。</p>
    <div class="drop" id="drop" style="margin-top:10px;border-radius:10px">
      <span class="small-muted">ファイルを選ぶか、パソコンならここにドラッグ</span>
      <label class="btn" for="past-file" style="cursor:pointer">CSVファイルを選ぶ</label>
      <input type="file" id="past-file" accept=".csv,text/csv" hidden>
    </div></div>`}
  ${pastStatsHTML(Lst,tab)}
  <p class="small-muted" style="margin:0">問題の出典：基本情報技術者試験 公開問題 科目A・科目B（令和5〜8年度）／令和元年秋期 午前（独立行政法人情報処理推進機構）。公開問題は原文のまま掲載し（科目Bは問題冊子の画像）、令和元年秋期は図が要らない問題だけを選んで一部の表記を簡略化しています。解説はこのアプリで作成したものです。ほかの解説は <a href="https://www.fe-siken.com/" target="_blank" rel="noopener">基本情報技術者試験ドットコム</a> の過去問道場でも読めます。</p>`;
  const root=$("#v-past");
  root.querySelectorAll("[data-prun]").forEach(b=>b.addEventListener("click",()=>startPastRun(b.dataset.prun)));
  if(S.prun) bindPastRun(root);
  root.querySelectorAll("[data-pqx]").forEach(b=>b.addEventListener("click",()=>{ const d=b.closest("details"); if(d) PQX._open=d.dataset.wr; explainPQ(b.dataset.pqx,b.dataset.pick); }));
  if(PQX._open){ const d=root.querySelector(`details[data-wr="${PQX._open}"]`); if(d) d.open=true; }
  root.querySelectorAll("[data-ptab]").forEach(b=>b.addEventListener("click",()=>{ if(S.prun&&b.dataset.ptab!=="app"){ toast("いま解いている途中です。終えてから切り替えてください"); return; } pastTab=b.dataset.ptab; try{ localStorage.setItem("fe-past-tab",pastTab); }catch(e){} renderPast(); }));
  const pf=$("#past-file"); if(pf) pf.addEventListener("change",e=>{ importPastFile(e.target.files[0]); e.target.value=""; });
  const dz=$("#drop");
  if(dz){ dz.addEventListener("dragover",e=>{ e.preventDefault(); dz.classList.add("over"); });
  dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz.addEventListener("drop",e=>{ e.preventDefault(); dz.classList.remove("over"); importPastFile(e.dataTransfer.files[0]); }); }
  root.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.armed){ S.past[b.dataset.del]={deleted:true,date:S.past[b.dataset.del].date}; save(); toast("結果を削除しました"); renderPast(); }
    else { b.dataset.armed="1"; b.textContent="もう一度押すと削除"; }
  }));
  bindJumps(root);
}

const ANIMCARD={"kiso:0":"twos","algo:0":"stackq","algo:1":"stackq","algo:2":"bsearch"};
const animBtn=(id,label)=>`<button class="btn anim-btn" data-anim="${id}">▶ ${esc(label||"アニメで見る")}</button>`;

const PL={a:null,k:0,states:[],playing:false,tok:0,t:null,t2:null};
function plBuild(a){
  const svg=$("#pl-svg"); svg.setAttribute("viewBox",`0 0 360 ${a.h||230}`);
  let h=a.bg?a.bg():"";
  a.els.forEach(e=>{
    if(e.type==="box") h+=`<g class="ael" id="el-${e.id}"><rect class="bx" width="${e.w}" height="${e.h}" rx="5"/><text x="${e.w/2}" y="${e.h/2+5}" text-anchor="middle" class="mono b"></text></g>`;
    else if(e.type==="label") h+=`<g class="ael" id="el-${e.id}"><text text-anchor="${e.anchor||"middle"}"></text></g>`;
    else if(e.type==="code") h+=`<g class="ael" id="el-${e.id}">${e.lines.map((l,i)=>`<rect class="cl" y="${i*20}" width="${e.w}" height="20" rx="3"/><text x="6" y="${i*20+14}" class="mono s" style="white-space:pre">${esc(l)}</text>`).join("")}</g>`;
  });
  svg.innerHTML=h;
  // 場面ごとの状態を前から積み上げておく
  let cur={}; a.els.forEach(e=>{ cur[e.id]={x:e.x,y:e.y,t:e.t,cls:e.cls,op:e.op===undefined?1:e.op,hl:-1,tcls:""}; });
  PL.states=a.steps.map(st=>{ const n={}; Object.keys(cur).forEach(k=>{ n[k]=Object.assign({},cur[k],(st.s||{})[k]||{}); }); cur=n; return n; });
}
function plApply(k){
  const st=PL.states[k];
  PL.a.els.forEach(e=>{
    const s=st[e.id], g=document.getElementById("el-"+e.id); if(!g) return;
    g.style.transform=`translate(${s.x}px,${s.y}px)`; g.style.opacity=s.op;
    if(e.type==="box"){ g.querySelector("rect").setAttribute("class",s.cls||"bx"); const tx=g.querySelector("text"); tx.textContent=s.t; tx.setAttribute("class","mono b "+(s.tcls||"")); }
    else if(e.type==="label"){ const tx=g.querySelector("text"); tx.textContent=s.t; tx.setAttribute("class",s.cls||"b"); }
    else if(e.type==="code"){ g.querySelectorAll(".cl").forEach((r,i)=>r.setAttribute("class",i===s.hl?"cl hl":"cl")); }
  });
}
const canSpeak=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
function plSpeak(text,done){
  if(!S.voice||!canSpeak()){ return false; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/[（(][^）)]*[）)]/g,""));
    u.lang="ja-JP"; u.rate=1.05;
    const v=speechSynthesis.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith("ja")); if(v) u.voice=v;
    u.onend=()=>done&&done(); speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}
function plStopTimers(){ clearTimeout(PL.t); clearTimeout(PL.t2); PL.tok++; }
function plGo(k){
  plStopTimers();
  const n=PL.a.steps.length; PL.k=Math.max(0,Math.min(k,n-1));
  plApply(PL.k);
  const say=PL.a.steps[PL.k].say;
  $("#pl-cap").textContent=say;
  $("#pl-dots").innerHTML=PL.a.steps.map((_,i)=>`<i class="${i<=PL.k?"on":""}"></i>`).join("");
  $("#pl-prev").disabled=PL.k===0; $("#pl-next").disabled=PL.k===n-1;
  const tok=PL.tok;
  const next=()=>{ if(tok!==PL.tok||!PL.playing) return; if(PL.k<n-1) plGo(PL.k+1); else { PL.playing=false; plBtns(); } };
  const spoke=plSpeak(say,()=>{ if(PL.playing) PL.t=setTimeout(next,700); });
  if(PL.playing) PL.t2=setTimeout(next,spoke?Math.max(5000,say.length*260):Math.max(3000,say.length*140));
  plBtns();
}
function plBtns(){
  const last=PL.k===PL.a.steps.length-1;
  $("#pl-play").textContent=PL.playing?"⏸ 一時停止":last?"↻ 最初から":"▶ 再生";
  $("#pl-voice").hidden=!canSpeak();
  $("#pl-voice").textContent=S.voice?"🔊 読み上げ：オン（タップでオフ）":"🔈 読み上げ：オフ（タップでオン）";
}
function openAnim(id){
  const a=ANIM[id]; if(!a) return;
  PL.a=a; $("#pl-title").textContent=a.title; plBuild(a);
  $("#player").hidden=false;
  PL.playing=true;
  // 最初の場面は動かさずに置く
  document.querySelectorAll("#pl-svg .ael").forEach(g=>g.style.transition="none");
  plGo(0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("#pl-svg .ael").forEach(g=>g.style.transition="")));
  $("#pl-play").focus();
}
function closeAnim(){ PL.playing=false; plStopTimers(); try{ if(canSpeak()) speechSynthesis.cancel(); }catch(e){} $("#player").hidden=true; }
$("#pl-close").addEventListener("click",closeAnim);
$("#player").addEventListener("click",e=>{ if(e.target.id==="player") closeAnim(); });
$("#pl-prev").addEventListener("click",()=>{ PL.playing=false; plGo(PL.k-1); });
$("#pl-next").addEventListener("click",()=>{ PL.playing=false; plGo(PL.k+1); });
$("#pl-play").addEventListener("click",()=>{
  if(PL.playing){ PL.playing=false; plStopTimers(); try{ if(canSpeak()) speechSynthesis.cancel(); }catch(e){} plBtns(); return; }
  PL.playing=true; plGo(PL.k===PL.a.steps.length-1?0:PL.k);
});
$("#pl-voice").addEventListener("click",()=>{ S.voice=!S.voice; save(); if(!S.voice){ try{ speechSynthesis.cancel(); }catch(e){} } plGo(PL.k); });
document.addEventListener("keydown",e=>{ if(!$("#player").hidden&&e.key==="Escape") closeAnim(); });
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-anim]"); if(b){ e.preventDefault(); e.stopPropagation(); openAnim(b.dataset.anim); } },true);

/* ================= 起動 ================= */
save(false); renderPill(); renderTimerBar();
$("#tb-stop").addEventListener("click",()=>{ stopTimer(); });
show((location.hash||"#home").slice(1));
initCloud();
</script>
