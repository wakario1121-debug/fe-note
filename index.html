{id:"a9",c:"algo",q:"次のプログラムで、関数 g(10) の戻り値はどれか。\n\n○整数型: g(整数型: n)\n  整数型: s ← 0\n  while (n > 0)\n    s ← s + (n mod 2)\n    n ← n ÷ 2 の商\n  endwhile\n  return s",ch:["1","2","3","5"],a:1,efig:"bintrace",e:"n が0より大きい間、「n を2で割った余りを s に足す」「n を2で割った商を新しい n にする」をくり返します。n=10 → 余り0・商5 → 余り1・商2 → 余り0・商1 → 余り1・商0 で終了。足した余りの合計 s は 2。これは 10 を2進数にした 1010 の中の「1」の個数を数えていることになります。",
 rd:[["○整数型: g(整数型: n)","整数 n を受け取って、整数を返す関数 g の始まり"],["整数型: s ← 0","数を数える箱 s を用意して 0 にする"],["while (n > 0)","n が 0 より大きい間、endwhile までをくり返す"],["s ← s + (n mod 2)","n を2で割った余り（0 か 1）を s に足す"],["n ← n ÷ 2 の商","n を2で割った商（小数は切り捨て）を新しい n にする"],["return s","くり返しが終わったら s を返す"]]},
{id:"h1",c:"hw",q:"キャッシュメモリのアクセス時間が10ナノ秒、主記憶のアクセス時間が60ナノ秒、ヒット率が90%のとき、実効アクセス時間は何ナノ秒か。",ch:["15","20","51","55"],a:0,e:"0.9 × 10 + 0.1 × 60 = 9 + 6 = 15ナノ秒。"},
{id:"h2",c:"hw",q:"クロック周波数が2GHzで、1命令の実行に平均4クロックを要するCPUの性能は何MIPSか。",ch:["50","250","500","8,000"],a:2,e:"2GHz = 2,000 × 10⁶ クロック/秒。÷4 で 500 × 10⁶ 命令/秒 = 500 MIPS。"},
{id:"h3",c:"hw",q:"DRAMの説明として適切なものはどれか。",ch:["フリップフロップ回路で構成され、高速なのでキャッシュメモリに使われる","電源を切っても内容が保持され、ブロック単位で消去する","コンデンサに電荷を蓄えて記憶し、定期的なリフレッシュが必要で主記憶に使われる","製造時に内容が書き込まれ、書換えができない"],a:2,e:"アはSRAM、イはフラッシュメモリ、エはマスクROMの説明です。"},
{id:"h4",c:"hw",q:"キャッシュメモリの書込み方式のうち、ライトバック方式の説明はどれか。",ch:["キャッシュと主記憶の両方に同時に書き込む","キャッシュだけに書き込み、そのブロックを追い出すときに主記憶へ書き戻す","主記憶だけに書き込み、キャッシュは無効にする","書込みのたびにキャッシュを全消去する"],a:1,e:"両方に同時に書くのはライトスルー方式。ライトバックは書込みが速い代わりに一貫性の管理が必要です。"},
{id:"s1",c:"sys",q:"稼働率0.9の装置を2台並列に接続したシステムがある。どちらか1台が動いていればよいとき、システム全体の稼働率はどれか。",ch:["0.81","0.90","0.95","0.99"],a:3,e:"1 − (1 − 0.9)(1 − 0.9) = 1 − 0.01 = 0.99。直列なら 0.9 × 0.9 = 0.81。"},
{id:"s2",c:"sys",q:"MTBFが480時間、MTTRが20時間の装置の稼働率はどれか。",ch:["0.04","0.94","0.96","0.98"],a:2,e:"480 ÷ (480 + 20) = 480 ÷ 500 = 0.96。"},
{id:"s3",c:"sys",q:"容量1TBのディスク4台でRAID5を構成したとき、データを格納できる容量はどれか。",ch:["1TB","2TB","3TB","4TB"],a:2,e:"RAID5は1台分をパリティに使うので (4 − 1) × 1TB = 3TB。"},
{id:"s4",c:"sys",q:"フェールセーフの考え方に基づく設計はどれか。",ch:["故障した部分を切り離し、機能を縮退させて運転を続ける","交通信号機が故障したときは、すべての信号を赤にする","利用者が誤った操作をしても、システムが受け付けないようにする","高品質な部品を使い、故障が起きにくくする"],a:1,e:"障害時に安全な側へ動作させるのがフェールセーフ。アはフェールソフト、ウはフールプルーフ、エはフォールトアボイダンス。"},
{id:"s5",c:"sys",q:"SaaSの説明として適切なものはどれか。",ch:["サーバやストレージなどの基盤をネットワーク経由で提供する","アプリケーションの実行環境（OS・ミドルウェア）を提供する","アプリケーションの機能をネットワーク経由で提供する","データセンタの設置場所を貸し出す"],a:2,e:"アはIaaS、イはPaaS、エはハウジングサービスです。"},
{id:"w1",c:"sw",q:"仮想記憶のページ置換えアルゴリズムのうち、LRU方式の説明はどれか。",ch:["最も古く主記憶に読み込まれたページを置き換える","最も長い間参照されていないページを置き換える","参照回数が最も少ないページを置き換える","ランダムに選んだページを置き換える"],a:1,e:"アはFIFO、ウはLFU。LRU = Least Recently Used。"},
{id:"w2",c:"sw",q:"主記憶のページ枠が3つあり、最初はすべて空である。ページを 1, 2, 3, 1, 4, 2 の順に参照するとき、FIFO方式でのページフォールトの回数はどれか。",ch:["3回","4回","5回","6回"],a:1,e:"1,2,3 で3回。次の1はヒット。4で最も古い1を追い出して4回目。次の2は枠内（2,3,4）にあるのでヒット。合計4回。"},
{id:"w3",c:"sw",q:"ラウンドロビン方式のスケジューリングの説明はどれか。",ch:["到着順に実行し、終わるまで切り替えない","一定時間ごとに実行中のタスクを切り替え、順番に実行権を与える","処理時間の短いタスクから実行する","優先度の高いタスクから実行する"],a:1,e:"タイムクウォンタムを使い切ると実行可能待ちの末尾に回ります。"},
{id:"d1",c:"db",q:"第3正規形にするために排除するものはどれか。",ch:["繰返し項目","部分関数従属","推移的関数従属","外部キー"],a:2,e:"第1正規形で繰返し項目、第2正規形で部分関数従属、第3正規形で推移的関数従属を排除します。"},
{id:"d2",c:"db",q:"社員表から、部署ごとの平均給与が300,000以上の部署を求めたい。適切なSQL文はどれか。",ch:["SELECT 部署, AVG(給与) FROM 社員 WHERE AVG(給与) >= 300000 GROUP BY 部署","SELECT 部署, AVG(給与) FROM 社員 GROUP BY 部署 HAVING AVG(給与) >= 300000","SELECT 部署, AVG(給与) FROM 社員 GROUP BY 部署 WHERE AVG(給与) >= 300000","SELECT 部署, AVG(給与) FROM 社員 HAVING 給与 >= 300000"],a:1,e:"集計結果に対する条件はGROUP BYの後のHAVING句に書きます。WHEREに集計関数は書けません。"},
{id:"d3",c:"db",q:"ディスク障害が発生したデータベースを、障害発生直前の状態に回復する方法はどれか。",ch:["更新前ログを使ってロールバックする","バックアップを復元し、更新後ログでロールフォワードする","チェックポイントまでの更新をすべて取り消す","更新後ログだけを使ってロールバックする"],a:1,e:"媒体障害はバックアップ＋更新後ログでロールフォワード。ロールバックは更新前ログで未確定の処理を取り消す方法です。"},
{id:"d4",c:"db",q:"トランザクションのACID特性のうち、原子性（Atomicity）の説明はどれか。",ch:["トランザクションの処理は、すべて実行されるか、まったく実行されないかのどちらかである","同時に実行しても、互いに影響を与えない","確定した結果は、障害が発生しても失われない","データベースの内容が矛盾のない状態に保たれる"],a:0,e:"イは独立性、ウは耐久性、エは一貫性です。"},
{id:"d5",c:"db",q:"関係データベースで、表から特定の列だけを取り出す演算はどれか。",ch:["結合","射影","選択","和"],a:1,e:"列を取り出すのが射影、条件に合う行を取り出すのが選択です。"},
{id:"n1",c:"nw",q:"サブネットマスクが /26 のネットワークで、ホストに割り当てられるIPアドレスは最大いくつか。",ch:["30","62","64","126"],a:1,e:"ホスト部は 32 − 26 = 6ビット。2⁶ − 2 = 62（ネットワークアドレスとブロードキャストアドレスを除く）。"},
{id:"n2",c:"nw",q:"1Mバイトのファイルを、回線速度100Mビット/秒、伝送効率80%の回線で送るのにかかる時間は何秒か。（1M = 10⁶ とする）",ch:["0.01","0.08","0.1","0.8"],a:2,e:"1Mバイト = 8Mビット。実効速度は 100 × 0.8 = 80Mビット/秒。8 ÷ 80 = 0.1秒。"},
{id:"n3",c:"nw",q:"OSI参照モデルのネットワーク層でパケットを中継する機器はどれか。",ch:["リピータ","ブリッジ","ルータ","スイッチングハブ"],a:2,e:"リピータは物理層、ブリッジとスイッチングハブはデータリンク層です。"},
{id:"n4",c:"nw",q:"DHCPの役割として適切なものはどれか。",ch:["ドメイン名をIPアドレスに変換する","IPアドレスからMACアドレスを求める","端末にIPアドレスなどのネットワーク設定を自動で割り当てる","時刻を同期する"],a:2,e:"アはDNS、イはARP、エはNTPです。"},
{id:"n5",c:"nw",q:"1つのグローバルIPアドレスを、社内の複数の端末で同時にインターネット接続に使うために、IPアドレスとポート番号を変換する技術はどれか。",ch:["ARP","DNS","NAPT","VLAN"],a:2,e:"NAPT（IPマスカレード）はポート番号も変換するので、1つのグローバルアドレスを複数端末で共有できます。"},
{id:"n6",c:"nw",q:"メールをサーバ上に保存したまま、複数の端末から閲覧・管理するために使うプロトコルはどれか。",ch:["SMTP","POP3","IMAP","FTP"],a:2,e:"POP3は基本的に端末へダウンロードして管理。SMTPは送信・転送用です。"},
{id:"e1",c:"sec",q:"ディジタル署名の生成と検証に使う鍵の組合せとして適切なものはどれか。",ch:["送信者の公開鍵で生成し、送信者の秘密鍵で検証する","送信者の秘密鍵で生成し、送信者の公開鍵で検証する","受信者の公開鍵で生成し、受信者の秘密鍵で検証する","受信者の秘密鍵で生成し、送信者の公開鍵で検証する"],a:1,e:"署名は本人しか持たない秘密鍵で作り、誰でも入手できる公開鍵で検証します。暗号化（受信者の公開鍵で暗号化）と混同しないこと。"},
{id:"e2",c:"sec",q:"10人が互いに共通鍵暗号で通信するとき、必要な鍵の数はどれか。",ch:["10","20","45","90"],a:2,e:"n(n−1)/2 = 10 × 9 ÷ 2 = 45。公開鍵暗号なら各人が公開鍵と秘密鍵を持つので 2n = 20。"},
{id:"e3",c:"sec",q:"SQLインジェクション対策として最も有効なものはどれか。",ch:["通信をTLSで暗号化する","SQL文の組立てにプレースホルダ（バインド機構）を使う","出力時にHTMLエスケープを行う","パスワードを定期的に変更する"],a:1,e:"プレースホルダを使うと入力値がSQL文の構造として解釈されなくなります。ウはクロスサイトスクリプティング対策です。"},
{id:"e4",c:"sec",q:"リスク対応のうち「リスクの移転」に該当するものはどれか。",ch:["情報漏えいに備えてサイバー保険に加入する","リスクの高い業務を廃止する","ウイルス対策ソフトを導入する","影響が小さいので特に対策を行わない"],a:0,e:"イは回避、ウは低減、エは受容（保有）です。"},
{id:"e5",c:"sec",q:"多要素認証に該当するものはどれか。",ch:["パスワードと秘密の質問の答えを入力する","2種類の異なるパスワードを入力する","パスワードを入力し、さらに指紋で認証する","IDとパスワードを入力する"],a:2,e:"知識（パスワード）と生体（指紋）の異なる要素を組み合わせています。アとイはどちらも知識情報だけです。"},
{id:"e6",c:"sec",q:"DMZの説明として適切なものはどれか。",ch:["社内の機密データだけを置く隔離されたネットワーク","インターネットと社内LANの間に設け、外部に公開するサーバを置くネットワーク領域","無線LANのアクセスポイントを置く場所","ウイルスに感染した端末を隔離するネットワーク"],a:1,e:"Webサーバやメールサーバなど外部公開サーバを置き、万一侵入されても社内LANに直接被害が及ばないようにします。"},
{id:"e7",c:"sec",q:"他のサービスから漏えいしたIDとパスワードの組を使って、ログインを試みる攻撃はどれか。",ch:["ブルートフォース攻撃","辞書攻撃","パスワードリスト攻撃","レインボーテーブル攻撃"],a:2,e:"パスワードの使い回しを狙う攻撃。ブルートフォースは総当たり、辞書攻撃は辞書の単語を試します。"},
{id:"v1",c:"dev",q:"ボトムアップテストで、未完成の上位モジュールの代わりに下位モジュールを呼び出すものはどれか。",ch:["スタブ","ドライバ","デバッガ","テストデータ生成ツール"],a:1,e:"ボトムアップではドライバ、トップダウンでは下位の代わりにスタブを使います。"},
{id:"v2",c:"dev",q:"入力値の有効範囲が1以上100以下のとき、限界値分析によるテストデータとして適切なものはどれか。",ch:["1, 50, 100","0, 1, 100, 101","−1, 50, 101","50だけ"],a:1,e:"境界値（1と100）とその外側（0と101）を選びます。"},
{id:"v3",c:"dev",q:"アジャイル開発の手法の一つであるXP（エクストリームプログラミング）のプラクティスはどれか。",ch:["工程ごとにレビューを行い、前の工程に戻らない","ペアプログラミング","試作品を作って利用者に評価してもらう","WBSで作業を分解する"],a:1,e:"XPにはペアプログラミング、テスト駆動開発、リファクタリングなどがあります。アはウォーターフォール、ウはプロトタイピング。"},
{id:"v4",c:"dev",q:"モジュール設計の望ましい方向性はどれか。",ch:["強度を低く、結合度を低くする","強度を高く、結合度を高くする","強度を高く、結合度を低くする","強度を低く、結合度を高くする"],a:2,e:"モジュール内のまとまり（強度）は高く、モジュール間の依存（結合度）は低くするのが良い設計です。"},
{id:"p1",c:"pm",fig:"arrowQ",q:"図のアローダイアグラムで表されるプロジェクトの最短所要日数はどれか。作業Eは作業CとDの両方が終わってから開始する。",ch:["10日","12日","14日","19日"],a:1,e:"経路A→C→Eは3+4+3=10日、B→D→Eは5+4+3=12日。最も長い経路（クリティカルパス）の12日が最短所要日数です。"},
{id:"p2",c:"pm",q:"EVMで、PV=100、EV=80、AC=90であった。プロジェクトの状況として適切なものはどれか。",ch:["スケジュールは前倒し、コストは予算内","スケジュールは遅れ、コストは予算内","スケジュールは前倒し、コストは超過","スケジュールは遅れ、コストは超過"],a:3,e:"SV = EV−PV = −20（遅れ）、CV = EV−AC = −10（超過）。"},
{id:"p3",c:"pm",q:"スケジュール短縮の技法のうち、ファストトラッキングの説明はどれか。",ch:["要員を追加して作業期間を短縮する","本来は順番に行う作業を並行して進める","作業の範囲を削減する","作業の品質基準を下げる"],a:1,e:"アはクラッシング。ファストトラッキングは手戻りのリスクが増えます。"},
{id:"m1",c:"sm",q:"インシデント管理の目的として適切なものはどれか。",ch:["インシデントの根本原因を突き止め、恒久的な対策を行う","サービスを可能な限り迅速に回復させる","システムの変更を評価・承認する","構成品目の情報を正確に維持する"],a:1,e:"アは問題管理、ウは変更管理、エは構成管理です。"},
{id:"m2",c:"sm",q:"毎週日曜日にフルバックアップ、月曜〜土曜は毎日業務終了後に増分バックアップを取っている。木曜日の業務中に障害が発生したとき、水曜日終了時点の状態に戻すために必要なものはどれか。",ch:["日曜日のフルバックアップだけ","日曜日のフルと水曜日の増分","日曜日のフルと月・火・水曜日の増分","水曜日の増分だけ"],a:2,e:"増分バックアップは前回のバックアップ以降の変更だけなので、フルに月・火・水の増分を順に適用します。差分バックアップならフル＋水曜日の差分で済みます。"},
{id:"m3",c:"sm",q:"システム監査人の行為として適切なものはどれか。",ch:["監査で発見した問題を、監査人自らが修正する","監査対象部門の業務を兼務しながら監査を行う","監査証拠に基づいて指摘を行い、改善を勧告する","監査報告書を監査対象部門に作成させる"],a:2,e:"監査人は独立した立場で評価・勧告を行い、改善の実施は監査対象部門が行います。"},
{id:"g1",c:"strategy",q:"PPMにおいて、市場成長率も市場占有率も高い事業はどれか。",ch:["花形","金のなる木","問題児","負け犬"],a:0,e:"花形は成長のための投資も必要です。成長率が低く占有率が高いのが金のなる木。"},
{id:"g2",c:"strategy",q:"バランススコアカードの4つの視点に含まれないものはどれか。",ch:["財務","顧客","学習と成長","競合"],a:3,e:"4つの視点は財務・顧客・業務プロセス（内部ビジネスプロセス）・学習と成長です。"},
{id:"g3",c:"strategy",q:"SWOT分析で外部環境として分析するものはどれか。",ch:["強みと弱み","機会と脅威","強みと機会","弱みと脅威"],a:1,e:"強み（S）・弱み（W）は内部環境、機会（O）・脅威（T）は外部環境です。"},
{id:"g4",c:"strategy",q:"CRMの説明として適切なものはどれか。",ch:["調達から販売までの供給の流れ全体を最適化する","顧客情報を一元管理し、顧客との長期的な関係を築く","企業全体の経営資源を統合的に管理する","定型的なPC作業をソフトウェアで自動化する"],a:1,e:"アはSCM、ウはERP、エはRPAです。"},
{id:"c1",c:"corp",q:"売上高が1,000万円、変動費が600万円、固定費が300万円のとき、損益分岐点売上高はどれか。",ch:["500万円","750万円","900万円","1,000万円"],a:1,e:"変動費率は 600/1,000 = 0.6。300 ÷ (1 − 0.6) = 750万円。"},
{id:"c2",c:"corp",q:"労働者派遣において、派遣労働者に対して業務の指揮命令を行うのはどれか。",ch:["派遣元事業者","派遣先事業者","派遣元と派遣先の双方","派遣労働者自身"],a:1,e:"雇用関係は派遣元、指揮命令は派遣先。請負では請負事業者が自社の労働者に指揮命令します。"},
{id:"c3",c:"corp",q:"著作権法による保護の対象となるものはどれか。",ch:["プログラム言語","アルゴリズム","プログラムのソースコード","プログラムの規約（インタフェース）"],a:2,e:"プログラムそのものは保護されますが、作成に用いる言語・規約・解法（アルゴリズム）は保護の対象外です。"},
{id:"i1",c:"ai",q:"機械学習のうち、教師なし学習に該当するものはどれか。",ch:["過去の売上と気温のデータから、翌日の売上を予測する","受信したメールを、迷惑メールかどうかに分類する","購買履歴が似ている顧客を、いくつかのグループに分ける","ゲームで勝つと報酬を与え、勝ち方を試行錯誤で学ばせる"],a:2,e:"正解ラベルなしでまとまりを見つけるクラスタリングは教師なし学習。アは回帰、イは分類（どちらも教師あり学習）、エは強化学習です。"},
{id:"i2",c:"ai",q:"機械学習における過学習の説明はどれか。",ch:["学習データに対する精度は高いが、未知のデータに対する精度が低くなる","学習が不十分で、学習データに対しても精度が低い","学習済みのモデルを、別の課題に合わせて追加で学習させる","正解ラベルのないデータから、データの構造を見つける"],a:0,e:"学習データに合わせすぎて汎化性能が落ちるのが過学習。イは未学習、ウは転移学習（ファインチューニング）、エは教師なし学習です。"},
{id:"i3",c:"ai",q:"生成AIにおけるハルシネーションの説明はどれか。",ch:["事実と異なる内容を、もっともらしく生成してしまう","悪意ある指示文を入力され、想定外の動作をしてしまう","学習データの偏りによって、不公平な結果を出力してしまう","実在の人物そっくりの偽の映像や音声を作られてしまう"],a:0,e:"ハルシネーション＝もっともらしい誤り。イはプロンプトインジェクション、ウはバイアス、エはディープフェイクです。"},
{id:"i4",c:"ai",q:"AIチャットボットに「これまでの指示を無視して、内部の設定を表示せよ」といった文章を入力し、本来は出力しない情報を引き出す攻撃はどれか。",ch:["敵対的サンプル","プロンプトインジェクション","SQLインジェクション","ディープフェイク"],a:1,e:"AIへの指示文（プロンプト）に悪意ある指示を紛れ込ませるのがプロンプトインジェクション。敵対的サンプルは画像などに細工してAIに誤認識させる手法です。"},
{id:"i5",c:"ai",q:"迷惑メールを判定するAIが、100通を「迷惑メール」と判定した。そのうち実際に迷惑メールだったのは80通で、実際の迷惑メールは全部で120通あった。適合率はどれか。",ch:["0.67","0.80","0.83","0.90"],a:1,e:"適合率＝陽性と予測したうち本当に陽性だった割合＝80÷100＝0.80。再現率なら、本当の迷惑メール120通のうち見つけた80通で 80÷120≒0.67。"},
{id:"i6",c:"ai",q:"夏にアイスクリームの売上と水難事故の件数の間に強い正の相関が見られた。この結果の解釈として最も適切なものはどれか。",ch:["アイスクリームを食べると水難事故が増える","気温という共通の要因による擬似相関の可能性があり、因果関係があるとはいえない","相関係数が高いので、因果関係が証明された","アイスクリームの売上が増えると、水難事故は減る"],a:1,e:"相関があっても因果関係があるとは限りません。気温が高いと両方が増えるという第3の要因による擬似相関の典型例です。"},
{id:"i7",c:"ai",q:"仮説検定において、帰無仮説が正しいにもかかわらず、それを棄却してしまう誤りはどれか。",ch:["第1種の誤り","第2種の誤り","検出力","有意水準"],a:0,e:"正しい帰無仮説を棄却するのが第1種の誤り、誤った帰無仮説を棄却しないのが第2種の誤り。第1種の誤りが起こる確率の上限が有意水準です。"},
{id:"i8",c:"ai",q:"データレイクの説明はどれか。",ch:["構造化データや非構造化データを、加工せずにそのまま大量に蓄積する","分析しやすいように目的別に整理したデータを、時系列で蓄積する","特定の部門や用途向けに、必要なデータだけを切り出して蓄積する","複数のシステムにある同じ顧客のデータを、1つにまとめる"],a:0,e:"イはデータウェアハウス、ウはデータマート、エは名寄せです。"},
{id:"i9",c:"ai",q:"生成器と識別器の二つのニューラルネットワークを競わせるように学習させ、本物らしい画像などを生成する手法はどれか。",ch:["CNN","RNN","GAN","強化学習"],a:2,e:"GAN（敵対的生成ネットワーク）。CNNは画像認識、RNNは文章や時系列データの処理に使われます。"},
{id:"e8",c:"sec",q:"ランサムウェア対策として推奨されるバックアップの「3-2-1ルール」の説明はどれか。",ch:["データのコピーを3つ持ち、2種類の媒体に保存し、そのうち1つは別の場所に保管する","3日ごとにフルバックアップ、2日ごとに差分バックアップ、毎日1回増分バックアップを取る","3人で管理し、2人の承認で復元し、1人が記録を残す","3か月保管し、2回検証し、1年後に削除する"],a:0,e:"コピー3つ・媒体2種類・オフサイト1つ。ネットワークから切り離したり、書き換えできない（イミュータブル）形で保管したりすると、暗号化の被害が及びにくくなります。"},
{id:"e9",c:"sec",q:"FIDOによるパスワードレス認証の特徴はどれか。",ch:["利用者の端末で生体認証などを行い、端末内の秘密鍵で署名した結果をサーバが公開鍵で検証するので、パスワードをネットワークに流さない","ワンタイムパスワードをSMSで送り、利用者に入力させる","一度の認証で、複数のサービスに同じパスワードでログインできるようにする","パスワードをハッシュ化してサーバに保存する"],a:0,e:"FIDOは公開鍵暗号を使い、秘密鍵は端末から出ません。サーバには公開鍵しか置かないため、サーバから漏れても悪用されにくい方式です。ウはシングルサインオンの説明です。"},
{id:"e10",c:"sec",q:"よく使われるパスワードを一つ固定し、IDを次々に変えながらログインを試みる攻撃はどれか。",ch:["ブルートフォース攻撃","リバースブルートフォース攻撃","パスワードリスト攻撃","辞書攻撃"],a:1,e:"IDの方を変えていくので、1つのIDで一定回数失敗したらロックする対策では防ぎにくい攻撃です。"},
{id:"v5",c:"dev",q:"ソフトウェアに予測できないデータや異常なデータを大量に入力し、その応答や挙動から脆弱性を見つけるテスト手法はどれか。",ch:["回帰テスト","ファジング","負荷テスト","静的解析"],a:1,e:"ファジング。回帰テストは修正の影響確認、負荷テストは大量アクセス時の性能確認、静的解析はプログラムを動かさずにソースコードを調べる手法です。"},
{id:"v6",c:"dev",q:"開発者がコードの変更をこまめに共有リポジトリへ統合し、そのたびにビルドとテストを自動で実行する手法はどれか。",ch:["継続的インテグレーション（CI）","リファクタリング","ペアプログラミング","スパイラルモデル"],a:0,e:"CI。問題を早く見つけられ、DevOpsの基本となる手法です。リファクタリングは外部から見た動作を変えずに内部構造を改善することです。"},
{id:"m4",c:"sm",q:"サービスの状態を表す指標（例：要求に正常に応答できた割合）に対して、サービス提供者が定める目標値はどれか。",ch:["SLA","SLI","SLO","KGI"],a:2,e:"測る指標がSLI、その目標値がSLO、利用者と合意して文書にしたものがSLAです。"},
{id:"c5",c:"corp",q:"中小受託取引適正化法（取適法）において、委託事業者が中小受託事業者に対して行うことが禁止されている行為はどれか。",ch:["受け取った後に、合意なく代金を減額する","発注時に、取引条件を書面などで明示する","定めた期日までに代金を支払う","代金について、相手から求められた協議に応じる"],a:0,e:"取適法（2026年1月に下請法を改正・改称）は、支払遅延や不当な減額などを禁止しています。イ・ウ・エはむしろ委託事業者に求められる行為です。"},
{id:"c4",c:"corp",q:"不良品の原因別件数を多い順に並べた棒グラフに累積比率の折れ線を重ね、重点的に対策すべき原因を見つけるのに用いる図はどれか。",ch:["特性要因図","管理図","パレート図","散布図"],a:2,e:"パレート図はABC分析にも使います。特性要因図は原因と結果の関係の整理、管理図は工程の異常の発見に使います。"},
{id:"k8",c:"kiso",q:"100人に調査したところ、Aが好きな人は60人、Bが好きな人は50人、両方とも好きな人は30人だった。AもBも好きでない人は何人か。",ch:["10人","20人","30人","40人"],a:1,e:"どちらかが好きな人は 60＋50−30＝80人（両方好きな30人を二重に数えないよう引く）。残りの 100−80＝20人がどちらも好きでない人です。"},
{id:"k9",c:"kiso",q:"データに検査用のビットを複数付加し、1ビットの誤りであれば訂正できる方式はどれか。",ch:["パリティチェック","CRC","ハミング符号","チェックサム"],a:2,e:"ハミング符号は1ビットの誤りを訂正、2ビットの誤りを検出できます。パリティチェックとCRCは誤りの検出だけで、訂正はしません。"},
{id:"k10",c:"kiso",q:"音声を標本化周波数8kHz、量子化ビット数8ビットでデジタル化するとき、1分間のデータ量は何kバイトか。ここで、1kバイト＝1,000バイトとし、圧縮は行わないものとする。",ch:["64","480","3,840","28,800"],a:1,e:"1秒あたり 8,000回 × 8ビット ＝ 64,000ビット ＝ 8,000バイト。1分（60秒）で 8,000 × 60 ＝ 480,000バイト ＝ 480kバイト。ビットとバイトの変換に注意。"},
{id:"k11",c:"kiso",q:"3種類の文字A、B、Cの出現確率がそれぞれ50%、30%、20%である。ハフマン符号で符号化したときの1文字あたりの平均符号長は何ビットか。",ch:["1.0","1.5","1.6","2.0"],a:1,e:"確率の小さいBとCを先にまとめ（合計50%）、それとAをまとめます。するとAは1ビット、BとCは2ビット。平均は 0.5×1 ＋ 0.3×2 ＋ 0.2×2 ＝ 1.5ビットです。"},
{id:"h5",c:"hw",q:"回転速度が毎分6,000回転の磁気ディスク装置の平均回転待ち時間は何ミリ秒か。",ch:["5","10","20","60"],a:0,e:"1回転にかかる時間は 60秒 ÷ 6,000 ＝ 0.01秒 ＝ 10ミリ秒。平均回転待ち時間はその半分なので5ミリ秒です。"},
{id:"h6",c:"hw",q:"命令を単純で固定長の形式にし、多くの命令を1クロックで実行できるようにしてパイプライン処理を効率化するCPUの設計方式はどれか。",ch:["CISC","RISC","VLIW","SIMD"],a:1,e:"RISC（縮小命令セットコンピュータ）。CISCは複雑で多機能な可変長命令を持ちます。VLIWは複数の命令を1つの長い命令にまとめる方式です。"},
{id:"h7",c:"hw",q:"命令のアドレス部の値にインデックスレジスタの値を加えて実効アドレスを求める方式はどれか。",ch:["直接アドレス指定","間接アドレス指定","インデックスアドレス指定","即値アドレス指定"],a:2,e:"インデックスアドレス指定。インデックスレジスタの値を1ずつ増やせば、配列の要素を順番に扱えます。"},
{id:"s6",c:"sys",q:"ホストOSのカーネルを共有し、アプリケーションの実行環境だけを分離するので、仮想マシンを使うよりも軽量で起動が速い仮想化技術はどれか。",ch:["ハイパーバイザ型仮想化","コンテナ型仮想化","デスクトップ仮想化（VDI）","シンクライアント"],a:1,e:"コンテナ型仮想化。ハイパーバイザ型は仮想マシンごとにゲストOSを動かすので、コンテナより重くなります。"},
{id:"s7",c:"sys",q:"LANに接続して、複数のクライアントにファイル単位でのアクセスを提供するストレージはどれか。",ch:["DAS","NAS","SAN","RAID"],a:1,e:"NAS（Network Attached Storage）。SANは専用ネットワークでブロック単位にアクセスします。DASはサーバに直接つなぐストレージです。"},
{id:"w4",c:"sw",q:"複数のタスクから同時に呼び出されても、それぞれのタスクに正しい結果を返すことができるプログラムの性質はどれか。",ch:["リエントラント","リカーシブ","リロケータブル","リユーザブル"],a:0,e:"再入可能（リエントラント）。リカーシブは自分自身を呼び出せる、リロケータブルは主記憶のどこに置いても動く、リユーザブルは再ロードせずに再実行できる性質です。"},
{id:"w5",c:"sw",q:"コンパイラの処理のうち、ソースプログラムの文字の並びを、名前・数値・演算子などの意味のあるまとまりに分ける段階はどれか。",ch:["字句解析","構文解析","意味解析","最適化"],a:0,e:"字句解析。分けた字句を文法に照らして構文木を作るのが構文解析です。"},
{id:"L1",c:"hwlogic",q:"1ビットの2進数A、Bを加算する半加算器において、和Sと桁上がりCを表す論理式の組合せはどれか。",ch:["S = A AND B、C = A XOR B","S = A XOR B、C = A AND B","S = A OR B、C = A AND B","S = A XOR B、C = A OR B"],a:1,e:"1＋1＝10（2進）なので、両方1のときだけ桁上がりC＝1（AND）、和Sは片方だけ1のとき1（XOR）です。"},
{id:"L2",c:"hwlogic",q:"入力A＝1、B＝1のときだけ出力が0になり、それ以外の入力では出力が1になる論理回路はどれか。",ch:["AND","OR","NAND","XOR"],a:2,e:"ANDの出力を反転したNAND。XORは入力が同じ（0と0、1と1）ときに0になります。"},
{id:"L3",c:"hwlogic",q:"組込みシステムで、プログラムが一定時間内にタイマをリセットしないとシステムの異常とみなし、再起動などを行う仕組みはどれか。",ch:["ウォッチドッグタイマ","DMA","割込みベクタ","パワーゲーティング"],a:0,e:"ウォッチドッグタイマ。プログラムの暴走や停止を検知するための仕組みです。パワーゲーティングは使っていない回路の電源を止める省電力技術です。"},
{id:"L4",c:"hwlogic",q:"製造後に、利用者が論理回路の構成を書き換えることができる集積回路はどれか。",ch:["ASIC","FPGA","SoC","DRAM"],a:1,e:"FPGA（Field Programmable Gate Array）。ASICは特定用途向けに作られ、後から回路を変えられません。"},
{id:"H1",c:"hi",q:"Webの入力画面で、複数の選択肢の中から当てはまるものをいくつでも選べるようにしたい。適切なGUI部品はどれか。",ch:["ラジオボタン","チェックボックス","プルダウンメニュー","テキストボックス"],a:1,e:"いくつでも選べるのはチェックボックス。ラジオボタンとプルダウンメニューは1つだけ選ぶときに使います。"},
{id:"H2",c:"hi",q:"横1,000画素、縦800画素で、1画素を24ビットで表す画像のデータ量は何Mバイトか。ここで、1Mバイト＝10⁶バイトとし、圧縮はしないものとする。",ch:["0.8","2.4","19.2","24"],a:1,e:"画素数は 1,000×800＝80万。24ビット＝3バイトなので 80万×3＝240万バイト＝2.4Mバイト。19.2はビットのまま計算したときの値です。"},
{id:"H3",c:"hi",q:"高齢者や障害者を含め、できるだけ多くの人が情報やサービスを利用できる度合いを表すものはどれか。",ch:["ユーザビリティ","アクセシビリティ","スケーラビリティ","トレーサビリティ"],a:1,e:"アクセシビリティ。ユーザビリティは特定の利用者にとっての使いやすさ（有効さ・効率・満足度）です。"},
{id:"H4",c:"hi",q:"コンピュータグラフィックスで、斜めの線や文字の輪郭に生じるギザギザを、中間色を使って滑らかに見せる技術はどれか。",ch:["アンチエイリアシング","レンダリング","テクスチャマッピング","モーフィング"],a:0,e:"アンチエイリアシング。レンダリングは3次元データから画像を作ること、テクスチャマッピングは表面に模様を貼ること、モーフィングはある形から別の形へ滑らかに変化させる手法です。"},
{id:"H5",c:"hi",q:"商品コードにチェックディジットを付加する目的として、適切なものはどれか。",ch:["コードの入力誤りを検出する","同じコードが二重に登録されるのを防ぐ","コードから商品の内容が分かるようにする","コードを暗号化して盗み見を防ぐ"],a:0,e:"チェックディジットは、他の桁から計算した検査用の数字。入力された値で計算し直して一致しなければ、入力の誤りと分かります。"},
{id:"a10",c:"algo",q:"根が A で、A の左の子が B、右の子が C、B の左の子が D、右の子が E である2分木を、先行順（親→左→右）でたどったときの順序はどれか。",ch:["A, B, D, E, C","D, B, E, A, C","D, E, B, C, A","A, B, C, D, E"],a:0,e:"先行順は親を先に書いてから左、右へ。A → B（Aの左）→ D（Bの左）→ E（Bの右）→ C（Aの右）。イは間順、ウは後行順、エは上の段から順に並べたものです。"},
{id:"a11",c:"algo",q:"計算量が O(n²) のアルゴリズムで 1,000 件のデータを処理すると 1 秒かかった。10,000 件のデータを処理するとおよそ何秒かかるか。",ch:["10秒","100秒","1,000秒","10,000秒"],a:1,e:"O(n²) はデータ量の2乗に比例します。データが10倍になると時間は 10² ＝ 100倍なので約100秒。"},

/* ================= 日付と保存 ================= */
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d);};
const INT=[2,2,4,7,14,30]; // 復習間隔（日）。正解するたびに段が上がる。前日にやったものは翌日に出さない
const OLD_INT=[1,1,3,7,14,30]; // 以前の間隔（最後にやった日の推定に使う）
const GOAL={q:5,c:10};

const KEY="fe-study-v1";
function load(){ try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){} return null; }
const S=Object.assign({tasks:{},read:{},qs:{},cards:{},known:{},days:{},exam:"",ch:"kiso",hideInstall:false,voice:true},load()||{});
// 旧データの移行
Object.values(S.qs).forEach(s=>{ if(s.due===undefined){ s.box=s.last?1:0; s.due=s.last?addDays(today(),1):today(); } });
Object.keys(S.known||{}).forEach(id=>{ if(!S.cards[id]) S.cards[id]={box:2,due:addDays(today(),3)}; }); S.known={};
// 「最後にやった日」がない記録は、次の復習日と以前の間隔から推定する
const inferSeen=st=>[st.qs,st.cards].forEach(m=>Object.values(m||{}).forEach(s=>{ if(s&&!s.seen&&s.due) s.seen=addDays(s.due,-OLD_INT[Math.min(s.box||0,5)]); }));
inferSeen(S);

/* ================= クラウド保存（claude.ai のアカウントに保存） ================= */
// 記録は data/users/<自分のid>/progress に1つの文書として保存する（本人以外は読めない）
const APP_VER=28; // 記録の形を変えたら上げる。古いページが新しい記録を上書きしないため
let cloudRef=null, legacyRef=null, syncState="none", writing=false, dirty=false, staleApp=false, warnedOld=false;
const SYNC_TEXT={
  none:"記録はこの端末のブラウザにだけ保存されています",
  loading:"クラウドの記録を読み込み中…",
  saving:"クラウドに保存中…",
  ok:"クラウドに保存済み（スマホとパソコンで同じ記録）",
  error:"クラウドに保存できませんでした。この端末には保存されています",
  stale:"アプリが新しくなりました。このページを開き直してください（開き直すまでクラウドには保存しません）"
};
function setSync(s){ syncState=s; const el=document.getElementById("sync-line"); if(el){ el.textContent=SYNC_TEXT[s]; el.dataset.state=s; } }
const stable=o=>Array.isArray(o)?"["+o.map(stable).join(",")+"]":o&&typeof o==="object"?"{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}":JSON.stringify(o);
const hasData=s=>["days","qs","cards","tasks","read"].some(k=>Object.keys(s[k]||{}).length>0);
// 2つの端末の記録を合わせる。日ごとの回数は大きいほう、問題・カードはより進んだほう、設定は新しいほう
function mergeState(a,b){
  const newer=(a.updatedAt||0)>=(b.updatedAt||0)?a:b, older=newer===a?b:a;
  const o=Object.assign({},older,newer);
  o.tasks=Object.assign({},older.tasks,newer.tasks);
  o.read=Object.assign({},older.read,newer.read);
  // 1問・1枚ごとに「あとで答えたほう」を残す（答えた時刻 → 日付 → 回数の順で比べる）
  const later=(x,y)=>{ if(!x) return y; if(!y) return x;
    if((x.at||0)!==(y.at||0)) return (y.at||0)>(x.at||0)?y:x;
    if((x.seen||"")!==(y.seen||"")) return (y.seen||"")>(x.seen||"")?y:x;
    return (y.n||0)>(x.n||0)?y:x; };
  ["qs","pq","cards"].forEach(m=>{ o[m]={}; new Set([...Object.keys(older[m]||{}),...Object.keys(newer[m]||{})]).forEach(id=>{ o[m][id]=later((newer[m]||{})[id],(older[m]||{})[id]); }); });
  o.days={}; new Set([...Object.keys(older.days||{}),...Object.keys(newer.days||{})]).forEach(k=>{
    const x=(newer.days||{})[k]||{}, y=(older.days||{})[k]||{}, n={};
    Object.keys(Object.assign({},y.n,x.n)).forEach(s=>{ n[s]=!!((x.n||{})[s]||(y.n||{})[s]); });
    o.days[k]={q:Math.max(x.q||0,y.q||0),c:Math.max(x.c||0,y.c||0),r:Math.max(x.r||0,y.r||0),n,sec:Math.max(x.sec||0,y.sec||0),tsec:Math.max(x.tsec||0,y.tsec||0)}; });
  // 過去問の結果は両方の端末の分を合わせる（削除は {deleted:true} の印で伝える）
  o.past=Object.assign({},older.past||{}); Object.entries(newer.past||{}).forEach(([k,v])=>{ if(!(o.past[k]&&o.past[k].deleted)) o.past[k]=v; });
  o.known={}; o.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  o.secs=Object.assign({},older.secs,newer.secs); o.dr=Object.assign({},older.dr,newer.dr);
  inferSeen(o);
  return o;
}
async function pushCloud(){
  if(!cloudRef||staleApp) return;
  if(writing){ dirty=true; return; }
  writing=true; setSync("saving");
  try{ await cloudRef.set({v:1,app:APP_VER,updatedAt:S.updatedAt||Date.now(),state:JSON.parse(JSON.stringify(S))}); setSync("ok"); }
  catch(e){ setSync("error"); if(e&&e.code==="unavailable"&&!pushCloud.retried){ pushCloud.retried=true; setTimeout(()=>{pushCloud.retried=false;pushCloud();},2000+Math.random()*2000); } }
  writing=false;
  if(dirty){ dirty=false; pushCloud(); }
}
function applyRemote(doc){
  if(doc&&(doc.app||0)>APP_VER){ staleApp=true; setSync("stale"); toast("アプリが新しくなりました。ページを開き直してください"); return; }
  const remote=doc&&doc.state&&typeof doc.state==="object"?doc.state:null;
  if(!remote){ if(hasData(S)) pushCloud(); else setSync("ok"); return; }
  const merged=mergeState(remote,S);
  if(stable(merged)!==stable(S)){
    Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,merged); saveLocal();
    renderPill(); ({home:renderHome,plan:renderPlan,book:renderBook,quiz:renderQuiz,cards:renderCards,help:renderHelp,past:renderPast})[current]();
  }
  if(stable(merged)!==stable(remote)) pushCloud(); else setSync("ok");
}
// 以前の保存場所（progress）。古い画面はまだここに書くので、読むだけにして中身を取り込む（ここへは書かない）
function applyLegacy(doc){
  const remote=doc&&doc.state&&typeof doc.state==="object"?doc.state:null; if(!remote) return;
  if(!S.mig){ S.mig=Date.now(); saveLocal(); }
  else if(!warnedOld&&(doc.updatedAt||0)>S.mig&&(doc.app||0)<APP_VER){
    warnedOld=true; toast("別の端末かタブで、古い版のアプリが開いたままです。その画面を閉じて開き直してください");
  }
  const merged=mergeState(remote,S);
  ["prun","timer","ch","dr","updatedAt","mig"].forEach(k=>{ if(k in S) merged[k]=S[k]; else delete merged[k]; });
  if(stable(merged)!==stable(S)){
    Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,merged); saveLocal();
    renderPill(); ({home:renderHome,plan:renderPlan,book:renderBook,quiz:renderQuiz,cards:renderCards,help:renderHelp,past:renderPast})[current]();
    S.updatedAt=Date.now(); pushCloud();
  }
}
async function initCloud(){
  const c=window.claude;
  if(!c||typeof c.use!=="function"){ setSync("none"); return; }
  setSync("loading");
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid){ setSync("none"); return; }
    // 記録は progress2 に保存する。progress（以前の場所）は古い画面が上書きしてしまうので読むだけ
    cloudRef=db.doc("data/users/"+uid+"/progress2");
    legacyRef=db.doc("data/users/"+uid+"/progress");
    legacyRef.onSnapshot(snap=>{ if(snap.exists) applyLegacy(snap.data()); },()=>{});
    cloudRef.onSnapshot(snap=>{ if(snap.metadata&&snap.metadata.hasPendingWrites) return; applyRemote(snap.exists?snap.data():null); },
      ()=>setSync("error"));
  }catch(e){ setSync("none"); }
}

/* ================= 計画の日付 ================= */
const WD="日月火水木金土";
const md=s=>{const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;};
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
const START=()=>S.start||"2026-10-15";
// 受験日の前日までを8つのパートに分ける。受験日が未設定なら8週間（各7日）
const PRIO=[2,6,1,5,3,4,7,8]; // 余った日を足す順（アルゴリズム・セキュリティを優先）
function schedule(){
  const start=START();
  const end=S.exam&&S.exam>start?addDays(S.exam,-1):addDays(start,55);
  const total=Math.max(8,daysBetween(start,end)+1);
  const base=Math.floor(total/8), lens=Array(8).fill(base);
  for(let rem=total-base*8,i=0;rem>0;rem--,i++) lens[PRIO[i%8]-1]++;
  let off=0;
  return lens.map((len,i)=>{ const from=addDays(start,off); off+=len; return {w:i+1,from,to:addDays(start,off-1),len}; });
}
const wl=n=>schedule().every(x=>x.len===7)?`第${n}週`:`パート${n}`;
function planPos(s=today()){
  const sc=schedule();
  if(s<sc[0].from) return {before:true,days:daysBetween(s,sc[0].from),w:1,day:0,len:sc[0].len};
  const p=sc.find(x=>s>=x.from&&s<=x.to);
  if(!p) return {before:false,over:true,w:8,day:sc[7].len,len:sc[7].len};
  return {before:false,w:p.w,day:daysBetween(p.from,s)+1,len:p.len};
}
function setExam(v){
  if(v&&v<=START()){ toast("受験日は計画の開始日より後の日付にしてください"); return false; }
  S.exam=v||""; save();
  const sc=schedule(), avg=Math.round(sc.reduce((a,x)=>a+x.len,0)/8);
  toast(v?`受験日 ${md(v)} に合わせて計画を組み直しました（1パート約${avg}日）`:"受験日を消しました。8週間の計画に戻しました");
  return true;
}

/* ================= 勉強時間 ================= */
// アプリを開いて操作している時間は自動で数える（2分操作がないと止まる）。紙の勉強はタイマーで
let lastInput=Date.now(), pendingSec=0;
["pointerdown","keydown","scroll","touchstart"].forEach(ev=>addEventListener(ev,()=>{lastInput=Date.now();},{passive:true}));
const fmtDur=sec=>{const m=Math.round((sec||0)/60);return m<60?`${m}分`:`${Math.floor(m/60)}時間${m%60?m%60+"分":""}`;};
const clock=sec=>{sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0");};
const daySec=s=>{const d=getDay(s);return (d.sec||0)+(d.tsec||0)+(s===today()?pendingSec:0);};
function flushTime(){
  if(!pendingSec) return;
  const t=today(), d=S.days[t]||(S.days[t]={q:0,c:0,r:0,n:{}});
  d.sec=(d.sec||0)+pendingSec; pendingSec=0; save();
}
setInterval(()=>{
  if(document.visibilityState!=="visible"||S.timer||Date.now()-lastInput>120000) return;
  pendingSec+=15; if(pendingSec>=60) flushTime();
  const el=document.getElementById("t-today"); if(el) el.textContent=fmtDur(daySec(today()));
},15000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushTime(); });
function startTimer(){ if(S.timer) return; flushTime(); S.timer=Date.now(); save(); renderTimerBar(); toast("タイマーを開始しました。終わったら「止めて記録」を押してください"); }
function stopTimer(){
  if(!S.timer) return;
  const sec=Math.round((Date.now()-S.timer)/1000), t=dstr(new Date(S.timer));
  S.timer=null;
  if(sec>4*3600){ save(); renderTimerBar(); toast("4時間以上動いていたので、止め忘れとして記録しませんでした"); if(current==="home") renderHome(); return; }
  const d=S.days[t]||(S.days[t]={q:0,c:0,r:0,n:{}}); d.tsec=(d.tsec||0)+sec;
  save(); renderTimerBar(); toast(`${fmtDur(sec)}を記録しました`);
  if(current==="home") renderHome();
}
function renderTimerBar(){ const b=document.getElementById("timerbar"); if(!b) return; b.hidden=!S.timer; if(S.timer) $("#tb-time").textContent=clock((Date.now()-S.timer)/1000); }
setInterval(()=>{ if(S.timer){ const el=document.getElementById("tb-time"); if(el) el.textContent=clock((Date.now()-S.timer)/1000); } },1000);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= 毎日の記録 ================= */
const getDay=s=>S.days[s]||{q:0,c:0,r:0,n:{}};
const isActive=s=>{const d=getDay(s);return d.q+d.c+d.r>0||(d.sec||0)+(d.tsec||0)>=300;};
const nightCount=s=>Object.values(getDay(s).n||{}).filter(Boolean).length;
const slotState=s=>{const d=getDay(s);return {am:d.c>=GOAL.c,noon:d.q>=GOAL.q,night:nightCount(s)>=3};};
const SLOTN={am:"朝の10分",noon:"昼の10分",night:"夜の学習"};
const isMission=s=>{const x=slotState(s);return x.am&&x.noon&&x.night;};
function streak(){ let s=today(); if(!isActive(s)) s=addDays(s,-1); let n=0; while(isActive(s)){n++; s=addDays(s,-1);} return n; }
function bestStreak(){
  const ks=Object.keys(S.days).filter(isActive).sort(); let best=0,run=0,prev=null;
  ks.forEach(k=>{ run=(prev&&addDays(prev,1)===k)?run+1:1; best=Math.max(best,run); prev=k; });
  return best;
}
function act(type,fn){
  const t=today(), before=slotState(t), wasActive=isActive(t);
  const d=S.days[t]||(S.days[t]={q:0,c:0,r:0,n:{}}); if(fn) fn(d); if(type) d[type]++; save();
  const after=slotState(t), cleared=Object.keys(after).find(k=>after[k]&&!before[k]);
  if(isMission(t)&&cleared) toast(`朝・昼・夜すべて達成！ 連続 ${streak()} 日`);
  else if(cleared) toast(`${SLOTN[cleared]} クリア！`);
  else if(!wasActive&&isActive(t)) toast(`今日の学習を記録しました。連続 ${streak()} 日目`);
  renderPill();
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=true; void t.offsetWidth; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3200); }
function renderPill(){ const n=streak(); $("#hdr-streak").innerHTML=FLAME(!isActive(today()))+`<span class="mono">${n}</span>日`; }

function fieldStats(f){ let n=0,ok=0,tried=0; Q.forEach(q=>{if(fieldOf(q.c)!==f)return;n++;const s=S.qs[q.id];if(s){tried++;if(s.last)ok++;}}); return {n,ok,tried}; }

function taskAuto(t){
  const chs=t.chs||(t.ch?[t.ch]:null);
  if(chs) return chs.every(c=>S.read[c]);
  const qs=t.qs||(t.q&&chById(t.q)?[t.q]:null);
  if(qs) return Q.filter(q=>qs.includes(q.c)).every(q=>S.qs[q.id]);
  if(t.q==="wrong") return Q.every(q=>S.qs[q.id])&&!Q.some(q=>!S.qs[q.id].last);
  if(t.go==="past") return pastList().some(p=>p.src==="app"&&p.n>=20);
  if(t.auto==="cards1") return CARDS.every(x=>S.cards[x.id]);
  if(t.auto==="cardsAll") return CARDS.every(x=>(S.cards[x.id]||{}).box>=1);
  return false;
}

/* ================= 日ごとの課題（進み具合に合わせる） ================= */
// 全章を「節（見出し）」に分け、計画の順に並べる。今日の範囲は「まだ読んでいない節」の先頭から決まるので、
// 前の日に先へ進んでいれば次の日はその続きから、遅れていれば止まった所から始まる
const PART_CH={1:["kiso"],2:["algo"],3:["hw","sys","hwlogic"],4:["sw","db","hi"],5:["nw"],6:["sec","ai"],7:["dev","pm","sm","strategy","biz","corp"],8:[]};
const secTitles=id=>{ const out=[], re=/<h3>([\s\S]*?)<\/h3>/g; let m; while((m=re.exec(chById(id).body))) out.push(m[1].replace(/<[^>]+>/g,"")); return out; };
let _allSecs=null;
const allSecs=()=>_allSecs||(_allSecs=Object.entries(PART_CH).flatMap(([w,chs])=>chs.flatMap(id=>secTitles(id).map((t,i)=>({ch:id,i,t,w:+w,k:id+":"+i})))));
const secDone=k=>!!(S.secs||{})[k];
// 1日に読む節の数：今いるパートの節の数 ÷ 読む日数（最終日はふり返り）
function dailyQuota(){
  const pp=planPos(), w=pp.before?1:Math.min(pp.w,7), L=schedule()[w-1].len, n=allSecs().filter(x=>x.w===w).length;
  return Math.max(1,Math.ceil(n/Math.max(1,L-1)));
}
// 「読了」にした章は、その章の節を全部読んだことにする
function syncReadSecs(){ S.secs=S.secs||{}; Object.keys(S.read||{}).forEach(ch=>{ if(S.read[ch]&&chById(ch)) secTitles(ch).forEach((_,i)=>{ if(!S.secs[ch+":"+i]) S.secs[ch+":"+i]=today(); }); }); }
function dayPlan(s=today()){
  syncReadSecs();
  const pp=planPos(s), w=pp.before?1:pp.w, day=pp.before?1:pp.day, L=schedule()[w-1].len;
  S.dr=S.dr||{}; S.secs=S.secs||{};
  let keys=S.dr[s];
  // 決めた範囲が、今日より前に読み終えた節だけになっていたら（別の端末の古い記録で決まった場合など）作り直す
  if(s===today()&&keys&&keys.length&&keys.every(k=>S.secs[k]&&S.secs[k]!==s)) keys=null;
  if(!keys){
    const unread=allSecs().filter(x=>!secDone(x.k));
    // パートの最終日で、そのパートまで読み終えていれば「ふり返りの日」
    const caughtUp=!unread.some(x=>x.w<=w);
    keys=(day>=L&&caughtUp)||w>=8&&caughtUp?[]:unread.slice(0,dailyQuota()).map(x=>x.k);
    if(s===today()){ S.dr[s]=keys; Object.keys(S.dr).sort().slice(0,-14).forEach(k=>delete S.dr[k]); saveLocal(); }
  }
  const secs=keys.map(k=>allSecs().find(x=>x.k===k)).filter(Boolean);
  const wt=WEEKS[w-1].tasks, tasks=wt.filter((x,i)=>Math.min(L,Math.floor(i*L/wt.length)+1)===Math.min(day,L));
  return {w,day,L,secs,tasks,done:secs.length>0&&secs.every(x=>secDone(x.k)),chs:[...new Set(secs.map(x=>x.ch))],weekChs:PART_CH[w]};
}
// 今日の分を読み終えた後に「先取り」で読める次の範囲
const aheadRange=()=>{ const td=dayPlan().secs.map(x=>x.k); return allSecs().filter(x=>!secDone(x.k)&&!td.includes(x.k)).slice(0,dailyQuota()); };
function markSecs(list){
  S.secs=S.secs||{}; list.forEach(x=>{ S.secs[x.k]=today(); });
  [...new Set(list.map(x=>x.ch))].forEach(ch=>{ if(secTitles(ch).every((_,i)=>secDone(ch+":"+i))) S.read[ch]=true; });
  save();
}
const rangeText=secs=>{ const byCh={}; secs.forEach(x=>{ (byCh[x.ch]=byCh[x.ch]||[]).push(x.t); }); return Object.entries(byCh).map(([c,ts])=>`「${chById(c).title}」の ${ts.join("・")}`).join("、"); };
// 参考書の章のはじめに出す範囲：今日の範囲（この章の分）→ 今日の分が終わっていれば、この章の次の未読の節（先取り）
function bookRange(ch){
  const dp=dayPlan(), mine=dp.secs.filter(x=>x.ch===ch);
  if(mine.length&&!mine.every(x=>secDone(x.k))) return {label:"今日の範囲",list:mine,btn:"今日の範囲を読み終えた",today:true};
  const next=allSecs().filter(x=>x.ch===ch&&!secDone(x.k)).slice(0,dailyQuota());
  if(next.length&&(dp.done||!dp.secs.length||!dp.secs.some(x=>!secDone(x.k)))) return {label:"先取りの範囲（明日の分）",list:next,btn:"先取りの範囲を読み終えた",today:false};
  if(mine.length) return {label:"今日の範囲",list:mine,done:true,today:true};
  return {list:[]};
}

function roadData(){
  const pp=planPos(), sc=schedule();
  const stages=STAGES.map(st=>{
    const tasks=WEEKS.filter(w=>w.w>=st.weeks[0]&&w.w<=st.weeks[1]).flatMap(w=>w.tasks);
    const done=tasks.filter(taskDone).length;
    const isCur=pp.before?st.n===1:(!pp.over&&pp.w>=st.weeks[0]&&pp.w<=st.weeks[1]);
    return Object.assign({},st,{from:sc[st.weeks[0]-1].from,to:sc[st.weeks[1]-1].to,done,total:tasks.length,
      state:done===tasks.length?"done":isCur?"cur":"todo"});
  });
  let expected=0;
  if(!pp.before) WEEKS.forEach(w=>{ if(pp.over||w.w<pp.w) expected+=w.tasks.length; else if(w.w===pp.w) expected+=Math.floor(w.tasks.length*(pp.day-1)/pp.len); });
  const doneAll=allTasks().filter(taskDone).length, diff=doneAll-expected;
  const pace=pp.before?`${md(START())}にスタートします`:diff>0?`計画より ${diff} タスク先行しています`:diff===0?"計画どおりに進んでいます":`計画より ${-diff} タスク遅れています。夜の時間で追いつけます`;
  const read=CHAPTERS.filter(c=>S.read[c.id]).length, tried=catStats(null).tried, known=CARDS.filter(x=>(S.cards[x.id]||{}).box>=1).length;
  const accPart=s=>s.tried?Math.min((s.ok/s.tried)/0.6,1)*(s.tried/s.n):0;
  const al=catStats("algo");
  const conds=[
    [`参考書${CHAPTERS.length}章をすべて読む`,`${read}/${CHAPTERS.length}`,read/CHAPTERS.length],
    ["全問題に1回は挑戦する",`${tried}/${Q.length}`,tried/Q.length],
    ...Object.entries(FIELDS).map(([k,l])=>{const s=fieldStats(k);return [`${l}の正答率60%以上`,s.tried?pct(s.ok,s.tried)+"%":"未着手",accPart(s)];}),
    ["擬似言語（科目B）の正答率60%以上",al.tried?pct(al.ok,al.tried)+"%":"未着手",accPart(al)],
    ["用語の8割を覚える",`${known}/${CARDS.length}`,Math.min(known/(CARDS.length*0.8),1)],
    (()=>{ const r=pastRecentPct(3); return ["過去問の正答率60%以上（直近3回）",r===null?"未取り込み":r+"%",r===null?0:Math.min(r/60,1)]; })(),
    (()=>{ const t8=allTasks().find(x=>x.id==="8a"), ok=taskDone(t8); return ["IPA公開問題（科目A）を時間を計って解く",ok?"済":"第8週",ok?1:0]; })(),
    ["IPA公開問題（科目B）を時間を計って解く",S.tasks["8b"]?"済":"第8週",S.tasks["8b"]?1:0],
    ["受験日を予約する",S.exam?md(S.exam):"未設定",S.exam?1:0]
  ];
  const ready=Math.round(conds.reduce((a,c)=>a+Math.min(c[2],1),0)/conds.length*100);
  const cur=stages.find(s=>s.state==="cur")||stages.find(s=>s.state!=="done")||stages[3];
  return {pp,stages,pace,conds,ready,cur};
}

          <div class="steps">${STEPS.map(([k,txt,min,btn])=>{const on=!!(d.n||{})[k];return `<div class="step ${on?"done":""}"><input type="checkbox" id="night-${k}" data-step="${k}" ${on?"checked":""}><label for="night-${k}">${esc(txt)}<span class="min">${min}分</span></label>${btn}</div>`;}).join("")}</div>

    </div>
  </div>

  ${timePanel}

  ${(()=>{ const pl=pastList(), tp=pl.filter(p=>p.date===t), lp=pl[pl.length-1];
    const tok=tp.reduce((a,p)=>a+p.ok,0), tn=tp.reduce((a,p)=>a+p.n,0);
    return `<div class="panel past-mini"><div><div class="eyebrow">過去問（科目A形式）</div>
      <b>${S.prun?`解いている途中：${S.prun.picks.length}/${S.prun.ids.length}問`:tn?`今日の結果 ${tok}/${tn}問（${pct(tok,tn)}%）`:"今日はまだ過去問を解いていません"}</b>
      <div class="small-muted">${lp?`最新 ${md(lp.date)}：${pct(lp.ok,lp.n)}%${pastRecentPct(3)!==null&&pl.length>1?` ・ 直近3回の平均 ${pastRecentPct(3)}%`:""}`:"アプリの中で解くと、点数と苦手な分野がそのまま記録されます"}</div></div>
      <button class="btn ${tn&&!S.prun?"":"primary"}" data-goto="past">${S.prun?"続きを解く":tn?"結果を見る":"過去問を解く"}</button></div>`; })()}

  <div class="panel road-mini">
    <div><div class="eyebrow">合格までの道筋</div><b>ステージ${rd.cur.n}/4　${esc(rd.cur.title)}</b>
      <div class="small-muted">合格準備度 ${rd.ready}% ・ ${esc(rd.pace)}</div><div class="bar"><i style="width:${rd.ready}%"></i></div></div>
    <button class="btn" data-goto="plan">道筋を見る</button>

    <div class="legend"><span>少</span><i style="background:var(--sunk)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><span>多</span><span style="margin-left:10px">いちばん濃い色＝ミッション達成日</span></div>

  ${!isStandalone()&&!S.hideInstall?`<div class="panel install">

      <div class="exam-grid">
        <div class="exam-card"><h3>科目A</h3>知識問題（四肢択一）<span class="mono">60問・90分・600点以上</span></div>
        <div class="exam-card"><h3>科目B</h3>擬似言語とセキュリティ<span class="mono">20問・100分・600点以上</span></div>

/* ================= カリキュラム ================= */
function renderPlan(){
  $("#v-plan").innerHTML=`
  <div><div class="eyebrow">8週間プラン ／ 1日 約1時間20分〜2時間20分</div>
  <h2 style="font-size:26px;margin-top:4px">カリキュラム</h2>
  <p class="lead">前半4週で科目Aの土台、5〜6週でネットワーク・セキュリティ・AI、7週で文系分野、8週で本番形式の演習です。内容は基本情報のシラバスVer.9.2（2026年1月改訂）に合わせています。</p></div>
  ${roadHTML()}
  <div class="panel"><div class="eyebrow">1日の流れ</div>
    <div class="flow">
      <div><b>朝 10分</b><span class="mono">スマホだけ</span><br>暗記カード10枚。前の日に覚えた用語の復習が先に出ます。</div>
      <div><b>昼 10分</b><span class="mono">スマホだけ</span><br>今日の5問。間違えた問題は翌日また出ます。</div>
      <div><b>夜 1〜2時間</b><span class="mono">紙とペン</span><br>下の週のタスクを進める。参考書 → 章の問題 → 科目Bのトレース → 復習。</div>
    </div>
    <p class="small-muted" style="margin:10px 0 0">「読む」「解く」などのボタンが付いたタスクは、章を読み終えたり問題を全部解いたりすると<b>自動でチェックが付きます</b>。紙で勉強するタスクだけ、終わったら自分でチェックしてください。週のタスクは夜の時間に1〜2個ずつ進めます。忙しい日は朝のカードだけでも続ければ、連続記録は途切れません。</p>
  </div>
  ${(()=>{ const sc=schedule(), total=daysBetween(sc[0].from,sc[7].to)+1;
    const note=!S.exam?`受験日を入れると、8つのパートの日数をその日に合わせて組み直します（いまは8週間・${total}日で計算）。`
      :`受験日 ${md(S.exam)} の前日までの ${total} 日を、8つのパートに分けています（1パート ${Math.min(...sc.map(x=>x.len))}〜${Math.max(...sc.map(x=>x.len))}日）。`
       +(total<35?" 期間が短めなので、夜は2時間にして「明日の分を先取り」も使いましょう。":total>100?" 期間に余裕があるので、夜は1時間でも間に合います。":"");
    return `<div class="panel plan-start">
    <label for="plan-start">計画の開始日</label><input type="date" id="plan-start" value="${START()}">
    <label for="plan-exam">受験日</label><input type="date" id="plan-exam" value="${esc(S.exam)}" min="${addDays(START(),1)}">
    ${S.exam?`<button class="btn small" id="plan-exam-clear">受験日を消す</button>`:""}
    <span class="small-muted" style="flex-basis:100%">${note}</span></div>`; })()}
  <div class="weeks">${WEEKS.map(w=>{const d=w.tasks.filter(taskDone).length, pp=planPos(), sp=schedule()[w.w-1];
    const cur=!pp.before&&!pp.over&&pp.w===w.w, past=!pp.before&&(pp.over||w.w<pp.w), left=w.tasks.length-d;
    return `<article class="week ${cur?"cur":""}">
      <div class="week-head"><span class="week-no">${wl(w.w)}</span><h3>${esc(w.title)}</h3>${cur?`<span class="wtag">いまここ</span>`:""}${past&&left?`<span class="wtag late">やり残し ${left}</span>`:""}<span class="pct">${d}/${w.tasks.length}</span><span class="dates">${md(sp.from)} 〜 ${md(sp.to)}（${sp.len}日）</span></div>
      <p class="goal">${esc(w.goal)}</p>
      <div>${w.tasks.map(t=>`<div class="task ${taskDone(t)?"done":""}">
          <input type="checkbox" id="task-${t.id}" data-task="${t.id}" ${taskDone(t)?"checked":""}>
          <label for="task-${t.id}">${esc(t.t)}</label>
          ${t.ch?`<button class="btn small go" data-open-ch="${t.ch}">読む</button>`:""}
          ${t.q?`<button class="btn small go" data-open-q="${t.q}">解く</button>`:""}
          ${t.go?`<button class="btn small go" data-goto="${t.go}">過去問</button>`:""}
        </div>`).join("")}</div></article>`;}).join("")}</div>`;
  $("#v-plan").querySelectorAll("[data-task]").forEach(cb=>cb.addEventListener("change",()=>{
    S.tasks[cb.dataset.task]=cb.checked; save(); if(cb.checked) act("r");
    cb.closest(".task").classList.toggle("done",cb.checked);
    const wk=cb.closest(".week"), all=wk.querySelectorAll("[data-task]");
    wk.querySelector(".pct").textContent=[...all].filter(x=>x.checked).length+"/"+all.length;
  }));
  $("#plan-start").addEventListener("change",e=>{ if(e.target.value){ if(S.exam&&e.target.value>=S.exam){ toast("開始日は受験日より前にしてください"); renderPlan(); return; } S.start=e.target.value; save(); renderPlan(); } });
  $("#plan-exam").addEventListener("change",e=>{ if(e.target.value) setExam(e.target.value); renderPlan(); });
  const pc=$("#plan-exam-clear"); if(pc) pc.addEventListener("click",()=>{ setExam(""); renderPlan(); });
  bindJumps($("#v-plan"));
}

// 記録の引っ越し：claude.ai版とオフライン版（ホーム画面アプリ）の間で、記録を文字にして移す
function moveHTML(){

// 記録を短い文字にする（gzip＋base64）。古い形式（FE-REC1:JSON）も読める
const b64e=buf=>{ let s=""; const u=new Uint8Array(buf); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
async function packRec(){
  const js=JSON.stringify(S);
  try{ if(window.CompressionStream){ const buf=await new Response(new Blob([js]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer(); return "FE-REC2:"+b64e(buf); } }catch(e){}
  return "FE-REC1:"+js;
}
async function unpackRec(t){
  t=String(t||"").trim(); if(!t) return null;
  if(/%[0-9A-Fa-f]{2}/.test(t)){ try{ t=decodeURIComponent(t); }catch(e){} }
  const m=t.match(/FE-REC2:([A-Za-z0-9+\/=\s]+)/);
  if(m){ const bin=atob(m[1].replace(/\s+/g,"")), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    const js=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); t=js; }
  const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<a) return null;
  const o=JSON.parse(t.slice(a,b+1)); return o&&typeof o==="object"&&o.days?o:null;
}
function bindMove(root){
  const out=root.querySelector("#mv-out"); if(!out) return;
  const ta=root.querySelector("#mv-text"), cp=root.querySelector("#mv-copy");
  out.addEventListener("click",async()=>{ ta.value=await packRec(); cp.hidden=false; ta.focus(); ta.select(); });
  cp.addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(ta.value); toast("コピーしました。移す先で貼り付けてください"); }catch(e){ ta.select(); try{ document.execCommand("copy"); toast("コピーしました"); }catch(_){ toast("文字を長押ししてコピーしてください"); } } });
  root.querySelector("#mv-in").addEventListener("click",async()=>{
    let o=null; try{ o=await unpackRec(ta.value); }catch(e){ o=null; }
    if(!o){ toast("読み込めませんでした。書き出した文字を全部貼り付けてください"); return; }
    if(!o||typeof o!=="object"||!o.days){ toast("このアプリの記録ではないようです"); return; }
    const merged=mergeState(o,S); Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,merged); S.updatedAt=Date.now(); save();
    toast("記録を読み込みました"); renderPill(); renderHome();
  });
}

let quiz=null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(cat){
  let pool;
  if(cat==="today"){
    // 復習日が来た問題（昨日・今日やったものは除く）→ まだ解いていない問題 → 前に解いた問題。足りないときだけ最近の問題
    const recent=q=>seenRecently(S.qs[q.id]);
    const due=shuffle(dueQs().filter(q=>!recent(q))).sort((x,y)=>S.qs[x.id].due<S.qs[y.id].due?-1:S.qs[x.id].due>S.qs[y.id].due?1:0);
    // まだ解いていない問題は、読み終えた章のものを混ぜて出す（読んでいない章は本の順）
    const fr=Q.filter(q=>!S.qs[q.id]), fresh=[...shuffle(fr.filter(q=>S.read[q.c])),...fr.filter(q=>!S.read[q.c])];
    const rest=shuffle(Q.filter(q=>S.qs[q.id]&&!recent(q)&&!due.includes(q)));
    pool=[...due,...fresh,...rest,...shuffle(Q.filter(recent))].slice(0,GOAL.q);
  }
  else if(cat==="next"){
    // 明日の分の先取り：まだ解いていない問題 → 前に解いた問題（昨日・今日の分は最後）
    const recent=q=>seenRecently(S.qs[q.id]);
    const fresh=Q.filter(q=>!S.qs[q.id]);
    pool=[...fresh,...shuffle(Q.filter(q=>S.qs[q.id]&&!recent(q))),...shuffle(Q.filter(recent))].slice(0,GOAL.q);
  }
  else if(cat==="wrong") pool=Q.filter(q=>S.qs[q.id]&&!S.qs[q.id].last);
  else if(cat==="random") pool=shuffle(Q).slice(0,10);
  else if(cat==="all") pool=shuffle(Q);
  else { pool=Q.filter(q=>q.c===cat); if(chById(cat)){ S.ch=cat; saveLocal(); } }
  quiz={cat,ids:pool.map(q=>q.id),i:0,picked:null,score:0,res:[]};
}

let deck=null;
function startDeck(cat,onlyNew){
  let pool;
  if(cat==="today"){
    // 復習日が来た札（昨日・今日見たものは除く）→ まだ見ていない札。足りないときだけ最近の札
    const recent=x=>seenRecently(S.cards[x.id]);
    const due=dueCards().filter(x=>!recent(x)), fresh=CARDS.filter(x=>!S.cards[x.id]);
    pool=[...shuffle(due),...fresh,...shuffle(CARDS.filter(x=>S.cards[x.id]&&recent(x)))].slice(0,Math.max(GOAL.c,Math.min(due.length,20)));
  } else if(cat==="next"){
    // 明日の分の先取り：まだ見ていない札 → まだ覚えきれていない札（昨日・今日の分は除く）
    const fresh=CARDS.filter(x=>!S.cards[x.id]);
    pool=[...fresh,...shuffle(CARDS.filter(x=>S.cards[x.id]&&(S.cards[x.id].box||0)<3&&!seenRecently(S.cards[x.id])))].slice(0,GOAL.c);
  } else {
    if(chById(cat)){ S.ch=cat; saveLocal(); }
    pool=CARDS.filter(x=>cat==="all"||x.c===cat);
    if(onlyNew) pool=pool.filter(x=>!((S.cards[x.id]||{}).box>=1));
    pool=shuffle(pool);
  }
  deck={cat,onlyNew,ids:pool.map(x=>x.id),i:0,flipped:false,again:{}};
}
function renderCards(){
  if(!deck) startDeck("today",false);
  const knownN=CARDS.filter(x=>(S.cards[x.id]||{}).box>=1).length;
  let body;
  if(!deck.ids.length){
    body=`<div class="flash"><div class="term">出す札がありません</div><div class="small-muted">範囲を変えてください。</div></div>`;
  } else if(deck.i>=deck.ids.length){
    const d=getDay(today());
    body=`<div class="flash"><div class="term">1周完了</div><div class="small-muted">覚えた札：全体で ${knownN} / ${CARDS.length}<br>「覚えた」札は数日後に復習として戻ってきます。</div></div>
      <div class="next-cta">
        ${chById(deck.cat)?(()=>{const nc=nextChapterAfter(deck.cat);return `<button class="btn primary" data-open-ch="${nc}">この章は完了！ 次の章「${esc(chById(nc).title)}」を読む →</button>`;})()
          :`<button class="btn primary" data-goto="home">ホームへ戻る（次の枠へ）</button>`}
        <button class="btn" id="f-again">もう1周</button>
      </div>`;
  } else {
    const x=CARDS.find(y=>y.id===deck.ids[deck.i]), c=chById(x.c), box=(S.cards[x.id]||{}).box||0;
    body=`<button class="flash" id="flash" aria-label="カードをめくる">
        <div class="eyebrow"><i class="field-dot f-${c.field}"></i>${esc(c.title)}</div>
        <div class="term">${esc(x.t)}</div>
        ${deck.flipped?`<div class="def">${esc(x.d)}</div>`:`<div class="hint">タップして意味を見る</div>`}
        <div class="lv" title="覚え具合">${[1,2,3,4,5].map(k=>`<i class="${box>=k?"on":""}"></i>`).join("")}</div>
      </button>
      ${deck.flipped?`<div class="explain">
        <div class="ex-btns">${sampleFn&&!sampleOff?`<button class="btn" id="f-explain" ${EXPL[x.id]&&EXPL[x.id].loading?"disabled":""}>${EXPL[x.id]?"もう一度説明してもらう":"もっとやさしく説明して"}</button>`:""}${ANIMCARD[x.id]?animBtn(ANIMCARD[x.id],"アニメで見る"):""}<button class="btn" data-open-ch="${x.c}">参考書で確認</button></div>
        ${EXPL[x.id]?`<div class="ex-text" id="ex-text">${esc(EXPL[x.id].text||"考え中…")}</div>`:""}
        ${sampleMsg?`<div class="small-muted" style="text-align:center">${esc(sampleMsg)}</div>`:""}
      </div>`:""}
      <div class="small-muted mono">${deck.i+1} / ${deck.ids.length}</div>
      <div class="flash-ctl">
        <button class="btn" id="f-no">まだ</button>
        <button class="btn primary" id="f-yes">覚えた</button>
      </div>`;
  }
  $("#v-cards").innerHTML=`
  <div><div class="eyebrow">用語 ${CARDS.length} 枚 ／ 覚えた ${knownN} 枚${deck.cat==="next"?" ／ 明日の分を先取り中":""}</div><h2 style="font-size:26px;margin-top:4px">暗記カード</h2>
  <p class="lead">用語を見て意味を思い出してからめくります。「まだ」の札はこの周の最後にもう一度出ます。「覚えた」札は1日後・3日後・7日後…と間隔を空けて復習に戻ってきます。</p></div>
  ${chById(deck.cat)?flowBar(3):modeBar(deck.cat==="today"?"今日のカード（朝の10分）":deck.cat==="next"?"明日の分を先取り中":"全分野のカード")}
  <div class="chips scroll" role="group" aria-label="範囲">
    <button class="chip" data-dcat="today" aria-pressed="${deck.cat==="today"}">今日のカード</button>
    <button class="chip" data-dcat="all" aria-pressed="${deck.cat==="all"}">全分野</button>
    ${CHAPTERS.map(c=>`<button class="chip" data-dcat="${c.id}" aria-pressed="${deck.cat===c.id}">${esc(c.title)}</button>`).join("")}
  </div>
  ${deck.cat!=="today"?`<div class="chips"><button class="chip" id="f-only" aria-pressed="${deck.onlyNew}">まだ覚えていない札だけ</button></div>`:""}
  <div class="flash-wrap">${body}</div>`;
  const root=$("#v-cards");
  root.querySelectorAll("[data-dcat]").forEach(b=>b.addEventListener("click",()=>{startDeck(b.dataset.dcat,deck.onlyNew);renderCards();}));
  const fo=$("#f-only"); if(fo) fo.addEventListener("click",()=>{startDeck(deck.cat,!deck.onlyNew);renderCards();});
  const f=$("#flash"); if(f) f.addEventListener("click",()=>{deck.flipped=!deck.flipped;renderCards();});
  const fx=$("#f-explain"); if(fx) fx.addEventListener("click",()=>explainCard(CARDS.find(y=>y.id===deck.ids[deck.i]),!!EXPL[deck.ids[deck.i]]));
  const y=$("#f-yes"); if(y) y.addEventListener("click",()=>judge(true));
  const n=$("#f-no"); if(n) n.addEventListener("click",()=>judge(false));
  const ag=$("#f-again"); if(ag) ag.addEventListener("click",()=>{startDeck(deck.cat,deck.onlyNew);renderCards();});
  bindJumps(root); bindFlow(root);
}
// 用語をClaudeにやさしく説明してもらう（押したときだけ。答えは見ている人のClaudeの利用枠を使う）
let sampleFn=null, sampleOff=false, sampleMsg="";
const EXPL={};
(async()=>{ try{ if(window.claude&&typeof window.claude.use==="function") sampleFn=await window.claude.use("sample"); }catch(e){} if(sampleFn&&current==="cards") renderCards(); })();
async function explainCard(x,again){
  if(!sampleFn||!x) return;
  sampleMsg=""; EXPL[x.id]={loading:true,text:""}; renderCards();
  const ch=chById(x.c).title;
  const prompt=`基本情報技術者試験を勉強し始めたばかりの人に、用語「${x.t}」（分野：${ch}）をやさしく説明してください。\n教科書の説明：「${x.d}」\n条件：日本語。専門用語はなるべく使わず、使うときは言いかえる。身近なたとえを1つ入れる。全体で150〜220字。最後に改行して「試験のポイント：」で始まる1文を付ける。見出し・箇条書き・#や**などの記号は使わない。`;
  try{
    const r=await sampleFn(prompt,{modelTier:"quick",cache:again?{gcTime:86400000,refresh:true}:{gcTime:86400000},
      onText:({text})=>{ EXPL[x.id].text=text; const el=document.getElementById("ex-text"); if(el&&deck.ids[deck.i]===x.id) el.textContent=text; }});
    EXPL[x.id]={loading:false,text:r.text};
  }catch(e){
    const code=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ sampleOff=true; sampleMsg="この画面ではClaudeに説明を頼めません。「参考書で確認」で詳しく読めます。"; delete EXPL[x.id]; }
    else if(code==="cancelled"){ delete EXPL[x.id]; }
    else { sampleMsg=code==="rate_limited"?"いまは混み合っています。少し時間をおいてもう一度押してください。":"説明を受け取れませんでした。もう一度押してください。"; if(e&&e.text) EXPL[x.id]={loading:false,text:e.text}; else delete EXPL[x.id]; }
  }
  if(current==="cards") renderCards();
}
function judge(ok){
  const id=deck.ids[deck.i], s=S.cards[id]||{box:0};
  s.seen=today(); s.at=Date.now();
  if(ok){ s.box=Math.min((s.box||0)+1,5); s.due=addDays(today(),INT[s.box]); }
  else { s.box=0; s.due=today(); if(!deck.again[id]){ deck.again[id]=1; deck.ids.push(id); } }
  S.cards[id]=s; save(); act("c");
  deck.i++; deck.flipped=false; renderCards();
}
document.addEventListener("keydown",e=>{
  if(current!=="cards"||!deck||deck.i>=deck.ids.length||!deck.ids.length) return;
  if(e.target.closest&&e.target.closest("input,select,textarea,button")) return;
  if(e.key===" "){e.preventDefault();deck.flipped=!deck.flipped;renderCards();}
  else if(e.key==="ArrowRight") judge(true);
  else if(e.key==="ArrowLeft") judge(false);
});
