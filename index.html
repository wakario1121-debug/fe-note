<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>基本情報 学習ノート</title>
<meta name="theme-color" content="#2F49C4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="基本情報">

</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 参考書の「本文＋蛍光ペン」を軸にした一画面アプリ。スマホでは下部タブ、PCでは上部タブ */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#13212B; --muted:#56656F; --line:#D2DBE2;
  --accent:#2F49C4; --accent-ink:#FFFFFF; --accent-soft:#E2E7FB;
  --marker:#FFE76A; --marker-ink:#13212B;
  --tech:#2F6FD0; --mgmt:#1E8A5A; --strat:#C26A12;
  --ok:#1E8A5A; --ok-soft:#DDF1E6; --ng:#C23B3B; --ng-soft:#F8E0E0;
  --h1:#C9D3F5; --h2:#8A9DEB; --h3:#2F49C4;
  --code-bg:#17232C; --code-ink:#E2ECF2;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16212A; --sunk:#1D2A34; --ink:#E3EAEF; --muted:#9AAAB5; --line:#2A3946;
  --accent:#8EA2FF; --accent-ink:#0E151B; --accent-soft:#232F55;
  --marker:#6B5A0E; --marker-ink:#FFF6CC;
  --tech:#7FA9F0; --mgmt:#5CC995; --strat:#EEA35C;
  --ok:#5CC995; --ok-soft:#173A2A; --ng:#F08686; --ng-soft:#3E1F22;
  --h1:#26335E; --h2:#4A5FB8; --h3:#8EA2FF;
  --code-bg:#0A1015; --code-ink:#DCE7EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16212A; --sunk:#1D2A34; --ink:#E3EAEF; --muted:#9AAAB5; --line:#2A3946;
  --accent:#8EA2FF; --accent-ink:#0E151B; --accent-soft:#232F55;
  --marker:#6B5A0E; --marker-ink:#FFF6CC;
  --tech:#7FA9F0; --mgmt:#5CC995; --strat:#EEA35C;
  --ok:#5CC995; --ok-soft:#173A2A; --ng:#F08686; --ng-soft:#3E1F22;
  --h1:#26335E; --h2:#4A5FB8; --h3:#8EA2FF;
  --code-bg:#0A1015; --code-ink:#DCE7EE; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}

/* header + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:baseline;gap:8px;padding-block:12px;flex:none}
.brand h1{font-size:18px;font-weight:900;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{border:0;background:none;padding:14px 12px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab .ic{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.pill{margin-left:auto;flex:none;display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px 4px 8px;font-weight:700;font-size:14px}
.pill .ic{width:18px;height:18px}
.flame{fill:var(--strat);stroke:none}
.flame.off{fill:var(--line)}

main{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
.view{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:65ch;margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.f-tech{background:var(--tech)} .f-mgmt{background:var(--mgmt)} .f-strat{background:var(--strat)}
.small-muted{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}

/* home: today */
.today{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.mission-head{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.ring.done .fg{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:20px}
.mission h2{font-size:clamp(20px,3.2vw,26px);font-weight:900;margin-top:2px}
.mission h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--marker) 58%)}
.mrows{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.mrow .lbl{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.mrow .lbl .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px}
.mrow.ok .lbl .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mrow .bar{grid-column:1/2;margin:0}
.mrow .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.mrow .btn{grid-row:1/3;grid-column:2}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.slot{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.slot.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot-h .when{font-family:var(--f-display);font-weight:900;font-size:18px}
.slot-h .dur{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.now-tag{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px}
.slot .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.slot.ok .slot-h .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.slot-body{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.slot .what{font-weight:700}
.slot .hint{font-size:12.5px;color:var(--muted)}
.slot .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slot .chip{padding:3px 10px;font-size:12px}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.step input{width:20px;height:20px;accent-color:var(--ok);margin:0}
.step label{font-size:14px;min-width:0}
.step .min{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:6px;white-space:nowrap}
.step.done label{color:var(--muted);text-decoration:line-through}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.flow > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-size:14px}
.flow b{font-family:var(--f-display);font-size:17px;display:block}
.flow .mono{font-size:12px;color:var(--muted)}
@media (max-width:560px){.flow{grid-template-columns:1fr}}
.help-btn{margin-left:0;padding:4px 12px}
.rd{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--accent-soft)}
.rd summary{font-weight:700;cursor:pointer;color:var(--accent)}
.rd table.t{background:var(--surface)}
.rd td.mono{font-size:12.5px;white-space:nowrap}
.road-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;margin-top:12px}
.road{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:18px;min-width:0}
.stage::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage.done::before{background:var(--ok)}
.stage .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;position:relative;z-index:1}
.stage.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stage.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage h4{font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stage .dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.stage p{margin:2px 0 4px;font-size:13.5px;color:var(--muted)}
.stage .bar{max-width:240px}
.chs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chs span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chs span.ok{background:var(--ok-soft);border-color:transparent}
.ready{display:flex;gap:16px;align-items:center}
.ready .big{font-family:var(--f-mono);font-size:46px;font-weight:600;line-height:1}
.ready .big small{font-size:18px;color:var(--muted)}
.ready > div:last-child{flex:1;min-width:0}
.pace{margin:10px 0 0;font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--bg)}
.conds{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.cond{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.cond .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700}
.cond.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cond .v{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.road-mini{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.road-mini > div{flex:1;min-width:200px}
.road-mini b{font-family:var(--f-display);font-size:17px}
@media (max-width:860px){.road-grid{grid-template-columns:1fr}}
.timerbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 16px;background:var(--accent);color:var(--accent-ink);font-size:14px}
.timerbar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.timerbar b{font-size:16px}
.exam-setup{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--accent)}
.exam-setup > div:first-child{flex:1;min-width:220px}
.exam-setup b{font-family:var(--f-display);font-size:17px}
.exam-setup .pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exam-setup input,.plan-start input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.time-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.time-big{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1}
.time-sub{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.time-sub b{color:var(--ink);font-family:var(--f-mono)}
.tbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px;align-items:end}
.tbar{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.tbar .col{width:100%;max-width:34px;height:90px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.tbar .col i{display:block;width:100%}
.tbar .col .a{background:var(--accent)} .tbar .col .t{background:var(--strat)}
.tbar .col .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--muted)}
.tbar.now{color:var(--ink);font-weight:700}
.tlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.tlegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.flowbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.fb-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb-top select{font:inherit;font-weight:700;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%;min-width:0;flex:1}
.fb-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px}
.fb-arrow{color:var(--muted);font-weight:700}
.fb-step{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;text-align:left}
.fb-step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:12px;font-weight:700;flex:none}
.fb-step b{display:block;font-size:14px;line-height:1.3}
.fb-step small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.fb-step.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.fb-step.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fb-step.ok .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.modebar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-weight:700}
.next-cta{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;max-width:420px}
.next-cta .btn.primary{padding:14px;font-size:15px}
@media (max-width:560px){#v-quiz .lead,#v-cards .lead{display:none}}
@media (max-width:420px){.fb-step{padding:6px 7px;gap:6px}.fb-step .n{width:20px;height:20px;font-size:11px}.fb-steps{gap:3px}}
.explain{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px}
.ex-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ex-text{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;white-space:pre-wrap;line-height:1.8}
.player{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.6);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pl-in{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.pl-head{display:flex;align-items:center;gap:8px}
.pl-head b{flex:1;font-family:var(--f-display);font-size:17px;min-width:0}
.pl-stage{margin:0;padding:8px}
.pl-stage svg{max-width:100%}
.pl-cap{font-size:16px;line-height:1.7;min-height:5.4em;padding:10px 14px;background:var(--bg);border-radius:10px}
.pl-ctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.pl-ctl .btn{padding:12px 8px}
.pl-dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.pl-dots i{width:8px;height:8px;border-radius:50%;background:var(--sunk)}
.pl-dots i.on{background:var(--accent)}
.bookv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bv-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.bv-head b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.bv-img{background:#fff;border-radius:8px;overflow:hidden;max-width:820px;margin:0 auto}
.bv-img img{display:block;width:100%;height:auto}
.bv-img.zoom{max-width:none;width:200%}
.bv-term{max-width:820px;margin:0 auto 8px;background:#FFF3B0;color:#3a2f00;border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}
.bv-ctl{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
.bv-ctl select{grid-column:1/-1;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.bv-ctl .btn{padding:10px 8px}
.bv-pos{font-family:var(--f-mono,monospace);font-size:13px;color:var(--muted);text-align:center;min-width:6em}
.bv-imp{max-width:520px;margin:20px auto;background:var(--surface);border-radius:14px;padding:18px;line-height:1.8}
.bv-imp ol{padding-left:1.3em}
.bv-pick{display:inline-block;margin:6px 0;cursor:pointer}
.bv-open{margin-top:8px}
mark.hit,.hit-on{background:#FFE24D!important;color:#2a2200!important;border-radius:3px;box-shadow:0 0 0 2px #FFE24D}
.hit-blk{outline:3px solid #FFD400;outline-offset:3px;border-radius:6px;animation:hitf 1.6s ease 2}
@keyframes hitf{50%{outline-color:transparent}}
.jump-bar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--surface);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.jump-bar .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.jump-bar span{flex:1;min-width:0;font-weight:700;font-size:14px}

    const [x1,y1]=N[a],[x2,y2]=N[b],d=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/d,uy=(y2-y1)/d;
    const c=hl&&cr?"la":"ln";
    s+=A(x1+ux*r,y1+uy*r,x2-ux*(r+1),y2-uy*(r+1),c)+C(lx,ly,l,`class="s b ${hl&&cr?"ac":""}"`);

  Object.entries(N).forEach(([k,[x,y]])=>{s+=`<circle class="bx" cx="${x}" cy="${y}" r="${r}"/>`+C(x,y+4,k,'class="mono b s"');});
  return fig(380,155,s, hl?"最も長い経路 B→D→E（12日）がクリティカルパス。A→C→Eは10日なので2日の余裕がある":"アローダイアグラム（丸は作業の区切り、矢印が作業）");
}

  const r=26, ax=x+32, bx2=x+60, cy=y+36, id="v"+Math.random().toString(36).slice(2,8);
  const cA=`<circle cx="${ax}" cy="${cy}" r="${r}"/>`, cB=`<circle cx="${bx2}" cy="${cy}" r="${r}"/>`;
  const rect=`<rect x="${x}" y="${y}" width="92" height="72"/>`;
  const fillA=`<g clip-path="url(#${id}a)">`, fill='style="fill:var(--accent);opacity:.75"';
  let defs=`<defs><clipPath id="${id}a">${cA}</clipPath><clipPath id="${id}b">${cB}</clipPath><mask id="${id}m"><rect x="${x}" y="${y}" width="92" height="72" fill="white"/>${cA.replace('/>',' fill="black"/>')}${cB.replace('/>',' fill="black"/>')}</mask><mask id="${id}n"><rect x="${x}" y="${y}" width="92" height="72" fill="white"/><g clip-path="url(#${id}a)">${cB.replace('/>',' fill="black"/>')}</g></mask><mask id="${id}x"><rect x="${x}" y="${y}" width="92" height="72" fill="black"/>${cA.replace('/>',' fill="white"/>')}${cB.replace('/>',' fill="white"/>')}<g clip-path="url(#${id}a)">${cB.replace('/>',' fill="black"/>')}</g></mask><mask id="${id}o"><rect x="${x}" y="${y}" width="92" height="72" fill="white"/>${cA.replace('/>',' fill="black"/>')}</mask></defs>`;
  let sh="";
  if(shade==="and") sh=`<g clip-path="url(#${id}a)"><circle cx="${bx2}" cy="${cy}" r="${r}" ${fill}/></g>`;
  if(shade==="or") sh=`<circle cx="${ax}" cy="${cy}" r="${r}" ${fill}/><circle cx="${bx2}" cy="${cy}" r="${r}" ${fill}/>`;
  if(shade==="xor"){ const cp=(cx)=>`M${cx-r} ${cy} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0`; sh=`<path d="${cp(ax)} ${cp(bx2)}" fill-rule="evenodd" ${fill}/>`; }
  if(shade==="nota") sh=`<rect x="${x}" y="${y}" width="92" height="72" ${fill} mask="url(#${id}o)"/>`;
  if(shade==="nand") sh=`<rect x="${x}" y="${y}" width="92" height="72" ${fill} mask="url(#${id}n)"/>`;
  if(shade==="nor") sh=`<rect x="${x}" y="${y}" width="92" height="72" ${fill} mask="url(#${id}m)"/>`;
  if(shade==="a") sh=`<circle cx="${ax}" cy="${cy}" r="${r}" ${fill}/>`;
  return defs+sh+`<rect class="lm" x="${x}" y="${y}" width="92" height="72" style="fill:none"/><circle class="ln" cx="${ax}" cy="${cy}" r="${r}" style="fill:none"/><circle class="ln" cx="${bx2}" cy="${cy}" r="${r}" style="fill:none"/>`+
    T(ax-14,cy+4,"A",'class="xs b"')+T(bx2+8,cy+4,"B",'class="xs b"')+label.split("|").map((l,k)=>C(x+46,y+88+k*15,l,`class="${k?"xs m":"s b"}"`)).join("");
};

const gate=(x,y,type)=>{ // 幅50・高さ36の論理ゲート（MIL記号）
  const h=36, m=y+h/2; let p="";
  if(type==="and"||type==="nand") p=`<path class="bx" d="M${x} ${y} h24 a18 18 0 0 1 0 36 h-24 z"/>`;
  if(type==="or"||type==="nor"||type==="xor") p=`<path class="bx" d="M${x} ${y} q30 0 44 18 q-14 18 -44 18 q12 -18 0 -36 z"/>`+(type==="xor"?`<path class="ln" d="M${x-7} ${y} q12 18 0 36" style="fill:none"/>`:"");
  if(type==="not") p=`<path class="bx" d="M${x} ${y+2} l36 16 l-36 16 z"/>`;
  if(type==="nand"||type==="nor"||type==="not") p+=`<circle class="bx" cx="${type==="not"?x+40:x+46}" cy="${m}" r="4"/>`;
  return p;
};

{ id:"kiso", field:"tech", title:"基礎理論①（数の表し方）", sub:"データの単位・2進数と16進数・基数変換・負の数・シフト演算",
body:`
<div class="point"><b>この章の進め方</b>計算問題が多く、最初の章なのに少し難しく感じるかもしれません。でも、試験全体（科目A 60問）から見ると、この章から出るのは1〜3問ほどです。分からないところがあったら<span class="mk">いったん飛ばして、あとで読み返す</span>くらいの気持ちで進めてください。本番でも、時間がかかりそうな計算問題は後回しにするのがコツです。</div>
<p><b>この章のゴール</b>：「10進数の 7÷32 を2進数で表すと？」（答えは 0.00111）のような問題を、迷わず解けるようになること。基数変換とシフト演算の両方を使う、この章のまとめのような問題です。</p>

<h3>データの単位</h3>
<p>コンピュータが扱う情報の<b>いちばん小さな単位がビット</b>です。1ビットは「0」か「1」のどちらか1つを表します。電気が流れている・流れていない、の2つの状態だと考えると分かりやすいです。</p>
<p>ビットを<span class="mk">8個まとめたものが1バイト</span>です。ビットが1つ増えるごとに表せるパターンは2倍になるので、nビットでは <b>2ⁿ通り</b>、1バイト（8ビット）なら 2⁸＝<b>256通り</b>を表せます。「10010011」のような0と1の並びを、試験では<b>ビット列</b>や<b>ビットパターン</b>と呼びます。</p>
${FIG.bitbyte}
<p>とても大きな数や、とても小さな数を短く書くために、<b>接頭語</b>を使います。となり同士は<span class="mk">1000倍</span>ずつ違います。</p>
${FIG.prefix}
<div class="tw"><table class="t"><tr><th>記号</th><th>読み</th><th>大きさ</th><th>記号</th><th>読み</th><th>大きさ</th></tr>
<tr><td>k</td><td>キロ</td><td>10³（千）</td><td>m</td><td>ミリ</td><td>10⁻³（千分の1）</td></tr>
<tr><td>M</td><td>メガ</td><td>10⁶（百万）</td><td>μ</td><td>マイクロ</td><td>10⁻⁶（百万分の1）</td></tr>
<tr><td>G</td><td>ギガ</td><td>10⁹（十億）</td><td>n</td><td>ナノ</td><td>10⁻⁹（十億分の1）</td></tr>
<tr><td>T</td><td>テラ</td><td>10¹²（一兆）</td><td>p</td><td>ピコ</td><td>10⁻¹²（一兆分の1）</td></tr></table></div>
<p>例えば、スマホの通信量でおなじみの「1GB（ギガバイト）」は 10億バイト、ビットに直すと 80億ビットです。</p>
<div class="formula">例1：1GHz のCPUの1クロック ＝ 1 ÷ 10⁹ 秒 ＝ 1ナノ秒
例2：1ミリ秒 ＝ 1,000マイクロ秒 ＝ 1,000,000ナノ秒
例3：100Mビット/秒の回線で 1Gバイト送る → 8Gビット ÷ 0.1Gビット/秒 ＝ 80秒</div>
<div class="point"><b>ここに注意</b>ビット（b）とバイト（B）の取り違えが、計算ミスでいちばん多い原因です。回線の速さはビット、ファイルの大きさはバイトで書かれることが多いので、「×8」「÷8」を忘れないようにしましょう。なお、記憶容量では 2¹⁰＝1024倍で数えることもありますが、試験では問題文の指示に従います。</div>
<p class="small-muted">今後の試験は計算問題が増える方向だとIPAが発表しています。単位の換算は、多くの計算問題の土台になります。</p>

<h3>数値の数え方（10進数・2進数・16進数）</h3>
<p>私たちの世界では「1＋1＝2」ですが、コンピュータの世界では「1＋1＝10」になります。これは数の<b>数え方（表記法）</b>が違うからです。</p>
<ul>
<li><b>10進数</b>：値が<b>10</b>になると桁が1つ上がる。ふだん使っている数え方です（0、1、…、9、10、11…）。</li>
<li><b>2進数</b>：値が<b>2</b>になると桁が上がる。0、1 の次が「10」、その次が 11、100、101…と増えます。コンピュータの中は全部2進数です。</li>
<li><b>16進数</b>：値が<b>16</b>になると桁が上がる。数字は0〜9しかないので、10〜15を <span class="mk">A〜F</span> で表します（10＝A、11＝B、…、15＝F、16＝10）。</li>
</ul>
<div class="tw"><table class="t num"><tr><th>10進数</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>8</td><td>10</td><td>15</td><td>16</td></tr>
<tr><th>2進数</th><td>0</td><td>1</td><td>10</td><td>11</td><td>100</td><td>101</td><td>1000</td><td>1010</td><td>1111</td><td>10000</td></tr>
<tr><th>16進数</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>8</td><td>A</td><td>F</td><td>10</td></tr></table></div>
<p>見た目が同じ「10」でも、10進数なら「じゅう」、2進数なら「いちぜろ」で、値はまったく違います。区別するときは (10)₂、(10)₁₀ のように右下に基数を書きます。</p>
<p><b>小数の種類</b>も確認しておきましょう。小数点より左を<b>整数部</b>、右を<b>小数部</b>といいます。</p>
<ul>
<li><b>有限小数</b>：小数部の桁数に終わりがある（0.5、0.125 など）。</li>
<li><b>無限小数</b>：小数部がどこまでも続く（円周率 3.14159… など）。</li>
<li><b>循環小数</b>：無限小数のうち、同じ数字の並びがくり返されるもの（1÷7＝0.142857142857…）。</li>
</ul>
<p>2進数や16進数にも小数があり、試験では「2進小数」「16進小数」と呼びます。</p>

<h3>基数変換と桁の重み</h3>
<p><b>基数</b>とは、桁上がりの基準になる数です。10進数の基数は10、2進数は2、16進数は16。表し方が違うだけで値そのものは同じなので、互いに変換できます。これを<b>基数変換</b>といいます。</p>
<p>変換のカギは<b>桁の重み</b>です。10進数の「7297」は、同じ7でも千の位の7は一の位の7の1000倍の大きさです。数の大きさは「各桁の数 × その桁の重み」を全部足したものです。</p>
<div class="formula">7297 ＝ 7×1000 ＋ 2×100 ＋ 9×10 ＋ 7×1 ＝ 7×10³ ＋ 2×10² ＋ 9×10¹ ＋ 7×10⁰</div>
<p>桁の重みは<b>指数</b>で書くとすっきりします。10³ は「10を3回掛けた数」。また、<span class="mk">どんな数も0乗は1</span>、マイナスの指数は「分の1」（10⁻¹＝0.1、2⁻²＝1/4）になります。</p>
<p>2進数の桁の重みは「2の何乗」です。左へ1桁進むと2倍、右へ1桁進むと半分。<b>2進数→10進数</b>は、1が立っている桁の重みを足すだけです。</p>
${FIG.place}
<div class="formula">(1001.001)₂ ＝ 8 ＋ 1 ＋ 0.125 ＝ 9.125</div>
<div class="point"><b>覚え方</b>2進数の重み「…16、8、4、2、1 . 0.5、0.25、0.125、0.0625」は丸暗記しておくと速く解けます。</div>

<h3>さまざまな基数変換</h3>
<p><b>16進数→10進数</b>：考え方は2進数と同じ。桁の重みが16のべき乗（…256、16、1 . 1/16、1/256）になるだけです。<span class="mk">A〜F は先に10〜15に直して</span>から計算します。</p>
<div class="formula">(2BD.C8)₁₆ ＝ 2×256 ＋ 11×16 ＋ 13×1 ＋ 12/16 ＋ 8/256 ＝ 701.78125</div>
<p><b>10進数→2進数</b>：整数部と小数部を分けて計算します。</p>
<ul>
<li>整数部：<b>2で割り続け</b>、商が0になったら、<b>余りを下から上へ</b>並べる。</li>
<li>小数部：<b>2を掛け続け</b>、出てきた<b>整数部（0か1）を上から順に</b>並べる。小数部が0になったら終わり。</li>
</ul>
${FIG.div2}
<p>最後に整数部と小数部を合わせます。(4.625)₁₀ なら 100 と .101 で <b>(100.101)₂</b>。</p>
<p><b>10進数→16進数</b>：同じやり方で、2の代わりに<b>16で割る／16を掛ける</b>。余りが10〜15になったら A〜F に置き換えるのを忘れないこと（701 → 2BD、0.78125 → 0.C8）。</p>
<p><b>2進数⇔16進数</b>は一番かんたん。2進数4桁がちょうど16進数1桁なので、<span class="mk">小数点から4桁ずつ区切って</span>置き換えるだけです（8進数は3桁ずつ）。</p>
${FIG.hexgroup}
<p><b>n進数</b>：試験には8進数や、9進数・11進数のような変わった基数も出ます。全部を覚えるのではなく「n進数の桁の重みは nのべき乗」という基本を押さえておけば、どんな基数にも対応できます。</p>
<div class="formula">(3725.104)₈ ＝ 3×8³ ＋ 7×8² ＋ 2×8 ＋ 5 ＋ 1×8⁻¹ ＋ 0×8⁻² ＋ 4×8⁻³ ＝ 2005.1328125</div>
<div class="point"><b>試験によく出る</b>10進小数を2進数にすると、ほとんどが<b>循環小数</b>になります（0.1 も循環小数）。同じ並びがくり返し始めたら、そこで「循環小数だ」と判断して計算を止めてOK。逆に、2進数の有限小数は10進数にすると必ず有限小数になります。</div>
<div class="point"><b>やり方を忘れたら</b>10進数の「123」を10で割り続けると、余りは 3、2、1。下から読めば 123 に戻ります。10進数どうしで試すと「割り続けて余りを下から」の手順を思い出せます。</div>

<h3>負の2進数</h3>
<p>2進数ではマイナス記号「−」は使えません。代わりに、<b>先頭の1ビットを符号ビット</b>（0なら正、1なら負）にして負の数を表します。方法は3つあります。</p>
<ul>
<li><b>絶対値表現</b>：先頭で符号を、残りのビットで値（絶対値）を表す。</li>
<li><b>1の補数表現</b>：全ビットを<b>反転</b>（0と1を入れ替え）する。</li>
<li><b>2の補数表現</b>：全ビットを反転して、<span class="mk">1を足す</span>。コンピュータで標準的に使われる方法です。</li>
</ul>
${FIG.negrep}
${FIG.twos}
<p>2の補数を使うと、引き算を「負の数の足し算」として計算できるので、回路が単純になります。nビットの2の補数で表せる範囲は <b>−2ⁿ⁻¹ 〜 2ⁿ⁻¹−1</b>（8ビットなら −128〜127）です。マイナス側が1つ多いのがポイントです。</p>
<div class="point"><b>試験によく出る</b>負の2進数から元の値を知りたいときも、同じく「反転して1を足す」。11111011 → 00000100 → 00000101 ＝ 5 なので、元は −5 です。</div>

<h3>2進数の四則演算とシフト演算</h3>
<p>2進数の<b>足し算・引き算</b>は、10進数と同じように筆算で、下の桁から計算します。違うのは「2になったら桁上がり」することだけです（1＋1＝10、1＋1＋1＝11）。</p>
<div class="formula">   0101（5）        0110（6）
 ＋ 0011（3）      − 0011（3）
 ＝ 1000（8）      ＝ 0011（3）</div>
<p><b>掛け算・割り算</b>は、10進数に直して計算してもよいのですが、<b>シフト演算</b>を使うと2進数のまま一瞬でできます。シフトは「ずらす」という意味で、ビット列を左右にずらします。</p>
${FIG.shift}
<ul>
<li><b>論理シフト</b>：符号を考えない。はみ出たビットは捨て、空いたビットに<b>0</b>を入れる。左へnビットで <b>2ⁿ倍</b>、右へnビットで <b>2ⁿ分の1</b>。</li>
<li><b>算術シフト</b>：符号ビットを固定したままずらす。左へずらしたら空きに0、<span class="mk">右へずらしたら空きに符号ビットと同じ値</span>を入れる。負の数も正しく2倍・半分にできます。</li>
</ul>
<p class="small-muted">試験のシフト演算の問題は、ほとんどが論理シフトで解けます（問題文に「正の整数」とあれば論理シフト）。算術シフトが難しければ、いったん飛ばして大丈夫です。</p>
<p>シフトで作れるのは2倍・4倍・8倍…だけなので、それ以外の倍数は<b>シフトと足し算を組み合わせ</b>ます。この形の問題はとてもよく出ます。</p>
${FIG.shiftadd}
<p><b>章のゴールの問題を解いてみましょう。</b>7÷32 は、7（2進数で 111）を 32＝2⁵ で割ること。つまり 111 を<b>右へ5ビットシフト</b>すればよく、答えは <b>0.00111</b> です。基数変換で計算しても同じ答えになります。</p>
<div class="point"><b>試験によく出る</b>「レジスタの値xを2ビット左にシフトしてxを加え、さらに1ビット左にシフトすると何倍？」→ (4x＋x)×2＝10x。式に直して1つずつ追えば必ず解けます。</div>

<h3>小数の表し方と誤差</h3>
<p class="small-muted">（この節は本の章立てにはありませんが、シラバスの範囲なので残しています）</p>
<p>コンピュータで小数を扱う方法には、小数点の位置を決めておく<b>固定小数点数</b>と、小数点の位置を動かせる<b>浮動小数点数</b>があります。浮動小数点数は「符号・指数部・仮数部」で表し、IEEE 754 の単精度は <b>符号1ビット・指数8ビット・仮数23ビット</b>（倍精度は1・11・52）です。</p>
<p>桁数に限りがあるため、計算には<b>誤差</b>が生まれます。</p>
<div class="tw"><table class="t"><tr><th>誤差</th><th>どんなときに起きるか</th></tr>
<tr><td>丸め誤差</td><td>表せる桁数を超えた部分を、四捨五入や切り捨てしたとき</td></tr>
<tr><td>桁落ち</td><td><span class="mk">ほぼ同じ大きさの数どうしの引き算</span>で、有効な桁が大きく減るとき</td></tr>
<tr><td>情報落ち</td><td>とても大きな数ととても小さな数を足し引きして、小さい方が結果に反映されないとき</td></tr>
<tr><td>打切り誤差</td><td>無限に続く計算を途中で打ち切ったとき</td></tr></table></div>

body:`
<p><b>この章のゴール</b>：論理演算と論理回路の問題を<span class="mk">ベン図を描いて</span>確実に解けること、そして毎回のように出るAIの用語を説明できること。論理回路はほぼ毎回出ますが、作業が多いだけで内容は難しくありません。</p>

<h3>集合と論理演算</h3>
<p><b>集合</b>とは、はっきり区別できる条件で分けたものの集まりで、その1つ1つを<b>要素</b>といいます。集合の関係を図にしたのが<b>ベン図</b>です。集合や論理演算の問題を見たら、<span class="mk">すぐにベン図を描く</span>のがいちばんの近道です。</p>
<p><b>論理演算</b>は、0（偽）と1（真）だけを使う計算です。コンピュータは足し算や掛け算も、論理演算を組み合わせて行っています。主な演算子は次の通りです。</p>
<div class="tw"><table class="t num"><tr><th>A</th><th>B</th><th>AND<br>（論理積）</th><th>OR<br>（論理和）</th><th>XOR<br>（排他的論理和）</th><th>NAND</th><th>NOR</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
<tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
<tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr></table></div>
<ul>
<li><b>AND</b>：両方が1のときだけ1（「かつ」）。<b>OR</b>：どちらかが1なら1（「または」）。</li>
<li><b>XOR</b>：2つが<b>違う</b>ときだけ1。<b>NOT</b>：0と1を反対にする（「ではない」）。</li>
<li><b>NAND</b>＝NOT AND、<b>NOR</b>＝NOT OR。AND・ORの答えを全部ひっくり返したものです。</li>
</ul>
<p>このような表を<b>真理値表</b>といいます。覚えるのが苦手なら、ベン図だけ覚えておけば真理値表はすぐに作れます。</p>
${FIG.venn}
<p><b>優先順位</b>：かっこ ＞ NOT ＞ AND ＞ OR。特に<span class="mk">ANDはORより先</span>に計算します。「A OR B AND C」は「A OR (B AND C)」です。</p>
<p><b>ビット操作</b>：論理演算はビット列の一部を取り出したり書き換えたりするのにも使います。これを<b>マスク</b>といい、IPアドレスの計算（ネットワークの章）でも使う大事な考え方です。</p>
${FIG.mask}
<ul>
<li>特定のビットを<b>取り出す</b>：残したい所を1にしたビット列と<b>AND</b>（例：下位4ビットなら 0F と AND）。</li>
<li>特定のビットを<b>1にする</b>：その所を1にしたビット列と<b>OR</b>。</li>
<li>全ビットを<b>反転する</b>：全部1（FF）と<b>XOR</b>。</li>
</ul>
<p><b>集合の要素の数</b>：|A∪B| ＝ |A| ＋ |B| − |A∩B|。重なった部分を二重に数えないよう引きます。例えば100人中、Aが好き60人、Bが好き50人、両方好き30人なら、どちらかが好きなのは80人です。</p>
<p class="small-muted">命題「pならばq」の<b>対偶</b>「qでないならpでない」は、元の命題と真偽が必ず一致します（逆・裏は一致するとは限りません）。</p>
<div class="point"><b>試験によく出る</b>「NANDだけでX OR Yを表した式はどれか」のような問題は、選択肢を1つずつベン図にして、X OR Y と同じ形になるものを探します。</div>

<h3>論理回路</h3>
<p><b>論理回路</b>は論理演算を行う電子回路で、CPUの中には無数の論理回路が入っています。回路を紙に書くときは<b>MIL記号</b>を使います。記号の形は試験の問題文に説明が載るので覚えなくて大丈夫ですが、<span class="mk">それぞれの演算の意味</span>は覚えておく必要があります。</p>
${FIG.gates}
<p><b>解き方の手順</b>（ほぼ毎回出ます）</p>
<ol>
<li>入力（A、B）のベン図を描く。</li>
<li>入力に一番近いゲートから順に、出力をベン図で描く。</li>
<li>その出力を次のゲートの入力にして、また描く。最後まで続ける。</li>
<li>最後のベン図と同じになる選択肢（記号・式・真理値表）を選ぶ。</li>
</ol>
<p>例えば、NANDを4つ組み合わせた回路をこの手順でたどると、最後は「AとBが違う所だけ塗られた」ベン図になり、XOR回路だと分かります。時間はかかりますが、1つずつ描けば必ず正解できます。</p>
<p>余裕がある人は<b>ド・モルガンの法則</b>も覚えておくと、ベン図を描かずに解けることがあります：NOT(A AND B)＝(NOT A) OR (NOT B)、NOT(A OR B)＝(NOT A) AND (NOT B)。</p>
<p><b>加算回路</b>：論理回路を組み合わせると、2進数の足し算ができます。</p>
<ul>
<li><b>半加算器</b>：下の桁からの桁上がりを考えない加算回路。<span class="mk">和 S ＝ X XOR Y、桁上がり C ＝ X AND Y</span>。1桁目の計算に使う。</li>
<li><b>全加算器</b>：2つの入力に加えて、<b>下の桁からの桁上がり</b>も足す（入力は3つ）。2桁目より上で使う。半加算器2つとOR回路で作れる。</li>
</ul>
${FIG.halfadder}
<div class="formula">X Y │ C S
0 0 │ 0 0
0 1 │ 0 1
1 0 │ 0 1
1 1 │ 1 0    ← 1＋1 ＝ 2進数の10</div>
<p>入力だけで出力が決まる回路を<b>組合せ回路</b>、前の状態も出力に影響する回路を<b>順序回路</b>といいます（1ビットを記憶するフリップフロップは順序回路）。回路を作る基本の部品を<b>素子</b>（論理素子、ゲート）といい、試験では「論理回路」「論理素子」「論理ゲート」は同じ意味で使われます。</p>

<h3>計算式の表し方（逆ポーランド記法）</h3>
<p>計算式の書き方には3種類あります。</p>
<ul>
<li><b>中置記法</b>：演算子を数の<b>間</b>に置く。ふだんの書き方（1 ＋ 2）。</li>
<li><b>前置記法（ポーランド記法）</b>：演算子を数の<b>前</b>に置く（＋ 1 2）。</li>
<li><b>後置記法（逆ポーランド記法）</b>：演算子を数の<b>後ろ</b>に置く（1 2 ＋）。</li>
</ul>
<p>前置・後置記法は<b>かっこが要らない</b>のが特長です。試験に出るのは<span class="mk">逆ポーランド記法だけ</span>です。</p>
<p><b>中置→逆ポーランドの変換</b>：計算する順番（かっこ ＞ 掛け算・割り算 ＞ 足し算・引き算）に、演算子を後ろへ移していきます。</p>
<div class="formula">(1 ＋ 2) × 3     →  1 2 ＋ 3 ×
Y ＝ (A − B) × C  →  Y A B − C × ＝
(A ＋ B) × (C − D) → A B ＋ C D − ×</div>
<p>逆ポーランド記法が使われるのは、コンピュータが<b>スタック</b>で順番に計算しやすいからです。</p>
${FIG.rpn}

<h3>オートマトン</h3>
<p>現実の複雑なものを、要点だけに絞ってわかりやすくすることを<b>モデル化</b>、できたものを<b>モデル</b>といいます（地球儀は地球のモデル）。モデルは試験全体でよく出る言葉です。</p>
<p><b>オートマトン</b>は、システムの働きを「<b>入力</b>」「<b>状態</b>」「<b>出力</b>」の3つで表すモデルです。例えば自動販売機なら、入力＝入れたお金、状態＝今の合計金額、出力＝出てくる商品、と考えられます。</p>
<p>状態は入力によって移り変わり（遷移し）、最後にたどり着いた状態が<b>受理状態</b>（二重丸）なら、その入力を「受け付けた」とします。状態の移り方を表にしたものが<b>状態遷移表</b>、図にしたものが<b>状態遷移図</b>です。</p>
<div class="tw"><table class="t"><tr><th>今の状態＼入力</th><th>0</th><th>1</th></tr>
<tr><td>偶（初期・受理）</td><td>偶</td><td>奇</td></tr>
<tr><td>奇</td><td>奇</td><td>偶</td></tr></table></div>
${FIG.automaton}
<p>入力 1101 なら 偶→奇→偶→偶→奇 と進み、最後が「奇」なので受理しません。</p>
<div class="point"><b>試験によく出る</b>状態遷移表（図）が示され、ある入力のあと最後にどの状態になるか、受理されるのはどの入力かが問われます。<span class="mk">指で今の状態を押さえながら、入力を1文字ずつたどる</span>だけで解けます。</div>

<h3>AI（人工知能）と機械学習</h3>
<p><b>AI（人工知能）</b>は、人間の知的な振る舞いをコンピュータで再現する技術です。画像を見分ける（顔認証、ナンバープレートの読取り）、言葉を理解する（翻訳、チャットボット）、データから予測する（売上予測）などに使われます。ここ数年、AIの用語は<span class="mk">とてもよく出題</span>されています。</p>
<p>AIの中で、<b>人間が持つ「学ぶ力」をコンピュータで再現する</b>のが<b>機械学習</b>です。学習用のデータを与えると、コンピュータ自身が規則を見つけて判断できるようになります。</p>
${FIG.mltypes}
<div class="tw"><table class="t"><tr><th>種類</th><th>与えるもの</th><th>例・手法</th></tr>
<tr><td>教師あり学習</td><td><span class="mk">入力データ＋正解データ</span>のセット</td><td>手書き数字の判別。数値を予測する<b>回帰</b>、種類を当てる<b>分類</b>（決定木、ランダムフォレスト、ロジスティック回帰）</td></tr>
<tr><td>教師なし学習</td><td>入力データだけ（正解は人にも分からない）</td><td>似た顧客をグループ分けする<b>クラスタリング</b>、次元削減</td></tr>
<tr><td>強化学習</td><td>正解の代わりに<b>報酬</b></td><td>試行錯誤して報酬が最大になる行動を学ぶ。将棋AI、ロボット制御</td></tr></table></div>
<p><b>ニューラルネットワーク</b>は、脳の神経細胞（ニューロン）が信号をやり取りする仕組みをコンピュータで再現したモデルです。ニューロンは値を受け取って処理し、次のニューロンへ渡します。渡す値を決める関数を<b>活性化関数</b>といいます。このネットワークを<b>何層にも重ねた</b>ものが<b>ディープラーニング</b>で、大量のデータから規則性を自分で見つけ、高度な認識ができます。</p>
${FIG.nn}
<p class="small-muted">画像に強い<b>CNN</b>（畳み込みニューラルネットワーク）、文章や音声など順番のあるデータを扱う<b>RNN</b>、学習で重みを調整する<b>誤差逆伝播法</b>も用語として出ます。</p>
<div class="point"><b>試験によく出る</b>3つの学習方法の違いは「何を与えるか」で見分けます。正解データ→教師あり、データだけでグループ分け→教師なし、報酬→強化学習。</div>

<h3>生成AIと基盤モデル</h3>
<ul>
<li><b>生成AI</b>：指示を受けて、学習したデータをもとに文章・画像・音声・プログラムなどの<b>オリジナルのコンテンツを作り出す</b>AI。中身にはディープラーニングが使われます。</li>
<li><b>プロンプト</b>：生成AIへの指示文。指示の出し方で結果の質が変わるので、プロンプトを工夫して最適にすることを<b>プロンプトエンジニアリング</b>といいます。</li>
<li><b>基盤モデル</b>：膨大なデータで事前に学習した、何にでも使える土台のモデル。文章を扱う大規模なものを<b>LLM（大規模言語モデル）</b>といいます。</li>
<li><b>ファインチューニング</b>：基盤モデルに、<span class="mk">特定のデータで追加の学習</span>をして、特定の用途に強くすること。ゼロから作るより効率的です（似た考え方に転移学習）。</li>
<li><b>GAN</b>（生成器と識別器を競わせる）、<b>拡散モデル</b>（ノイズから少しずつ画像を作る）、文章・画像・音声など複数の種類を扱う<b>マルチモーダルAI</b>。</li>
</ul>
<p>便利な一方で、問題点もあります。</p>
<div class="tw"><table class="t"><tr><th>用語</th><th>内容</th></tr>
<tr><td>ハルシネーション</td><td>生成AIが<span class="mk">間違った情報をもっともらしく</span>作ってしまう現象（例：合格点を「700点」と答える。正しくは科目A・Bとも600点）。学習データの不足や誤りで起きる</td></tr>
<tr><td>ディープフェイク</td><td>ディープラーニングで作った、本物と見分けがつかない偽の映像や音声</td></tr>
<tr><td>プロンプトインジェクション</td><td>悪意のある指示を入力に紛れ込ませ、AIに想定外の動作や情報漏えいをさせる攻撃</td></tr>
<tr><td>敵対的サンプル</td><td>人には分からない小さな細工で、AIに誤認識させるデータ</td></tr>
<tr><td>バイアス</td><td>学習データの偏りが、不公平な結果を生むこと</td></tr>
<tr><td>XAI（説明可能なAI）</td><td>AIの判断の理由を、人が理解できるように示す技術</td></tr>
<tr><td>HITL</td><td>AIの判断の過程に人が関わり、確認・修正すること</td></tr></table></div>
<p>国の指針に<b>人間中心のAI社会原則</b>（人間の尊厳、公平性、プライバシー保護、説明責任など）があります。</p>

<h3>AIの学習データと評価</h3>
<p class="small-muted">（シラバスVer.9で増えた範囲を補う節です）</p>
<ul>
<li>データは<b>学習用・検証用・テスト用</b>に分けて使い、テスト用は最後の評価にだけ使う。</li>
<li><b>過学習（過剰適合）</b>：学習データに合わせすぎて、<span class="mk">初めて見るデータでは当たらなくなる</span>状態。初めてのデータでも当たる力を<b>汎化性能</b>という。</li>
<li><b>交差検証</b>：データをいくつかに分け、テスト役を入れ替えながら何度も評価する。1回だけ分けるのが<b>ホールドアウト法</b>。</li>
</ul>
<div class="formula">               予測：陽性   予測：陰性
実際：陽性        TP          FN
実際：陰性        FP          TN
適合率 ＝ TP ÷ (TP ＋ FP)   陽性と予測したうち、本当に陽性だった割合
再現率 ＝ TP ÷ (TP ＋ FN)   本当の陽性のうち、見つけられた割合</div>

<h3>確率・統計とデータの活用</h3>
<p class="small-muted">（本では別の章にまたがる内容を、まとめて補う節です）</p>
<div class="formula">順列   nPr ＝ n! ÷ (n − r)!          並べ方。例 5P2 ＝ 5×4 ＝ 20
組合せ nCr ＝ n! ÷ (r! × (n − r)!)  選び方。例 5C2 ＝ 20 ÷ 2 ＝ 10
期待値 ＝ Σ（値 × その値になる確率）</div>
<ul>
<li>代表値：<b>平均・中央値・最頻値</b>。ばらつき：<b>分散・標準偏差</b>。正規分布では平均±1σに約68%、±2σに約95%が入る。</li>
<li><b>相関係数</b>は −1〜1。<span class="mk">相関があっても因果関係があるとは限らない</span>（第3の要因による<b>擬似相関</b>）。</li>
<li><b>仮説検定</b>：帰無仮説を立て、p値が有意水準（例：5%）より小さければ棄却する。正しい帰無仮説を棄却するのが<b>第1種の誤り</b>、誤った帰無仮説を棄却しないのが<b>第2種の誤り</b>。</li>
<li><b>情報量</b>：確率 p で起こることの情報量は −log₂p ビット。<b>ハフマン符号</b>はよく出る文字に短い符号を割り当てる。</li>
<li>データの活用：表形式の<b>構造化データ</b>と、文章・画像などの<b>非構造化データ</b>。加工前のデータを貯める<b>データレイク</b>、整理して時系列に貯める<b>データウェアハウス</b>。誤りや重複を取り除く<b>データクレンジング</b>、規則性を見つける<b>データマイニング</b>。</li>
</ul>
`,

body:`
<p><b>この章のゴール</b>：データ構造とアルゴリズムの基本を押さえ、流れ図やプログラムを<span class="mk">トレース表でたどって</span>答えを出せること。科目Bの20問中16問はこの分野なので、試験全体でいちばん大事な章です。</p>

<h3>データ構造</h3>
<p>コンピュータは、主記憶装置に置くデータの<b>並べ方</b>を工夫することで、処理を速くしたり、処理の途中で迷子にならないようにしたりしています。この並べ方を<b>データ構造</b>といいます。試験では、それぞれの構造の<b>名前と特徴</b>が問われます。</p>
<ul>
<li><b>スタック</b>（いちばんよく出る）：最後に入れたデータを最初に取り出す。積み上げた本と同じで、上からしか取れない。入れるのが <b>push</b>、取り出すのが <b>pop</b>。<span class="mk">後入れ先出し（LIFO）</span>。処理の履歴を積んでおけば、1つずつ戻って元の処理に帰れる（関数の呼出し、逆ポーランド記法の計算）。</li>
<li><b>キュー</b>（待ち行列）：最初に入れたデータを最初に取り出す。レジ待ちの列と同じ。<span class="mk">先入れ先出し（FIFO）</span>。入力した順番どおりに処理できる。</li>
<li><b>配列</b>：同じ型のデータを連続して並べ、<b>要素番号</b>で直接読み書きできる。<b>参照・更新が速い</b>が、途中への挿入・削除は後ろのデータをずらす必要があって遅い。</li>
<li><b>連結リスト</b>：データと<b>ポインタ</b>（次のデータの場所）の組をつないだもの。<b>挿入・削除が速い</b>（ポインタを付け替えるだけ）が、目的のデータまで先頭から順にたどる必要がある。</li>
</ul>
${FIG.stackq}
${FIG.listins}
<p>連結リストには種類があり、試験では「単方向リスト」などの名前で出てきます。</p>
<div class="tw"><table class="t"><tr><th>種類</th><th>特徴</th></tr>
<tr><td>単方向リスト</td><td>先頭から末尾へ、一方向にだけたどれる</td></tr>
<tr><td>双方向リスト</td><td>前後両方へのポインタを持ち、どちら向きにもたどれる</td></tr>
<tr><td>環状（循環）リスト</td><td>末尾が先頭につながっている</td></tr></table></div>
<p><b>木構造</b>：データを親子関係でつないだ構造。いちばん上を<b>根</b>、下の端を<b>葉</b>、各データを<b>節（ノード）</b>といいます。子を最大2つまで持つのが<b>2分木</b>です。</p>
${FIG.btree}
<ul>
<li><b>2分探索木</b>：<span class="mk">左の子孫 ＜ 親 ＜ 右の子孫</span>。子だけでなく、その下の子孫全部がこの関係になる。</li>
<li><b>ヒープ</b>：親が子より常に大きい（または小さい）2分木。最大値・最小値をすぐ取り出せる。</li>
<li><b>完全2分木</b>：葉以外のすべての節が子を2つ持ち、葉の深さがそろっている（または最下段が左から詰まっている）木。</li>
<li><b>走査</b>（すべての節をたどる順番）：<b>先行順</b>（親→左→右）、<b>間順</b>（左→親→右）、<b>後行順</b>（左→右→親）。</li>
<li><b>平衡木</b>（AVL木、B木）：左右の高さの差が大きくならないよう保つ木。B木はデータベースの索引に使われる。</li>
<li><b>グラフ</b>：頂点と辺で関係を表す。辺に距離があるとき、最短経路を求めるのが<b>ダイクストラ法</b>。</li>
</ul>
<div class="point"><b>試験によく出る</b>「A、B、C、D の順に届くデータを、1つのスタックだけで出力したとき、作れない順番はどれか」。push と pop を紙に書いて1つずつ試せば必ず解けます。配列と連結リストの違い（参照・更新が速い／挿入・削除が速い）もよく出ます。</div>

<h3>アルゴリズムの基本（流れ図とトレース表）</h3>
<p><b>アルゴリズム</b>とは、問題を解くための手順のことです。同じアルゴリズムでも、次の4つの方法で表せます。例として「数値を絶対値に変換する」アルゴリズムを見てみましょう。</p>
<ol>
<li><b>文章</b>：「x が0より小さければ −x を返す。そうでなければ x を返す」。特別な知識がなくても読める。</li>
<li><b>流れ図（フローチャート）</b>：記号と矢印で処理の流れを図にしたもの。試験の科目Aでは<span class="mk">流れ図がいちばんよく出ます</span>。</li>
<li><b>数式</b>：f(x) ＝ −x（x＜0 のとき）、x（x≧0 のとき）。f は関数（function）を表す。</li>
<li><b>プログラム言語</b>：f(x)：if x ＜ 0 then return −x else return x。</li>
</ol>
${FIG.flowsym}
<p><b>関数</b>は、いくつかの処理をひとまとめにして名前を付けたものです。一度作れば何度でも呼び出して使えます。関数に渡す値を<b>引数</b>、関数が返す結果を<b>戻り値</b>といいます（−3 を渡すと 3 が返る）。</p>
<p>プログラムが1行で書かれていて読みにくくても、<b>if（もし）・then（ならば）・else（そうでなければ）・return（値を返す）</b>の4つの言葉に分けて読めば大丈夫です。特定の言語（CやJava）の書き方は問われません。</p>
<p><b>トレース表</b>は、流れ図やプログラムを1つずつ実行しながら、<span class="mk">変数の値の変化を書き出した表</span>です。これを使うと処理の流れを確実に追えます。</p>
<pre class="code">整数型: x ← 1
整数型: i
for (i を 1 から 4 まで 1 ずつ増やす)
  x ← x × 2 ＋ i
endfor</pre>
<div class="tw"><table class="t num"><tr><th>i</th><th>x × 2</th><th>＋ i</th><th>新しい x</th></tr>
<tr><td>1</td><td>2</td><td>＋1</td><td>3</td></tr>
<tr><td>2</td><td>6</td><td>＋2</td><td>8</td></tr>
<tr><td>3</td><td>16</td><td>＋3</td><td>19</td></tr>
<tr><td>4</td><td>38</td><td>＋4</td><td><b>42</b></td></tr></table></div>
<div class="point"><b>試験によく出る</b>「1から100までの総和を求める流れ図に誤りがある。どう直せばよいか」のような問題は、ループの<b>最初の1周・2周目・最後の1周</b>をトレースすると、初期値や終了条件のずれが見つかります。</div>

<h3>アルゴリズムの分類（整列・探索・再帰）</h3>
<p>試験に出るアルゴリズムは、データを並べる<b>整列</b>、データを見つける<b>探索</b>、自分自身を呼び出す<b>再帰</b>の3種類です。</p>
<p><b>整列（ソート）</b>：データを小さい順（昇順）や大きい順（降順）に並べます。</p>
<div class="tw"><table class="t"><tr><th>方法</th><th>考え方</th><th>計算量（平均／最悪）</th></tr>
<tr><td>バブルソート</td><td>隣どうしを比べて、順番が逆なら入れ替える。これをくり返す</td><td>O(n²)／O(n²)</td></tr>
<tr><td>選択ソート</td><td>残りの中の最小値を探し、先頭と入れ替える</td><td>O(n²)／O(n²)</td></tr>
<tr><td>挿入ソート</td><td>並べ終わった部分の正しい位置に、次のデータを差し込む</td><td>O(n²)／O(n²)</td></tr>
<tr><td><b>クイックソート</b></td><td><span class="mk">基準値より小さいグループと大きいグループに分ける</span>ことをくり返す</td><td>O(n log n)／O(n²)</td></tr>
<tr><td>マージソート</td><td>細かく分けてから、並べながら合わせていく</td><td>O(n log n)／O(n log n)</td></tr>
<tr><td>ヒープソート</td><td>ヒープを作り、最大値を順に取り出す</td><td>O(n log n)／O(n log n)</td></tr></table></div>
${FIG.quick}
<p>試験の整列の問題は<b>クイックソート</b>がほとんどです。最も速い整列方法として知られているからです。</p>
<p><b>探索</b>：目的のデータを見つけます。</p>
<ul>
<li><b>線形探索</b>：先頭から1つずつ比べる。平均 n/2 回。末尾に探す値を置いて終了判定を減らす工夫を<b>番兵</b>という。</li>
<li><b>ハッシュ法</b>：<b>ハッシュ関数</b>（例：10で割った余り）で計算した値（ハッシュ値）を要素番号にして、データを入れる・探す。<span class="mk">1回で見つかる</span>のが長所。違うデータが同じハッシュ値になる<b>衝突</b>（シノニム）が起こりうるのが短所。</li>
<li><b>2分探索法</b>：調べる範囲の真ん中と比べ、半分ずつ絞り込む。<span class="mk">あらかじめ整列しておく必要がある</span>。真ん中の要素番号は（先頭＋末尾）÷2。</li>
</ul>
${FIG.hash}
${FIG.bsearch}
<p><b>再帰</b>：処理の途中で自分自身を呼び出すこと（再帰呼び出し）。試験では主に<b>総和</b>（Σ、全部足す）、<b>剰余</b>（mod、割り算の余り）、<b>階乗</b>（!、5! ＝ 5×4×3×2×1）を求める問題で出ます。必ず<b>終わりの条件</b>を持ちます。</p>
<pre class="code">○整数型: sum(整数型: x)
  if (x ≦ 1)
    return 1
  endif
  return x ＋ sum(x − 1)</pre>
<p>sum(5) → 5＋sum(4) → 5＋4＋sum(3) → … → 5＋4＋3＋2＋1 ＝ 15。</p>
${FIG.recur}
<div class="point"><b>試験によく出る</b>再帰の問題は、実際に小さな値（3や4）を入れて、呼び出しを1段ずつ書き出すのがいちばん確実です。</div>

<h3>計算量（オーダ記法）</h3>
<p>同じ結果が出るなら、時間が短く、メモリの使用量が少ないアルゴリズムの方が優秀です。データの数 n が増えたとき、計算量がどのくらい増えるかを表すのが<b>オーダ記法</b> O(…) です。オーダは「最大でもこれ以上にはならない」という上限を表します。</p>
<div class="formula">O(1)      … データ量に関係なく1回（ハッシュ法）
O(log n)  … 2分探索法。n＝8 なら log₂8 ＝ 3回で済む
O(n)      … データが2倍なら時間も2倍（線形探索）
O(n log n)… クイックソート（平均）、マージソート
O(n²)     … データが2倍なら時間は4倍、10倍なら100倍（バブルソート）</div>
${FIG.bigO}
<p><b>log（対数）</b>は「2を何回掛けるとその数になるか」です。2³＝8 なので log₂8＝3。2分探索法は、データが8個なら最大3回、1024個でも最大10回の比較で見つかります。</p>

<h3>プログラムの性質とJava</h3>
<p>プログラムの性質は4つあり、特に<b>再帰</b>と<b>再入可能</b>の2つがよく出ます。カタカナの名前でも出題されます。</p>
<div class="tw"><table class="t"><tr><th>性質</th><th>意味</th></tr>
<tr><td>再帰（リカーシブ）</td><td>実行中に<span class="mk">自分自身を呼び出せる</span></td></tr>
<tr><td>再入可能（リエントラント）</td><td><span class="mk">複数のプログラムから同時に呼ばれても</span>正しく動く</td></tr>
<tr><td>再配置可能（リロケータブル）</td><td>主記憶のどこに置いても実行できる</td></tr>
<tr><td>再使用可能（リユーザブル）</td><td>一度主記憶に読み込めば、読み直さずに何度でも実行できる</td></tr></table></div>
${FIG.reentrant}
<p><b>Java</b>は今もよく使われる言語で、名前に「Java」が付く似た用語が試験によく出ます。</p>
<ul>
<li><b>Javaアプレット</b>：サーバからダウンロードして、<span class="mk">利用者側（クライアント）のブラウザで</span>動くプログラム。</li>
<li><b>Javaサーブレット</b>：<span class="mk">サーバ側で</span>動き、利用者に合わせてWebページを作るプログラム。</li>
<li><b>JavaBeans</b>：よく使う部品を再利用できるようにまとめる（コンポーネント化する）仕組み。</li>
<li><b>JavaScript</b>：名前は似ているが、Javaとはまったく別の言語。Webページに動きを付けるのに使う。</li>
</ul>
<p>そのほかの言語：C（OSや組込み機器）、Python（AI・データ分析）、R（統計解析）。</p>

<h3>マークアップ言語とデータ形式</h3>
<p>計算問題がなく、出題のされ方も決まっているので、<span class="mk">確実に点が取れる</span>ところです。</p>
<ul>
<li><b>HTML</b>：Webページを作る<b>マークアップ言語</b>。&lt;title&gt;…&lt;/title&gt; のような<b>タグ</b>で、文書の構造（どれがタイトルで、どれが本文か）を指定する。<span class="mk">タグの使い方は決まっている</span>。</li>
<li><b>XML</b>：<span class="mk">利用者が自由にタグを決められる</span>マークアップ言語（Extensible＝拡張できる）。Web上でのデータのやり取りに使う。人にもコンピュータにも読みやすい。</li>
<li><b>CSS</b>：文字の大きさ・色・行間などの<b>見た目（デザイン）</b>を指定する。HTMLで中身と構造を、CSSで見た目を決める。</li>
<li><b>Ajax</b>：ページ全体を読み直さずに、JavaScriptでサーバと<b>非同期</b>に通信して、ページの一部だけを書き換える仕組み（地図をスクロールすると続きが表示されるなど）。</li>
<li><b>JSON</b>：{"名前": "佐藤", "年齢": 20} のように、名前と値の組でデータを表す軽い形式。Web APIでよく使う。</li>
</ul>
<p class="small-muted">HTMLとXMLは、どちらも SGML という言語をもとに作られました。</p>

<h3>科目Bの擬似言語の読み方</h3>
<p>科目Bでは、IPA独自の<b>擬似言語</b>でプログラムが書かれます。記法に慣れることが合格への近道です（記法の説明は試験問題の冒頭にも載っています）。</p>
<div class="tw"><table class="t"><tr><th>記述</th><th>意味</th></tr>
<tr><td class="mono">○整数型: f(整数型: n)</td><td>関数の宣言（戻り値が整数型）。○手続名(…) は手続</td></tr>
<tr><td class="mono">整数型: x</td><td>変数の宣言。整数型の配列: a、文字列型、実数型、論理型 など</td></tr>
<tr><td class="mono">x ← 式</td><td>代入</td></tr>
<tr><td class="mono">if (条件) … elseif (条件) … else … endif</td><td>選択処理</td></tr>
<tr><td class="mono">while (条件) … endwhile</td><td>前判定の繰返し（最初に条件を調べる）</td></tr>
<tr><td class="mono">do … while (条件)</td><td>後判定の繰返し（最低1回は実行）</td></tr>
<tr><td class="mono">for (i を 1 から n まで 1 ずつ増やす) … endfor</td><td>回数を決めた繰返し</td></tr>
<tr><td class="mono">mod ／ and ／ or ／ not</td><td>剰余／論理積／論理和／否定</td></tr>
<tr><td class="mono">{1, 2, 3}</td><td>配列の内容。<span class="mk">要素番号は「1から始まる」と指定されることが多い</span></td></tr>
<tr><td class="mono">未定義</td><td>値が入っていない状態</td></tr></table></div>
<div class="point"><b>科目Bのコツ</b>トレース表を必ず紙に書く。空欄補充の問題は、選択肢を1つずつ当てはめて最初の数周をトレースすると、正解以外が消えていきます。過去問ページの科目B公開問題で練習しましょう。</div>
`,
terms:[["スタック", "後入れ先出し（LIFO）のデータ構造"], ["キュー", "先入れ先出し（FIFO）のデータ構造"], ["連結リスト", "データとポインタの組をつないだ構造。挿入・削除が速い"], ["2分探索木", "左の子＜親＜右の子。間順でたどると昇順"], ["間順（中間順）", "左の子→親→右の子の順にたどる2分木の走査"], ["ヒープ", "親が子より常に大きい（小さい）2分木。最大値・最小値をすぐ取り出せる"], ["ダイクストラ法", "重み付きグラフで最短経路を求めるアルゴリズム"], ["トレース表", "プログラムを1つずつ実行し、変数の値の変化を書き出した表"], ["引数", "関数に渡す値"], ["戻り値", "関数が処理の結果として返す値"], ["クイックソート", "基準値で分割して再帰的に整列。平均O(n log n)、最悪O(n²)"], ["マージソート", "分割した列を整列しながら併合する。常にO(n log n)"], ["2分探索", "整列済みデータを半分ずつ絞り込む探索。O(log n)"], ["ハッシュの衝突", "異なるキーが同じ格納位置になること（シノニム）"], ["番兵", "探索値を末尾に置いて終了判定を減らす工夫"], ["O(n²)", "データ量が10倍になると処理時間が100倍になる計算量"], ["再入可能（リエントラント）", "複数のプログラムから同時に呼び出されても正しく動く性質"], ["再帰（リカーシブ）", "実行中に自分自身を呼び出せる性質"], ["Javaサーブレット", "サーバ側で動き、Webページを動的に作るJavaのプログラム"], ["Javaアプレット", "サーバからダウンロードし、クライアントのブラウザで動くJavaのプログラム"], ["XML", "利用者が自由にタグを定義できるマークアップ言語"], ["CSS", "Webページの文字の大きさや色などの見た目を指定する言語"], ["Ajax", "ページ全体を読み直さず、非同期通信で一部だけ書き換える仕組み"], ["JSON", "名前と値の組でデータを表す軽量なデータ形式"]]},
{ id:"hw", field:"tech", title:"コンピュータの構成要素", sub:"CPUの性能・CPUが処理する流れ・キャッシュメモリ・入出力インタフェース",
body:`
<p><b>この章のゴール</b>：CPUとメモリの仕組みを理解し、<span class="mk">MIPS・実効アクセス時間・ヒット率</span>の計算問題を確実に取ること。CPUとメモリはとてもよく出る分野です。</p>

<h3>CPU（プロセッサ）の性能</h3>
<p><b>CPU（中央処理装置）</b>は、コンピュータの中心で命令を処理する、人間でいう脳にあたる装置です。試験では「プロセッサ」とも書かれます。CPUの中は、命令を解読して各装置に指示する<b>制御装置</b>と、計算をする<b>演算装置</b>でできています。性能は主に次の3つで比べます。</p>
<p><b>① クロック周波数</b>：コンピュータの中には、一定のテンポで信号を出す<b>発振器</b>（メトロノームのようなもの）があり、CPUはそのテンポに合わせて命令を処理します。1秒間に刻む回数が<b>クロック周波数</b>（単位 Hz）で、<span class="mk">大きいほど速い</span>CPUです。命令によって必要なクロック数は違い、1命令あたりの平均クロック数を<b>CPI</b>といいます。</p>
${FIG.clock}
<div class="formula">1秒間に実行できる命令数 ＝ クロック周波数 ÷ 1命令に必要なクロック数
例：2.5GHz（25億クロック）で1命令2クロック → 12.5億命令／秒
例：1GHz で1命令0.8クロック → 10億 ÷ 0.8 ＝ 12.5億命令／秒（＝125,000万命令）</div>
<p><b>② MIPS</b>：1秒間に何百万個の命令を実行できるか。2MIPS なら1秒に200万命令です。</p>
<div class="formula">MIPS ＝ 1 ÷ 平均命令実行時間（秒）× 10⁻⁶
例：平均命令実行時間が20ナノ秒 → 1 ÷ (20×10⁻⁹) ＝ 5×10⁷ 命令 → 50MIPS
逆に：2MIPS の平均命令実行時間 ＝ 1 ÷ (2×10⁶) ＝ 0.5マイクロ秒 ＝ 500ナノ秒</div>
<p><b>③ コア</b>：CPUの中で実際に演算をする部分。1つのCPUに複数のコアを持つものを<b>マルチコアプロセッサ</b>（2つならデュアルコア、4つならクアッドコア）といい、コアごとに別の処理を同時に進められます。</p>
<div class="point"><b>試験によく出る</b>MIPSは「求める問題」と「MIPSから平均命令実行時間を求める問題」の両方が出ます。単位（ナノ＝10⁻⁹、マイクロ＝10⁻⁶）をそろえるのがコツです。</div>

<h3>CPUが命令を処理する流れ</h3>
<p><b>主記憶装置</b>は、命令やデータを入れておく装置です。中は細かく区切られていて、それぞれに<b>アドレス（番地）</b>が付いています。CPUはアドレスを指定して、命令やデータを取り出します。主記憶から読み込まれる<b>命令</b>は、「何をするか」を書いた<b>命令部</b>と、「どのデータを使うか（番地）」を書いた<b>アドレス部</b>でできています。</p>
<p>取り出した命令やデータは、CPUの中の小さな記憶場所<b>レジスタ</b>に入れて使います。名前と役割が試験に出ます。</p>
<div class="tw"><table class="t"><tr><th>レジスタ</th><th>入れるもの</th></tr>
<tr><td>プログラムカウンタ（プログラムレジスタ）</td><td><span class="mk">次に実行する命令のアドレス</span></td></tr>
<tr><td>命令レジスタ</td><td>取り出した命令</td></tr>
<tr><td>汎用レジスタ</td><td>計算に使うデータや結果</td></tr>
<tr><td>アキュムレータ</td><td>演算の結果（汎用レジスタで代用することもある）</td></tr></table></div>
${FIG.cpuflow}
<ol>
<li>CPUは<b>プログラムカウンタ</b>の番地を見て、主記憶へ命令を取りに行く。プログラムカウンタは自動で次の番地に進む。</li>
<li>取り出した命令を<b>命令レジスタ</b>に入れる。主記憶から命令を取り出して命令レジスタに入れることを<b>フェッチ</b>という。</li>
<li><b>命令デコーダ</b>（命令解読器）が命令を解読する。</li>
<li>「4番地のデータを取り出せ」なら、主記憶の4番地のデータを<b>汎用レジスタ</b>に入れ、計算を実行する。</li>
</ol>
<p><b>アドレス指定方式</b>：命令のアドレス部から、実際のデータがある番地（<b>有効アドレス</b>）をどう求めるかの決まりです。試験で内容まで問われるのは主に直接と間接です。</p>
${FIG.addr}
<div class="tw"><table class="t"><tr><th>方式</th><th>有効アドレスの求め方</th></tr>
<tr><td>直接</td><td>アドレス部の値が、そのままデータの番地</td></tr>
<tr><td>間接</td><td>アドレス部が指す番地に書かれている値が、データの番地</td></tr>
<tr><td>即値</td><td>アドレス部に<b>データそのもの</b>が入っている</td></tr>
<tr><td>インデックス</td><td>アドレス部 ＋ インデックスレジスタの値</td></tr>
<tr><td>ベースレジスタ</td><td>アドレス部 ＋ ベースレジスタの値</td></tr>
<tr><td>相対</td><td>アドレス部 ＋ プログラムカウンタの値</td></tr></table></div>
<p><b>割込み</b>：実行中のプログラムを中断して、別の処理に切り替えることです。優先度の高い処理を先に行ったり、エラーに対応したりするために使います。割込みが起きると、CPUは<span class="mk">プログラムカウンタの値を別の場所に退避</span>し、割込み処理が終わったら元に戻して続きを再開します。</p>
${FIG.interrupt}
<div class="tw"><table class="t"><tr><th>種類</th><th>原因</th><th>例</th></tr>
<tr><td>内部割込み</td><td><span class="mk">実行中のプログラムが原因</span></td><td>ゼロで割った（ゼロ除算）、オーバーフロー、存在しないページへのアクセス（ページフォールト）、スーパバイザコール</td></tr>
<tr><td>外部割込み</td><td>プログラムの外が原因</td><td>入出力の完了、インターバルタイマ（一定時間ごとにCPUを切り替える）、電源の異常、メモリのパリティエラー</td></tr></table></div>
<div class="point"><b>試験によく出る</b>割込みの例が示されて「内部か外部か」を問う問題。見分け方は<b>原因が実行中のプログラムかどうか</b>。内部割込みの代表はゼロ除算です。</div>

<h3>CPUの高速化</h3>
<p class="small-muted">（本ではCPUの節で触れる程度ですが、選択肢によく出る用語をまとめています）</p>
<ul>
<li><b>パイプライン</b>：命令の段階（取出し・解読・実行・書込み）を流れ作業のように重ねて実行する。</li>
<li><b>パイプラインハザード</b>：流れが乱れること。分岐で次の命令が決まらない、前の命令の結果を待つなど。分岐先を予想する<b>分岐予測</b>、予想して先に実行する<b>投機実行</b>で対策する。</li>
<li><b>スーパースカラ</b>：パイプラインを複数持ち、同時に複数の命令を実行する。</li>
<li><b>CISC</b>：複雑で多機能な命令を持つ。<b>RISC</b>：命令を単純・固定長にして、パイプラインを効率よく回す。</li>
<li><b>GPU</b>：たくさんの小さな演算器で同じ計算を並列に行う。画像処理やAIの学習に使う。</li>
</ul>
${FIG.pipeline}

<h3>記憶装置とキャッシュメモリ</h3>
<p>コンピュータの記憶装置は、大きく3つに分けられます。</p>
<ul>
<li><b>主記憶装置</b>（メインメモリ）：CPUが直接読み書きする。高速だが、<span class="mk">電源を切ると内容が消える</span>。CPUが一度に処理できない量の命令も、ここに置いて順に取り出すので最後まで実行できる。</li>
<li><b>補助記憶装置</b>：HDD・SSDなど。データを長く保存する。OSやアプリもここにある。</li>
<li><b>キャッシュメモリ</b>：<span class="mk">CPUと主記憶の間</span>にある超高速の記憶装置。主記憶はCPUにとっては遅すぎるので、よく使うデータをキャッシュに置いて待ち時間を短くする。</li>
</ul>
${FIG.mem}
<p>CPUの中の1次キャッシュ、外側の2次キャッシュのように階層になっていることもあります。</p>
<p><b>ヒット率</b>：キャッシュは高価なSRAMで作るので容量が小さく、必要なデータがキャッシュにないこともあります。必要なデータが<span class="mk">キャッシュにある確率がヒット率</span>、ない確率は（1 − ヒット率）です。</p>
<div class="formula">実効アクセス時間 ＝ キャッシュのアクセス時間 × ヒット率
                 ＋ 主記憶のアクセス時間 × (1 − ヒット率)</div>
${FIG.eat}
<p>逆にヒット率を求める問題も出ます。主記憶60ナノ秒、キャッシュ10ナノ秒、実効アクセス時間15ナノ秒なら、15 ＝ 10h ＋ 60(1 − h) を解いて h ＝ 0.9（90%）。</p>
<p><b>書込みの方式</b>：書き込み先がキャッシュと主記憶の2つあるので、2つの方式があります。</p>
${FIG.writepol}
<ul>
<li><b>ライトスルー方式</b>：キャッシュと主記憶の<b>両方に同時に</b>書く。仕組みが単純で、内容が食い違わない。</li>
<li><b>ライトバック方式</b>：普段は<b>キャッシュにだけ</b>書き、そのデータをキャッシュから追い出すときに主記憶へ書く。遅い主記憶への書込み回数が減るので速い。</li>
</ul>
<p><b>メモリインタリーブ</b>：主記憶を<b>バンク</b>という単位に分け、<span class="mk">複数のバンクに並列にアクセス</span>して速くする。</p>
<p class="small-muted">キャッシュの割当て方式：場所が1か所に決まっている<b>ダイレクトマップ</b>、どこにでも入れられる<b>フルアソシアティブ</b>、その中間の<b>セットアソシアティブ</b>。</p>
<p><b>補助記憶装置</b></p>
<ul>
<li><b>HDD</b>：回転する円盤に磁気で記録。アクセス時間 ＝ 平均シーク時間（ヘッドの移動）＋ 平均回転待ち時間 ＋ データ転送時間。<span class="mk">平均回転待ち時間は1回転の時間の半分</span>（6,000回転/分なら1回転10ミリ秒、待ちは5ミリ秒）。</li>
<li><b>SSD</b>：フラッシュメモリを使う。動く部品がないので速く静かで衝撃に強い。書換え回数に上限があるので、書込みを全体に分散させる<b>ウェアレベリング</b>を行う。</li>
</ul>
<div class="point"><b>試験によく出る</b>キャッシュメモリの目的（CPUと主記憶の速度差を埋める）、ヒット率と実効アクセス時間の計算、ライトスルーとライトバックの違い、メモリインタリーブ。この4つはほぼ毎回どれかが出ます。</div>

<h3>入出力インタフェース</h3>
<p><b>入出力インタフェース</b>は、機器と機器をつなぐときのケーブルの差込口の形や、データのやり取りの決まりです（PCとマウスをつなぐUSB、ディスプレイをつなぐHDMIなど）。有線と無線があり、有線のデータの送り方は2種類です。</p>
${FIG.serial}
<div class="tw"><table class="t"><tr><th>規格</th><th>特徴</th></tr>
<tr><td>USB</td><td>いちばん普及しているシリアルインタフェース。ハブを使って最大127台。ケーブルで電力も送れる（<b>バスパワー</b>）。USB 2.0（480Mbps）→ USB 3.0（5Gbps）と高速化している</td></tr>
<tr><td>HDMI</td><td>映像と音声をデジタルで1本のケーブルで送る</td></tr>
<tr><td>Thunderbolt</td><td>高速で、<b>デイジーチェーン</b>（数珠つなぎ）で接続できる</td></tr>
<tr><td>Bluetooth</td><td>近くの機器と無線でつなぐ（マウス、イヤホン）</td></tr>
<tr><td>NFC</td><td>10cmほどの近い距離で通信する（ICカード、スマホ決済）</td></tr>
<tr><td>IrDA</td><td>赤外線で通信する</td></tr></table></div>
${FIG.connect}
<ul>
<li><b>デバイスドライバ</b>：つないだ周辺機器を動かすためのソフトウェア。</li>
<li><b>プラグアンドプレイ</b>：機器をつなぐだけで、OSが自動でドライバを設定して使えるようにする仕組み。</li>
<li><b>DMA</b>：CPUを通さずに、入出力装置と主記憶の間で直接データを転送する。</li>
</ul>

<h3>入出力装置</h3>
<p><b>入力装置</b>はコンピュータにデータを入れる装置（キーボード、マウス、タッチパネル、スキャナ、カメラ、マイク）、<b>出力装置</b>は結果を表す装置（ディスプレイ、プリンタ、スピーカ）です。</p>
<ul>
<li><b>dpi</b>：1インチあたりのドット（点）の数。プリンタやスキャナの細かさを表し、大きいほどきれい。</li>
<li><b>ポイント</b>：文字の大きさの単位。1ポイントは約1/72インチ。</li>
<li><b>3Dプリンタ</b>：3次元のデータをもとに、立体物を造形する装置。</li>
<li>ディスプレイ：液晶、<b>有機EL</b>（自分で光るので薄く、黒がきれい）。</li>
</ul>
<div class="point"><b>計算の例</b>600dpiで、横8インチ×縦10インチの写真を読み取ると、点の数は (600×8) × (600×10) ＝ 4,800 × 6,000 ＝ 2,880万個。1点が24ビット（3バイト）なら 約86Mバイトになります。</div>
`,
terms:[["クロック周波数", "CPUが1秒間に刻むクロックの回数。単位はHz。大きいほど速い"], ["CPI", "1命令の実行に要する平均クロック数"], ["MIPS", "1秒間に実行できる命令数（百万単位）"], ["マルチコアプロセッサ", "1つのCPUに複数のコア（演算装置）を持つプロセッサ"], ["プログラムカウンタ", "次に実行する命令のアドレスを保持するレジスタ"], ["フェッチ", "主記憶から命令を取り出して命令レジスタに入れること"], ["間接アドレス指定", "アドレス部が指す番地に書かれた値を有効アドレスとする方式"], ["インデックスアドレス指定", "アドレス部にインデックスレジスタの値を加えて実効アドレスを求める"], ["内部割込み", "ゼロ除算など、実行中のプログラムが原因で起こる割込み"], ["パイプライン", "命令の各段階を重ねて並行実行する高速化技術"], ["分岐予測", "分岐先を予想してパイプラインの乱れを減らす技術"], ["RISC", "単純で固定長の命令を高速に実行するCPUの設計方式"], ["ヒット率", "必要なデータがキャッシュメモリにある確率"], ["実効アクセス時間", "キャッシュ時間×ヒット率＋主記憶時間×(1−ヒット率)"], ["ライトスルー", "キャッシュと主記憶の両方に同時に書き込む方式"], ["ライトバック", "キャッシュにだけ書き込み、追い出し時に主記憶へ反映"], ["メモリインタリーブ", "主記憶を複数のバンクに分け、並列にアクセスして高速化する"], ["平均回転待ち時間", "ディスクが1回転する時間の半分"], ["ウェアレベリング", "フラッシュメモリの書込みを分散させて寿命を延ばす技術"], ["デイジーチェーン", "周辺機器を数珠つなぎに接続する方法"], ["デバイスドライバ", "接続した周辺機器を制御するためのソフトウェア"], ["プラグアンドプレイ", "機器を接続するだけでOSが自動で設定し使えるようにする仕組み"], ["DMA", "CPUを介さずに装置と主記憶の間で転送する方式"], ["dpi", "1インチあたりのドット数。印刷や読取りの細かさを表す"]]},
{ id:"sys", field:"tech", title:"システムの構成要素", sub:"Webシステム・デュプレックスとデュアル・RAID・性能指標・稼働率",
body:`
<p><b>この章のゴール</b>：システムの構成の違い（デュプレックスとデュアルなど）を見分け、<span class="mk">稼働率の計算</span>（いちばんよく出る）を確実に解けること。</p>

<h3>処理の仕方によるシステムの分類</h3>
<p><b>システム</b>は、手作業で行っていた仕事をコンピュータで自動化する仕組みです。サービスを利用する側を<b>クライアント</b>、提供する側を<b>サーバ</b>といいます。</p>
<ul>
<li><b>集中処理</b>：1台の大型コンピュータ（ホストコンピュータ）に端末をつなぎ、すべての処理をそこで行う。管理しやすいが、止まると全部止まる。</li>
<li><b>分散処理</b>：ネットワークでつないだ複数のコンピュータで処理を分担する。試験で問われるのは主にこちら。</li>
</ul>
<p>分散処理システムには、主に3つの形があります。</p>
<ul>
<li><b>クライアントサーバシステム</b>：クライアントが処理を頼み、サーバが処理する。クライアントには専用のソフトを入れておく必要がある。</li>
<li><b>3層クライアントサーバシステム</b>：役割を3つの層に分ける。画面を担当する<b>プレゼンテーション層</b>、処理を担当する<b>ファンクション層</b>（アプリケーションサーバ）、データを担当する<b>データ層</b>（データベースサーバ）。</li>
<li><b>Webシステム</b>（いちばんよく出る）：インターネットと<b>Webブラウザ</b>を使うシステムで、3層クライアントサーバシステムの一種。</li>
</ul>
${FIG.websys}
<p>Webシステムは、クライアントに<span class="mk">専用のソフトを入れなくてよい</span>のが大きな長所です。使い慣れたブラウザが使え、システムが変わってもクライアントのソフトを入れ直す必要がありません。処理の流れは、①ブラウザがアプリケーションサーバに処理を頼む → ②アプリケーションサーバがデータベースサーバとやり取りする → ③結果がHTMLで返る → ④ブラウザが表示する、です。</p>
<ul>
<li><b>バッチ処理</b>：データを一定期間ためて、まとめて処理する（給与計算、月末の集計）。</li>
<li><b>リアルタイム処理</b>：データが発生したらすぐ処理する（座席予約、ATM、機械の制御）。</li>
<li><b>シンクライアント</b>：端末には最小限の機能だけを持たせ、処理とデータはサーバ側に置く。</li>
</ul>
<div class="point"><b>試験によく出る</b>「Webシステムの特徴」：処理はサーバで行い、クライアント（ブラウザ）はHTMLの記述に従って結果を画面に表示する。HTTPで要求を出すのはクライアントの方です。</div>

<h3>システム構成による分類</h3>
<p>コンピュータの台数と使い方で、システムは主に3種類に分けられます。</p>
<div class="tw"><table class="t"><tr><th>構成</th><th>内容</th><th>信頼性</th></tr>
<tr><td>シンプレックス</td><td>1台だけのシンプルな構成</td><td>どこか1か所が壊れると全部止まる</td></tr>
<tr><td>デュプレックス</td><td>普段動かす<b>現用系</b>と、壊れたときに備えて待つ<b>待機系</b>の2台</td><td>現用系が壊れたら待機系に切り替える</td></tr>
<tr><td>デュアル</td><td><span class="mk">2台で同じ処理を同時に行い、結果を照合</span>して正しいか確かめる</td><td>最も高い。ただし処理能力は1台分</td></tr></table></div>
${FIG.duplex}
<p>デュプレックスの待機系には、2つの状態があります。</p>
<ul>
<li><b>ホットスタンバイ</b>：待機系にも電源を入れ、現用系と同じプログラムとデータを持たせておく。壊れたら<span class="mk">すぐに切り替えられる</span>（電源が入っていて「熱い」状態）。</li>
<li><b>コールドスタンバイ</b>：待機系は電源を入れずに止めておく。切替えに時間はかかるが、運用コストが安い。</li>
</ul>
<p><b>止まらないための設計</b>：利用者がほしいのはサービスなので、障害が起きてもできるだけ止まらないように設計します。</p>
<div class="tw"><table class="t"><tr><th>考え方</th><th>内容</th><th>例</th></tr>
<tr><td>フォールトトレラント</td><td>一部が壊れても、<span class="mk">全体として必要な機能を保つ</span>（冗長化）</td><td>銀行・飛行機・原子力のシステム</td></tr>
<tr><td>フェールソフト</td><td>一部が壊れたら、機能を落としてでも動き続ける（縮退運転）</td><td>エンジンが1つ止まっても飛べる飛行機</td></tr>
<tr><td>フェールセーフ</td><td>壊れたら、<span class="mk">安全な側</span>に止める</td><td>人が入るとロボットアームが止まる、故障時は信号を赤に</td></tr>
<tr><td>フールプルーフ</td><td>人が<span class="mk">間違えた使い方</span>をしても事故にならないようにする</td><td>ドアを閉めないと動かない電子レンジ</td></tr>
<tr><td>フォールトアボイダンス</td><td>質の高い部品などで、故障そのものを起こさない</td><td>部品の選別、定期点検</td></tr></table></div>
<div class="point"><b>試験によく出る</b>デュプレックスとデュアルの区別（どちらも「2」に関係するので混同しやすい）、ホットスタンバイの説明、フールプルーフの説明。</div>

<h3>RAID（ディスクで信頼性と速さを上げる）</h3>
<p><b>RAID</b>は、複数のハードディスクを1台のように扱う技術です。RAID 0〜6のレベルがありますが、数字は性能の高さではなく<b>記録方式の違い</b>です。よく使われるのは0、1、5です。</p>
${FIG.raid}
<ul>
<li><b>RAID 0（ストライピング）</b>：データを複数のディスクに<b>分散して書く</b>。並列に読み書きできるので<span class="mk">速くなる</span>が、データは1つしかないので、1台壊れると全部読めない（信頼性はむしろ下がる）。</li>
<li><b>RAID 1（ミラーリング）</b>：複数のディスクに<b>同じデータを書く</b>。1台壊れても続けられるので<span class="mk">信頼性が上がる</span>。使える容量は半分になる。</li>
<li><b>RAID 5</b>：データと<b>パリティ</b>（誤り訂正のための情報）を分散して書く。1台壊れても、残りから復元できる。使える容量は（台数−1）台分。RAID 6はパリティを2つ持ち、2台壊れても大丈夫。</li>
</ul>
<p class="small-muted">ミラーリングしたものをさらにストライピングするのが RAID 10（1＋0）です。</p>

<h3>システムの性能指標</h3>
<ul>
<li><b>スループット</b>：<span class="mk">単位時間あたりに処理する仕事の量</span>（1分に何件処理できるか）。プリンタなら1分あたりの印刷ページ数。</li>
<li><b>ターンアラウンドタイム</b>：処理を頼んでから、結果が全部出てくるまでの時間（入力＋処理＋出力）。</li>
<li><b>レスポンスタイム（応答時間）</b>：処理にかかる時間（要求してから応答が返り始めるまで）。</li>
</ul>
${FIG.tat}
<p><b>ベンチマークテスト</b>：システムの性能を比べるため、<span class="mk">利用目的に合わせて選んだ標準的なプログラムやデータ</span>を実際に動かして測るテスト。特殊なプログラムで測っても参考にならないので、ふだん使うものに近いプログラムを使います。</p>
<p><b>キャパシティプランニング</b>：システムの使われ方を見ながら、将来必要になる処理能力を計画すること。能力を上げるには2つの方法があります。</p>
${FIG.scale}
<ul>
<li><b>スケールアウト</b>：サーバの<b>台数を増やして</b>、全体の処理能力を上げる。複数のサーバに処理を振り分ける装置を<b>ロードバランサ</b>という。</li>
<li><b>スケールアップ</b>：<b>1台ずつの性能を上げる</b>（CPUを速くする、メモリを増やす）。</li>
</ul>
<p><b>待ち行列（M/M/1）</b>：窓口が1つで、客（処理の要求）がランダムに来るときの待ち時間の計算です。</p>
<div class="formula">利用率      ρ ＝ 平均到着率 × 平均サービス時間
平均待ち時間 ＝ ρ ÷ (1 − ρ) × 平均サービス時間
平均応答時間 ＝ 平均待ち時間 ＋ 平均サービス時間</div>
${FIG.rho}

<h3>システムの信頼性指標と稼働率</h3>
<p><b>RASIS</b>は、システムを評価する5つの観点の頭文字です。</p>
<div class="tw"><table class="t"><tr><th>頭文字</th><th>意味</th><th>指標の例</th></tr>
<tr><td>R：Reliability</td><td>信頼性（壊れにくさ）</td><td>MTBF</td></tr>
<tr><td>A：Availability</td><td>可用性（いつでも使えるか）</td><td>稼働率</td></tr>
<tr><td>S：Serviceability</td><td>保守性（直しやすさ）</td><td>MTTR</td></tr>
<tr><td>I：Integrity</td><td>完全性（データが壊れたり改ざんされたりしていない）</td><td></td></tr>
<tr><td>S：Security</td><td>機密性（許可された人だけが使える）</td><td></td></tr></table></div>
<ul>
<li><b>MTBF（平均故障間隔）</b>：壊れずに動いていた時間の平均。<span class="mk">大きいほど信頼性が高い</span>。定期的に部品を交換するなどの<b>予防保守</b>で長くできる。MTBF ＝ 稼働時間の合計 ÷ 故障回数。</li>
<li><b>MTTR（平均修理時間）</b>：修理にかかった（止まっていた）時間の平均。<span class="mk">小さいほど保守性が高い</span>。MTTR ＝ 故障時間の合計 ÷ 故障回数。</li>
</ul>
${FIG.mtbf}
<div class="formula">稼働率 ＝ MTBF ÷ (MTBF ＋ MTTR)　（1なら一度も止まらない）</div>
<p><b>装置のつなぎ方と稼働率</b></p>
<ul>
<li><b>直列</b>（全部動いて初めて動く）：稼働率 ＝ A × B。</li>
<li><b>並列</b>（どれか1つ動けばよい）：稼働率 ＝ 1 −（1 − A）×（1 − B）。「両方とも止まる確率」を1から引く。</li>
<li><b>直列と並列が混ざったもの</b>：内側のまとまり（並列の部分）を先に1つの装置として計算し、それから全体を計算する。</li>
</ul>
${FIG.avail}
<div class="point"><b>試験によく出る</b>「MTBFを20%改善、MTTRを10%改善したら稼働率は？」→ MTBF 3,000時間なら3,600時間、MTTR 1,000時間なら900時間にして、3,600 ÷ (3,600＋900) ＝ 0.8。改善の向き（MTBFは長く、MTTRは短く）に注意しましょう。</div>

<h3>仮想化とクラウド</h3>
<p class="small-muted">（本ではほかの章で扱う内容を、システムの構成としてまとめています）</p>
<ul>
<li><b>サーバ仮想化</b>：1台の物理サーバで複数の仮想マシンを動かす。ハードウェアの上で直接動く<b>ハイパーバイザ型</b>と、ホストOSの上で動く<b>ホスト型</b>。</li>
<li><b>コンテナ型</b>：OSの中心部分（カーネル）を共有し、アプリの実行環境だけを分ける。仮想マシンより<span class="mk">軽くて起動が速い</span>。</li>
<li><b>ライブマイグレーション</b>：仮想マシンを止めずに、別の物理サーバへ移す。</li>
<li><b>クラスタ</b>：複数のサーバを1つのシステムのように使う。障害時に別のサーバに引き継ぐのが<b>フェールオーバ</b>。</li>
<li>ストレージ：<b>NAS</b>はLANにつないで<span class="mk">ファイル単位</span>で共有、<b>SAN</b>は専用ネットワークで<span class="mk">ブロック単位</span>でアクセス。</li>
<li>クラウドの提供範囲：<b>IaaS</b>はサーバなどの基盤、<b>PaaS</b>はOS・ミドルウェアまで、<b>SaaS</b>はアプリケーションまで提供する。</li>
<li><b>エッジコンピューティング</b>：利用者や機器の近くでデータを処理して、遅延と通信量を減らす。</li>
</ul>
`,
terms:[["Webシステム", "インターネットとWebブラウザを使うシステム。クライアントに専用ソフトが不要"], ["3層クライアントサーバ", "プレゼンテーション層・ファンクション層・データ層に分けたシステム"], ["バッチ処理", "データを一定期間ためておき、まとめて処理する方式"], ["リアルタイム処理", "データが発生したらすぐに処理する方式"], ["デュアルシステム", "2台で同じ処理を同時に行い、結果を照合する構成"], ["デュプレックスシステム", "現用系と待機系の2台で構成し、障害時に待機系へ切り替える構成"], ["ホットスタンバイ", "待機系を起動状態にしておき即座に切り替える方式"], ["フォールトトレラント", "一部が故障しても、システム全体として必要な機能を維持する設計"], ["フェールセーフ", "障害時にシステムを安全な側へ動作させる設計"], ["フェールソフト", "障害時に機能を縮退して運転を継続する設計"], ["フールプルーフ", "誤操作をしても危険が生じないようにする設計"], ["ストライピング", "データを複数のディスクに分散して書き込み、高速化する方式（RAID 0）"], ["ミラーリング", "複数のディスクに同じデータを書き込み、信頼性を高める方式（RAID 1）"], ["RAID5", "パリティを分散して記録。容量はn−1台分"], ["スループット", "単位時間あたりに処理する仕事の量"], ["ターンアラウンドタイム", "処理を依頼してから結果が全部出てくるまでの時間"], ["ベンチマークテスト", "標準的なプログラムを実行してシステムの性能を測るテスト"], ["スケールアウト", "サーバの台数を増やして処理能力を上げること"], ["スケールアップ", "個々のサーバの性能を上げて処理能力を上げること"], ["M/M/1の平均待ち時間", "ρ/(1−ρ)×平均サービス時間"], ["MTBF", "平均故障間隔。長いほど信頼性が高い"], ["MTTR", "平均修理時間。短いほど保守性が高い"], ["稼働率", "MTBF ÷ (MTBF＋MTTR)"], ["コンテナ型仮想化", "ホストOSのカーネルを共有してアプリの実行環境を分ける軽量な仮想化"], ["ライブマイグレーション", "仮想マシンを止めずに別の物理サーバへ移す技術"], ["NAS", "LANに接続し、ファイル単位で共有するストレージ"], ["SAN", "専用ネットワークでブロック単位にアクセスするストレージ"], ["ロードバランサ", "複数のサーバに処理を振り分けて負荷を分散する装置"], ["SaaS", "アプリケーションをネットワーク経由で提供するサービス形態"]]},

body:`
<p><b>この章のゴール</b>：OSの4つの機能（特に<span class="mk">タスクの状態遷移と仮想記憶</span>）と、毎回のように出る<b>絶対パス・相対パス</b>、バックアップの方式を説明できること。</p>

<h3>OS（オペレーティングシステム）</h3>
<p>ソフトウェアは、<b>OS（基本ソフトウェア）</b>と、利用者に特定の機能を提供する<b>アプリケーションソフトウェア</b>に分けられます。OSはアプリとハードウェアをつなぐ架け橋で、アプリはOSの機能を<b>API（システムコール）</b>で使います。試験に出るOSの機能は主に4つです：<b>ジョブ管理・タスク管理・記憶管理・データ管理</b>。</p>
${FIG.oslayer}
<p><b>ジョブ管理</b>：利用者がコンピュータに頼む仕事のまとまり（印刷、表計算など）を<b>ジョブ</b>といい、その実行順を管理します。</p>
<ul>
<li><b>スプーリング</b>：CPUと遅い入出力装置（プリンタなど）の間のデータのやり取りを、<span class="mk">いったん高速な補助記憶にためて</span>行う。CPUはプリンタを待たずに次の仕事ができる。</li>
<li><b>バッファ</b>：速さの違う2つの装置の間で、データを一時的にためて差を吸収する記憶領域。</li>
</ul>
${FIG.spool}
<div class="point"><b>ジョブとタスク</b>人がコンピュータに出す仕事が<b>ジョブ</b>、OSがそれを細かく分けてCPUに実行させる単位が<b>タスク（プロセス）</b>です。</div>

<h3>タスク管理</h3>
<p>CPUは一度に1つのタスクしか処理できませんが、OSがタスクを細かくすばやく切り替えることで、複数のタスクを同時に動かしているように見せます。これを<b>マルチタスク</b>といいます。タスクは生まれてから終わるまでに、3つの状態を行き来します。</p>
${FIG.task}
<ol>
<li>タスクが生まれると、まず<b>実行可能状態</b>（順番待ち）になる。</li>
<li>CPUが空くと<b>実行状態</b>に移る。OSがタスクを実行状態に移すことを<b>ディスパッチ</b>という。</li>
<li>決められた時間が過ぎたり、優先度の高いタスクが来たりすると、実行可能状態に戻る。</li>
<li>入出力（ディスクの読み書きなど）を始めると<b>待ち状態</b>になり、その間CPUは別のタスクを実行する。</li>
<li>入出力が終わると<span class="mk">実行可能状態に戻る</span>（待ち状態から直接、実行状態には行かない）。</li>
</ol>
<p><b>タスクスケジューリング</b>：実行可能状態のタスクのうち、どれを実行するかを決めます。</p>
<div class="tw"><table class="t"><tr><th>方式</th><th>内容</th></tr>
<tr><td>到着順</td><td>来た順に実行する</td></tr>
<tr><td>優先度順</td><td>優先度の高いものから実行する。低いものがずっと実行されないのを防ぐため、待つほど優先度を上げる工夫を<b>エージング</b>という</td></tr>
<tr><td>ラウンドロビン</td><td><span class="mk">一定時間（タイムクウォンタム）ごとに</span>順番に切り替える</td></tr>
<tr><td>処理時間順</td><td>処理時間の短いものから実行する</td></tr></table></div>
<ul>
<li><b>プリエンプティブ</b>：CPUを使う権利を<b>OSが管理</b>し、優先度の高いタスクが来たら実行中のタスクを中断させる。</li>
<li><b>ノンプリエンプティブ</b>：CPUを使う権利を<b>タスクが管理</b>し、実行中のタスクが終わるまで切り替えない。</li>
</ul>
<p><b>排他制御</b>：複数のタスクが同じ資源（ファイルなど）を同時に使って壊さないよう、順番に使わせます（セマフォという仕組みを使う）。お互いに相手が持っている資源を待って、どちらも進めなくなるのが<b>デッドロック</b>です。</p>

<h3>記憶管理と仮想記憶</h3>
<p>記憶管理は、記憶装置を効率よく使うための機能です。試験では<b>仮想記憶</b>がよく出ます。</p>
<p><b>仮想記憶</b>は、補助記憶の一部をあたかも主記憶のように扱う方式です。これで、<span class="mk">主記憶の容量より大きなプログラムも実行</span>できます。プログラムから見える仮想的な記憶を<b>仮想記憶</b>、本物の主記憶を<b>実記憶</b>といいます。</p>
<ul>
<li><b>セグメンテーション方式</b>：仮想記憶と実記憶を、長さの決まっていない<b>セグメント</b>に分けて管理する。</li>
<li><b>ページング方式</b>（よく出る）：仮想記憶と実記憶を、同じ大きさの<b>ページ</b>に分けて対応づけて管理する。どのページが実記憶のどこにあるかは<b>ページテーブル</b>で管理する。</li>
</ul>
${FIG.paging}
<ul>
<li><b>ページフォールト</b>：使いたいページが実記憶にないときに起こる割込み。</li>
<li><b>ページイン／ページアウト</b>：補助記憶から実記憶へ読み込むのがページイン、実記憶から補助記憶へ追い出すのがページアウト。</li>
<li><b>ページ置換えアルゴリズム</b>（どのページを追い出すか）：<b>FIFO</b>（最も前に読み込んだもの）、<span class="mk"><b>LRU</b>（最後に使われてから最も時間がたっているもの）</span>、<b>LFU</b>（使われた回数が最も少ないもの）。試験に多いのはLRU。</li>
<li><b>スラッシング</b>：実記憶が小さすぎて、ページイン・ページアウトが頻繁に起き、処理がほとんど進まなくなる状態。</li>
</ul>
<p class="small-muted">関連用語：空き領域が細切れになる<b>フラグメンテーション</b>（まとめ直すのがコンパクション）、プログラムが使い終わったメモリを返さず空きが減っていく<b>メモリリーク</b>、プログラム単位で主記憶と補助記憶を入れ替える<b>スワッピング</b>。</p>

<h3>データ管理とファイルシステム</h3>
<p><b>ファイルシステム</b>は、データのまとまりを<b>ファイル</b>として扱い、人にわかりやすく管理する仕組みです。ファイルを入れる場所が<b>ディレクトリ</b>（フォルダ）で、ディレクトリは木のような<b>ツリー構造</b>で管理されます。</p>
<ul>
<li><b>ルートディレクトリ</b>：ツリーのいちばん上（ルートは「根」）。「/」で表す。</li>
<li><b>カレントディレクトリ</b>：今いる（作業している）ディレクトリ（カレントは「現在の」）。</li>
<li><b>パス</b>：ファイルやディレクトリの場所を示す文字列。</li>
</ul>
${FIG.paths}
<div class="tw"><table class="t"><tr><th>書き方</th><th>意味</th></tr>
<tr><td>絶対パス</td><td><span class="mk">ルートディレクトリから</span>たどって指定する（/音楽/どんぐり.mp3）</td></tr>
<tr><td>相対パス</td><td><span class="mk">カレントディレクトリから</span>たどって指定する</td></tr>
<tr><td>..（ドット2つ）</td><td>1つ上のディレクトリ</td></tr>
<tr><td>.（ドット1つ）</td><td>カレントディレクトリ自身</td></tr></table></div>
<div class="point"><b>試験によく出る</b>パスの指定はほぼ毎回出ます。区切り文字（/ や \\）は問題文に書いてあるので、ツリーを指でたどりながら「上がるなら ..」「下がるなら名前」と1段ずつ書けば解けます。</div>

<h3>バックアップ</h3>
<p><b>バックアップ</b>は、データが壊れたり消えたりしても元に戻せるよう、いつも使っている記憶装置とは<b>別の装置</b>に複製しておくことです。</p>
<div class="tw"><table class="t"><tr><th>方式</th><th>保存するもの</th><th>戻すときに使うもの</th></tr>
<tr><td>フルバックアップ</td><td>毎回<b>全部</b></td><td>最新のフルだけ。戻すのは速いが、取るのに時間がかかる</td></tr>
<tr><td>差分バックアップ</td><td><span class="mk">前回のフル</span>から増えた・変わった分</td><td>フル＋最新の差分の2つ</td></tr>
<tr><td>増分バックアップ</td><td><span class="mk">前回のバックアップ（種類を問わず）</span>から増えた・変わった分</td><td>フル＋それ以降の増分を全部（順番に）</td></tr></table></div>
${FIG.backup}
<p>差分は取るたびに量が増えますが、戻すのは簡単です。増分は毎回の量は少ないですが、戻すときに全部の増分が必要で手間がかかります。</p>
<p class="small-muted">似た言葉：データの複製を別のコンピュータにリアルタイムで作り同じ状態に保つ<b>レプリケーション</b>、使わなくなったデータを保管用にまとめて長期保存する<b>アーカイブ</b>。</p>

<h3>開発ツール</h3>
<p>人が読み書きしやすいプログラム言語で書いたものを<b>ソースコード</b>、コンピュータが分かる0と1の並び（機械語）に直したものを<b>オブジェクトコード</b>といいます。</p>
<ul>
<li><b>コンパイラ</b>：ソースコードを<b>まとめて</b>オブジェクトコードに翻訳する。手順は 字句解析 → 構文解析 → 意味解析 → <b>最適化</b> → コード生成。最適化（より効率のよいプログラムに変える）を行うものを<b>最適化コンパイラ</b>という。</li>
<li><b>リンカ</b>：オブジェクトコードに、ライブラリなど必要な部品をつなぎ合わせて、実行できるプログラム（<b>ロードモジュール</b>）を作る。実行前につなぐのが<b>静的リンク</b>、実行時につなぐのが<b>動的リンク</b>。</li>
<li><b>インタプリタ</b>：ソースコードを<b>1文ずつ</b>解釈しながら実行する。書いたらすぐ動かせる。</li>
</ul>
${FIG.compile}
<p><b>テスト</b>：人が集まってチェックする<b>レビュー</b>と、コンピュータを使うテストがあります。コンピュータを使うテストは、プログラムを動かさずに調べる<b>静的テスト</b>（<span class="mk">ソースコード解析ツール</span>がこれに入る）と、実際に動かして調べる<b>動的テスト</b>に分けられます。</p>
<div class="point"><b>試験によく出る</b>コンパイラの処理の順番と内容、最適化コンパイラ、リンカ、ソースコード解析ツール（静的テストツール）。</div>

<h3>オープンソースソフトウェア（OSS）</h3>
<p><b>OSS</b>は、ソースコードが公開されていて、誰でも自由に見たり、改良したり、再配布したりできるソフトウェアです（Linux、Android、Firefox、MySQLなど）。</p>
<ul>
<li><b>Eclipse</b>：代表的なOSSの<b>統合開発環境（IDE）</b>。IDEは、エディタ・コンパイラ・テストツールなど開発に使う道具を1つにまとめたもの。</li>
<li><b>コピーレフト</b>：著作権は作者が持ったまま、誰でも使い・改変し・再配布でき、<span class="mk">改変したもの（派生物）にも元と同じ条件を求める</span>考え方。代表が<b>GPL</b>。</li>
<li>コピーレフトのないライセンス：MIT、<b>BSD</b>、Apache。改変物を公開しなくてもよい。</li>
<li><b>デュアルライセンス</b>：1つのソフトを2つの異なるライセンスで提供する。</li>
</ul>

body:`
<p><b>この章のゴール</b>：半導体メモリの種類（<span class="mk">DRAMとSRAMの違い</span>、フラッシュメモリ）と、それを作る電子部品を説明できること。システムは「ハードウェア」と「ソフトウェア」でできていて、この章はハードウェアの話です。</p>

<h3>半導体メモリ</h3>
<p><b>半導体</b>は、電気を通す「導体」と通さない「絶縁体」の中間の性質を持つ物質です。温度を変えたり不純物を加えたりすると、電気の通しやすさが変わります。この性質を使ってデータを保存するのが<b>半導体メモリ</b>です（記憶の方法には、磁気＝HDD、光＝DVD、電気＝半導体メモリがあります）。</p>
${FIG.memtree}
<p><b>RAM と ROM</b></p>
<ul>
<li><b>RAM</b>：<span class="mk">揮発性メモリ</span>。電源を切るとデータが消える（揮発＝蒸発しやすい）。主記憶やキャッシュメモリに使う。</li>
<li><b>ROM</b>：<span class="mk">不揮発性メモリ</span>。電源を切ってもデータが残る。SSDやUSBメモリに使う。</li>
</ul>
<p><b>DRAM と SRAM</b>（よく出る）</p>
<div class="tw"><table class="t"><tr><th></th><th>DRAM</th><th>SRAM</th></tr>
<tr><td>リフレッシュ</td><td><span class="mk">必要</span>（1秒に何度も電荷を補う）</td><td>不要</td></tr>
<tr><td>速さ</td><td>SRAMより遅い</td><td><b>高速</b></td></tr>
<tr><td>容量・値段</td><td>回路が単純で小さく、<b>大容量を安く</b>作れる</td><td>値段が高い</td></tr>
<tr><td>使う部品</td><td>コンデンサ</td><td>フリップフロップ回路</td></tr>
<tr><td>主な用途</td><td><b>主記憶</b></td><td><b>キャッシュメモリ</b></td></tr></table></div>
<p><b>SDRAM</b>はDRAMの一種で、CPUのクロックと<b>同期して</b>（Synchronous）動きます。</p>
<p><b>フラッシュメモリ</b>：電気的にデータを書き換えられるROM（不揮発性）。SSDやUSBメモリの中身です。読み書きは<b>ページ</b>単位、消去は複数のページをまとめた<span class="mk"><b>ブロック</b>単位</span>で行います。</p>
<p class="small-muted">ROMの種類：製造時に内容を書き込み書き換えられない<b>マスクROM</b>、紫外線で消して書き換える<b>EPROM</b>、電気で消して書き換える<b>EEPROM</b>（フラッシュメモリはこの仲間）。</p>
<div class="point"><b>試験によく出る</b>「DRAMはSRAMより大容量を安く作れる」「SRAMはリフレッシュ不要」「フラッシュメモリはブロック単位で電気的に消去できる」。逆の組合せの選択肢がひっかけになります。</div>

<h3>電子回路</h3>
<p>半導体メモリの中で、「0」か「1」の1ビットを保存する入れ物を<b>メモリセル</b>といいます。半導体メモリは無数のメモリセルでできていて、DRAMとSRAMではメモリセルを作る部品が違います。</p>
<ul>
<li><b>コンデンサ</b>：電気をためられる電子部品。<span class="mk">DRAM</span>のメモリセルに使う。ためた電気は少しずつ抜けるので、リフレッシュが必要。値段が安い。</li>
<li><b>フリップフロップ回路</b>：1ビットを保存できる<b>順序回路</b>（今の入力だけでなく、前の状態で出力が決まる回路）。2つの安定した状態を持ち、電圧を保ち続けられるのでリフレッシュが不要で速い。<span class="mk">SRAM</span>（キャッシュメモリ）に使う。</li>
</ul>
<p>その他のハードウェアの用語</p>
<ul>
<li><b>チャタリング</b>：機械式スイッチのオン・オフが切り替わる短い間に、意図しないオン・オフが何度もくり返される現象（1回クリックしたのにダブルクリックになるなど）。</li>
<li><b>7セグメントLED</b>：7本の棒状のLED（と小数点）を組み合わせて数字を表示する部品。電圧が高いときに光る<b>カソードコモン型</b>と、低いときに光る<b>アノードコモン型</b>がある。</li>
</ul>
${FIG.seg7}

<h3>集積回路と省電力</h3>
<p class="small-muted">（シラバスの範囲を補う節です）</p>
<ul>
<li><b>FPGA</b>：<span class="mk">製造した後で、利用者が論理回路を書き換えられる</span>集積回路。</li>
<li><b>ASIC</b>：特定の用途向けに設計した集積回路。<b>SoC</b>：CPU・メモリ・入出力などを1つのチップにまとめたもの。</li>
<li>省電力：使っていない回路へのクロックを止める<b>クロックゲーティング</b>、電源そのものを止める<b>パワーゲーティング</b>。</li>
</ul>

<h3>組込みシステムと制御</h3>
<p>家電・自動車・産業機器などに組み込まれたコンピュータを<b>組込みシステム</b>といいます。決められた時間内に処理を終える必要があるので、<b>リアルタイムOS</b>を使うことが多いです（本ではビジネスインダストリの章で扱う内容です）。</p>
<ul>
<li><b>ウォッチドッグタイマ</b>：プログラムが一定時間ごとにタイマをリセットする。リセットされないと異常（暴走）とみなして再起動などを行う。</li>
<li><b>センサ</b>（温度・加速度・ジャイロ・照度など）が測り、<b>アクチュエータ</b>（モータなど）が動かす。</li>
<li><b>フィードバック制御</b>：結果を測って目標とのずれを修正し続ける（エアコンの温度調整）。<b>フィードフォワード制御</b>：乱れを予測して先に手を打つ。<b>シーケンス制御</b>：決められた順序で段階的に進める（洗濯機）。</li>
<li><b>PWM制御</b>：電気を流す時間の割合を変えて、モータの回転やLEDの明るさを調整する。</li>
<li><b>IoT</b>：さまざまな機器をインターネットにつなぐ。少ない電力で広い範囲と通信する<b>LPWA</b>、機器の近くで処理する<b>エッジコンピューティング</b>、軽い通信プロトコルの<b>MQTT</b>。現実の状態を仮想空間に再現する<b>デジタルツイン</b>。</li>
</ul>
${FIG.feedback}

body:`
<p><b>この章のゴール</b>：GUIの部品の違いと、マルチメディアの用語（<span class="mk">アンチエイリアシング、テクスチャマッピング、PCM、H.264</span>など）を説明できること。出題数は多くありませんが、用語さえ覚えれば確実に取れる章です。</p>

<h3>ユーザーインタフェース技術</h3>
<p><b>ユーザーインタフェース（UI）</b>は、利用者と機械が触れ合う面のことです。アイコンやボタンを画面に表示して、マウスや指で操作する方式を<b>GUI</b>（グラフィカルユーザーインタフェース）といいます。試験では、次の4つのGUI部品を区別する問題がよく出ます。</p>
${FIG.gui}
<div class="tw"><table class="t"><tr><th>部品</th><th>使いどころ</th></tr>
<tr><td>ラジオボタン</td><td>選択肢から<span class="mk">1つだけ</span>選ぶ（丸い形）。試験では「互いに排他的な（どれか1つしか成り立たない）選択肢から1つを選ぶ」と表現される</td></tr>
<tr><td>チェックボックス</td><td>当てはまるものを<span class="mk">いくつでも</span>選ぶ（四角い形）</td></tr>
<tr><td>プルダウンメニュー</td><td>押すと一覧が開き、その中から1つ選ぶ。選択肢が多くても狭い場所に置ける</td></tr>
<tr><td>コンボボックス</td><td>プルダウンメニューに、<span class="mk">文字を手入力できる枠</span>を付けたもの</td></tr></table></div>
<p class="small-muted">ほかにも、オン・オフを切り替えるトグルボタン、マウスを重ねると説明が出るツールチップなどがあります。</p>

<h3>ユーザーインタフェース設計</h3>
<p><b>ユーザビリティ</b>は「使いやすさ」のことで、JIS（日本産業規格）では、特定の利用者が目的を達成するときの<b>有効さ・効率・満足度</b>の度合いとされています。試験では「利用者が<span class="mk">どれだけストレスを感じずに</span>、目標とする要求を達成できるか」と表現されます。</p>
<p>使いやすさのための機能と、その目的もよく出ます。</p>
<ul>
<li><b>マクロ機能</b>：決まった作業の操作をまとめて記録し、1回で実行できるようにする → <b>定型的な作業の操作を減らす</b>。</li>
<li><b>ショートカットキー</b>：キーの組合せで機能を呼び出す → <b>よく行う操作を効率よく行う</b>。</li>
<li><b>Undo（元に戻す）</b>：直前の操作を取り消して元の状態に戻す。</li>
<li><b>オンラインヘルプ</b>：画面上で操作の説明を見られる。<b>プログレスバー</b>：作業がどこまで進んだかを表示する。</li>
</ul>
<p>関連する用語（区別させる問題が出ます）</p>
<ul>
<li><b>ユニバーサルデザイン</b>：年齢・文化・言語・能力・障害の有無などにかかわらず、<span class="mk">はじめからすべての人が使いやすい</span>ように設計すること（ユニバーサル＝万国共通の）。</li>
<li><b>バリアフリーデザイン</b>：高齢者や障害のある人が生活するうえでの<b>障壁（バリア）を取り除く</b>こと。</li>
<li><b>Webアクセシビリティ</b>：年齢や身体の条件にかかわらず、<b>誰もがWebの情報を利用できる</b>こと。</li>
<li><b>UX（ユーザー体験）</b>：使う前・使っている間・使った後の体験の全体。典型的な利用者像を1人の人物として描くのが<b>ペルソナ</b>。</li>
<li>評価の方法：専門家が経験則に照らして問題を探す<b>ヒューリスティック評価</b>、利用者に話を聞く<b>インタビュー法</b>、実際に使ってもらい観察する<b>ユーザテスト</b>。</li>
<li><b>レスポンシブWebデザイン</b>：画面の大きさ（パソコン・スマホ）に合わせてレイアウトを変える。</li>
</ul>
<p><b>コード設計と入力チェック</b>（画面から入力されるデータの誤りを防ぐ工夫）</p>
<ul>
<li><b>チェックディジット</b>：コードに検査用の数字を1桁付け、<span class="mk">入力の誤りを検出</span>する。</li>
<li>入力チェック：数字かどうか（ニューメリック）、範囲内か（リミット）、形式が正しいか、マスタにあるか（照合）、組合せに矛盾がないか（論理）、重複していないか。</li>
<li>コードの種類：連番コード、区分コード、桁ごとに意味を持たせる桁別コード、見て内容が分かる表意コード。</li>
</ul>

<h3>マルチメディア技術（文字・音声）</h3>
<p><b>マルチメディア</b>は、文字・音声・静止画・動画をまとめて扱う技術です。</p>
<p><b>文字（フォント）</b></p>
<ul>
<li><b>ビットマップフォント</b>：文字を点（ドット）の集まりで表す。拡大するとギザギザになる。</li>
<li><b>アウトラインフォント</b>：文字の輪郭を線（数式）の情報として持ち、拡大・縮小のたびに形を計算し直す。<span class="mk">どんなに拡大しても滑らか</span>。</li>
</ul>
<p><b>音声（PCM）</b>：<b>PCM</b>（パルス符号変調）は、音声などのアナログ信号をデジタル信号にする方式です。</p>
${FIG.pcm}
<ol>
<li><b>標本化（サンプリング）</b>：一定の時間ごとに、波の値を取り出す。1秒に何回取るかが<b>標本化周波数</b>。</li>
<li><b>量子化</b>：取り出した値を、決まった段階の数値に丸める。段階の細かさが<b>量子化ビット数</b>。</li>
<li><b>符号化</b>：その数値を0と1のビット列にする。</li>
</ol>
<div class="formula">音声のデータ量 ＝ 標本化周波数 × 量子化ビット数 × 秒数（× チャンネル数）
例：8kHz・8ビットで1秒 → 8,000 × 8 ＝ 64,000ビット ＝ 8,000バイト</div>
<p class="small-muted"><b>標本化定理</b>：元の音の最高周波数の<b>2倍より高い</b>周波数で標本化すれば、元の音を再現できます。音声の圧縮形式には MP3、AAC があります。</p>

<h3>マルチメディア技術（画像・動画）</h3>
<p><b>静止画</b>（写真やイラストなど動かない画像）の処理の用語です。</p>
<ul>
<li><b>クリッピング</b>：画像の一部を切り抜くこと。表示する範囲（ウィンドウ）を決めて、その外側を表示しない。</li>
<li><b>アンチエイリアシング</b>：液晶ディスプレイなどで、<span class="mk">斜めの線や文字の輪郭のギザギザを目立たなくする</span>ため、境目の画素に中間の色を付ける。</li>
<li><b>テクスチャマッピング</b>：物体の表面に<span class="mk">模様などの画像を貼り付けて</span>質感を出す。</li>
<li><b>レンダリング</b>：3次元のデータから画像を作ること。光の反射や屈折を計算する方法に<b>レイトレーシング</b>がある。</li>
<li><b>モーフィング</b>：ある形が少しずつ変わって、別の形になっていく映像。</li>
</ul>
${FIG.antialias}
<ul>
<li><b>ラスタ画像</b>：点（画素）の集まり。写真向きで、拡大するとギザギザになる（JPEG・PNG・GIF）。<b>ベクタ画像</b>：線や図形を数式で表す。拡大しても滑らか（SVG）。</li>
<li>光の3原色 <b>RGB</b>：混ぜるほど明るく白に近づく<b>加法混色</b>（ディスプレイ）。色の3原色 <b>CMY</b>：混ぜるほど暗くなる<b>減法混色</b>（印刷。黒を足して CMYK）。</li>
</ul>
<div class="formula">画像のデータ量 ＝ 横の画素数 × 縦の画素数 × 1画素のビット数
例：1,000 × 800画素、24ビット（3バイト）カラー → 1,000 × 800 × 3 ＝ 2.4Mバイト</div>
<p><b>動画</b>はパラパラ漫画と同じで、少しずつ違う静止画を続けて表示したものです。データ量がとても多いので圧縮します。</p>
<ul>
<li><b>H.264／MPEG-4 AVC</b>：動画を圧縮する方式。ほかの方式より圧縮率が高く、ワンセグ放送やネットの動画配信、ブルーレイなどで広く使われている（よく出る）。</li>
<li>そのほか：MPEG-2（DVD・デジタル放送）、H.265（さらに高い圧縮率）。</li>
<li><b>VR</b>（仮想空間に入り込む）、<b>AR</b>（現実の映像に情報を重ねる）、<b>MR</b>（現実と仮想を融合して操作できる）、<b>メタバース</b>（多人数が参加するネット上の仮想空間）。</li>
</ul>
`,
